<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1410">
  <meta name="description" content="The official Level Up ’26 college sports and games gala match centre. Follow fixtures, live scores and championship standings.">
  <title>Level Up ’26 · Match Centre</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=DM+Sans:wght@400;500;600;650;700;750&display=swap');

    :root {
      color-scheme: dark;
      --outer-bg: #070b09;
      --bg: #0e1511;
      --panel: #16201a;
      --panel-2: #1c2821;
      --line: #2c3a31;
      --lime: #c2f568;
      --text: #f3f5ec;
      --muted: #9ea99c;
      --danger: #ff6559;
      --warn: #f9d452;
      --title: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
      --body: 'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--outer-bg); color: var(--text); font: 15px/1.45 var(--body); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button, a, select { touch-action: manipulation; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
    button:disabled { opacity: .5; }
    .hidden, [hidden] { display: none !important; }

    /* App Frame - Comfortable PC Width (not full screen) & Clip Inside */
    .app-frame {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      overflow-x: clip;
      box-shadow: 0 0 0 1px #1e2922, 0 24px 60px rgba(0, 0, 0, .65);
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar { position: sticky; top: 0; z-index: 20; background: rgba(14, 21, 17, .92); backdrop-filter: blur(14px); border-bottom: 1px solid #222e26; padding: 0 20px; }
    .top-inner { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-icon { display: grid; place-items: center; border-radius: 10px; background: var(--lime); width: 38px; height: 38px; color: #132012; font: italic 800 18px/1 var(--title); letter-spacing: -.04em; overflow: hidden; flex: none; }
    .brand-icon img { height: 100%; width: 100%; object-fit: contain; }
    .brand-icon.photo { background: none; }
    .brand b { display: block; font: italic 800 22px/.92 var(--title); letter-spacing: -.03em; }
    .brand i { color: var(--lime); font-style: italic; }
    .brand small { display: block; color: var(--muted); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-top: 2px; }
    .menu-btn { width: 40px; height: 40px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); color: var(--text); display: grid; place-items: center; }
    .menu-btn:hover { border-color: var(--lime); color: var(--lime); }

    .ico { width: 1.2em; height: 1.2em; display: inline-block; vertical-align: -.2em; flex: none; }
    .skip { position: absolute; left: -200vw; }
    .skip:focus { left: 10px; top: 10px; z-index: 50; background: #17251f; padding: 10px; }

    /* Slide Drawer - Contained Inside Web App Frame */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 8, 6, .72);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(320px, 84%);
      background: #131c17;
      border-left: 1px solid #2b382f;
      z-index: 45;
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.22, 1, .36, 1);
      display: flex;
      flex-direction: column;
      padding: 18px;
      overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-inner-sticky {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .drawer-head strong { font: italic 800 22px/1 var(--title); text-transform: uppercase; letter-spacing: -.02em; }
    .drawer-head strong span { color: var(--lime); }
    .drawer-nav { display: grid; gap: 9px; }
    .drawer-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-weight: 650; font-size: 14px; text-align: left; width: 100%; }
    .drawer-item-left { display: flex; align-items: center; gap: 11px; }
    .drawer-item:hover { border-color: var(--lime); background: var(--panel-2); }
    .drawer-item.accent { background: var(--lime); color: #132012; border-color: var(--lime); font-weight: 750; }
    .drawer-item.accent:hover { background: #d5ff89; }
    .drawer-sep { height: 1px; background: var(--line); margin: 4px 0; }

    /* Main Content */
    main.container { padding: 18px 20px 98px; flex: 1; }
    #public-shell h1, #public-shell h2, #public-shell h3, #public-shell p { margin: 0; }
    #public-shell h1, #public-shell h2, #public-shell h3 { font-family: var(--title); line-height: 1.02; }
    #public-shell h1, #public-shell h2 { text-transform: uppercase; }
    .loading, .notice { margin: 18px 0; color: var(--muted); }

    /* Hero */
    .hero { position: relative; overflow: hidden; isolation: isolate; border: 1px solid #354738; border-radius: 18px; background: radial-gradient(circle at 85% 20%, rgba(194, 245, 104, .22), transparent 52%), linear-gradient(135deg, #16291c 0%, #1d3524 60%, #2c4727 100%); padding: 26px 24px; }
    .hero:before, .hero:after { content: ""; position: absolute; inset: 0; z-index: -1; }
    .hero:before { background: url('./assets/pitch.jpg') center/cover no-repeat; opacity: .35; }
    .hero:after { background: linear-gradient(180deg, rgba(10, 22, 14, .45), rgba(10, 22, 14, .92)); }
    .hero-kicker { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--lime); }
    .hero-kicker:before { content: ""; width: 16px; height: 2px; background: var(--lime); }
    .hero h1 { font-size: clamp(46px, 7vw, 60px); font-weight: 800; font-style: italic; letter-spacing: -.04em; line-height: .88; margin-top: 8px; }
    .hero h1 span { color: var(--lime); }
    .hero-bottom { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hero-actions { display: flex; gap: 9px; }
    .primary, .secondary, .link-btn, .seg, .tool-input { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; }
    .primary, .secondary { border-radius: 10px; padding: 10px 16px; border: 1px solid transparent; font-size: 13.5px; }
    .primary { background: var(--lime); color: #142013; }
    .secondary { background: rgba(24, 38, 28, .85); border-color: #465a48; color: var(--text); }
    .primary:hover { background: #d7ff91; }
    .secondary:hover { border-color: var(--lime); }
    .stats { display: inline-flex; gap: 16px; padding: 8px 14px; background: rgba(12, 20, 15, .75); border: 1px solid rgba(194, 245, 104, .22); border-radius: 10px; }
    .stats > div + div { padding-left: 16px; border-left: 1px solid #354738; }
    .stats strong { font: 700 22px/1 var(--title); color: var(--lime); display: block; }
    .stats small { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-top: 2px; }

    /* Cards & Lists */
    .section { margin-top: 24px; }
    .sect-head, .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .sect-head h2 { font-size: 28px; font-style: italic; letter-spacing: -.02em; }
    .link-btn { font-size: 13px; color: var(--lime); background: none; border: none; padding: 4px 0; }
    .card, .fixture, .team-tile, .rank-row, .sport-table, .live-article { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; }
    .empty { padding: 16px; display: flex; align-items: center; gap: 14px; }
    .empty-icon { width: 40px; height: 40px; border: 1px solid #3a4c3d; background: #1f2e24; border-radius: 11px; display: grid; place-items: center; color: var(--lime); flex: none; }
    .empty strong { font-size: 14.5px; display: block; }
    .empty p, .muted, .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* Announcements & Contacts */
    .announce-list { display: grid; gap: 9px; }
    .announce-card { padding: 13px 15px; border-radius: 13px; background: linear-gradient(90deg, rgba(194, 245, 104, .11), rgba(22, 32, 26, .95)); border: 1px solid rgba(194, 245, 104, .32); display: flex; gap: 11px; align-items: flex-start; }
    .announce-badge { padding: 3px 7px; border-radius: 6px; background: var(--lime); color: #132012; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; flex: none; margin-top: 2px; }
    .announce-card strong { display: block; font-size: 14.5px; color: var(--text); }
    .announce-card p { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .contact-card { padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .contact-info { min-width: 0; display: grid; gap: 2px; }
    .contact-info b { font: 700 20px/1.1 var(--title); letter-spacing: .01em; color: var(--text); }
    .contact-role { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--lime); }
    .contact-num { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
    .call-btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 15px; border-radius: 10px; background: var(--lime); color: #132012; font-weight: 750; font-size: 13.5px; flex: none; }
    .call-btn:hover { background: #d6ff8e; }

    /* Teams */
    .teams-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 640px) {
      .teams-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .team-tile { display: flex; align-items: center; gap: 11px; padding: 13px 12px; position: relative; overflow: hidden; text-align: left; width: 100%; }
    .team-tile:before { position: absolute; top: 0; left: 0; bottom: 0; width: 3.5px; background: var(--team); content: ""; }
    .team-tile b, .team-line b { font: 700 20px/1.05 var(--title); letter-spacing: .01em; }
    .team-caption { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .crest { width: 40px; height: 40px; background: color-mix(in srgb, var(--team) 18%, #18221b); border: 1px solid color-mix(in srgb, var(--team) 45%, #344437); border-radius: 10px; display: inline-grid; place-items: center; color: var(--text); flex: none; font: 700 18px/1 var(--title); overflow: hidden; }
    .crest img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }

    /* Bottom Navigation */
    .bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 760px; z-index: 25; border-top: 1px solid #2b382f; background: rgba(14, 21, 17, .94); backdrop-filter: blur(14px); padding-bottom: env(safe-area-inset-bottom); }
    .nav-inner { display: flex; justify-content: space-around; }
    .nav-inner a { flex: 1; color: var(--muted); min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 650; font-size: 11px; position: relative; }
    .nav-inner a .ico { width: 19px; height: 19px; }
    .nav-inner a[aria-current=page] { color: var(--lime); }
    .nav-inner a[aria-current=page]:after { content: ""; height: 3px; background: var(--lime); width: 32px; position: absolute; top: 0; border-radius: 0 0 3px 3px; }

    /* Fixtures & Standings */
    .page-head { margin: 6px 0 16px; display: block; }
    .page-head h1 { font-size: 42px; font-style: italic; letter-spacing: -.03em; }
    .page-head p { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
    .tools, .chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .tools { margin-bottom: 16px; }
    .seg, .tool-input { font-size: 12.5px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; }
    .seg.active { background: var(--lime); border-color: var(--lime); color: #142013; }
    .tool-input { max-width: 100%; min-height: 36px; }
    .fixture-list, .rank-list { display: grid; gap: 10px; }
    @media (min-width: 660px) {
      .fixture-list.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .fixture { padding: 14px 16px; display: block; }
    .fixture:hover, .team-tile:hover, .rank-row summary:hover { border-color: #628554; background: var(--panel-2); }
    .info-line, .foot-line { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .fixture-sport, .meta { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border: 1px solid #3f4f41; color: #c0c9bc; background: #202d23; border-radius: 6px; padding: 2px 7px; display: inline-flex; align-items: center; gap: 5px; }
    .tag.live { color: #cbff9a; border-color: #53864b; background: #253e29; }
    .tag.live:before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--lime); animation: pulse 1.5s infinite; }
    .tag.finished { color: #c2d6f8; }
    .tag.stopped { color: #f9d452; border-color: #6e5d28; background: #2d2716; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }

    .team-line { display: flex; align-items: center; gap: 9px; margin-top: 9px; min-width: 0; }
    .team-line strong { margin-left: auto; font: 700 22px var(--title); }
    .team-line .crest, .stand-team .crest { width: 26px; height: 26px; border-radius: 7px; font-size: 12px; }
    .serve-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); display: inline-block; box-shadow: 0 0 8px var(--lime); flex: none; }
    .foot-line { margin-top: 10px; padding-top: 8px; border-top: 1px solid #28352c; flex-wrap: wrap; justify-content: flex-start; color: var(--muted); font-size: 11.5px; }
    .fixture-title { margin-top: 8px; font-size: 22px; }
    .day-title { font-size: 18px; margin: 16px 0 8px; color: var(--lime); }
    .group { margin: 12px 0 22px; }

    .sport-table { overflow: auto; }
    #public-shell table { border-collapse: collapse; width: 100%; text-align: center; font-size: 13.5px; }
    #public-shell th, #public-shell td { padding: 11px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    #public-shell thead th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: #1a261f; }
    #public-shell tbody tr:last-child td { border-bottom: 0; }
    #public-shell th:nth-child(2), #public-shell td:nth-child(2) { text-align: left; }
    .stand-team { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .live-pill-mini { font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 4px; background: #27432b; color: var(--lime); border: 1px solid #4e7e46; letter-spacing: .06em; }

    /* Leaderboard */
    .rank-row summary { cursor: pointer; display: flex; align-items: center; gap: 11px; padding: 12px 15px; list-style: none; }
    .rank-row summary::-webkit-details-marker { display: none; }
    .rank-index { min-width: 24px; font: 700 22px var(--title); color: var(--lime); }
    .rank-name { flex: 1; min-width: 0; }
    .rank-name b { display: block; font-size: 15.5px; }
    .rank-name small { color: var(--muted); font-size: 12px; }
    .rank-points { font: 700 22px var(--title); color: var(--lime); }
    .rank-points small { font: 600 10px var(--body); color: var(--muted); margin-left: 3px; }
    .award-list { padding: 0 15px 12px 48px; font-size: 13px; color: var(--muted); }
    .award-list li { margin: 4px 0; }
    .badge-count { font: 700 11px var(--body); vertical-align: middle; margin-left: 6px; color: var(--lime); background: #253623; border: 1px solid #465d41; border-radius: 99px; padding: 2px 8px; }

    /* Match Detail & Clock */
    .live-article { padding: 18px; margin-top: 12px; }
    .match-clock-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 6px; }
    .match-clock-banner { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 99px; background: #1f3324; border: 1px solid #476d44; color: var(--lime); font: 700 13.5px/1 var(--body); font-variant-numeric: tabular-nums; }
    .match-clock-banner.stopped { background: #2b2617; border-color: #6b5a27; color: #f9d452; }
    .extra-time-pill { display: inline-block; padding: 2px 8px; border-radius: 6px; background: rgba(249, 212, 82, .16); border: 1px solid rgba(249, 212, 82, .45); color: #f9d452; font: 800 10.5px/1.1 var(--body); letter-spacing: .04em; }
    .match-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; padding: 20px 0; }
    .match-side { display: grid; justify-items: center; gap: 7px; font: 700 20px/1.1 var(--title); }
    .match-side small.roster-tag { font: 600 11.5px/1.25 var(--body); color: var(--muted); max-width: 170px; }
    .match-score > strong { font: 800 48px/1 var(--title); color: var(--lime); white-space: nowrap; }
    .match-score > strong > small { display: block; font: 600 11px var(--body); color: var(--muted); margin-top: 5px; }
    .subhead { font-size: 21px; margin: 20px 0 8px; }

    /* Bout Cards */
    .bout-list { display: grid; gap: 8px; margin-top: 8px; }
    .bout-card { padding: 11px 13px; border-radius: 11px; background: #1a261f; border: 1px solid var(--line); display: grid; gap: 6px; }
    .bout-card.active { border-color: var(--lime); background: #203125; }
    .bout-head { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .bout-versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; }
    .bout-side { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .bout-side.away { justify-content: flex-end; text-align: right; }
    .bout-side.win { color: var(--lime); }
    .bout-vs { font: 800 13px/1 var(--title); color: var(--muted); }
    .win-badge { font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px; background: var(--lime); color: #132012; text-transform: uppercase; flex: none; }

    /* Badminton Court Banner */
    .badminton-panel { padding: 14px; border-radius: 12px; background: linear-gradient(180deg, #1b382c 0%, #152b22 100%); border: 1.5px solid #487660; margin-top: 10px; }
    .badminton-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
    .badminton-side { padding: 10px; border-radius: 9px; background: rgba(12, 20, 15, .55); border: 1px solid rgba(255,255,255,.08); }
    .badminton-side.serving { border-color: var(--lime); background: rgba(194, 245, 104, .12); }
    .badminton-pts { font: 800 34px/1 var(--title); color: var(--text); }
    .badminton-side.serving .badminton-pts { color: var(--lime); }
    .serve-pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; padding: 2px 7px; border-radius: 99px; background: var(--lime); color: #132012; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }

    /* Interactive Pitch & Court */
    .pitch-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .pitch-tab { flex: 1; padding: 8px 10px; border-radius: 9px; background: #1b271f; border: 1px solid var(--line); color: var(--muted); font-weight: 700; font-size: 12.5px; }
    .pitch-tab.active { background: var(--lime); color: #132012; border-color: var(--lime); }
    .pitch-stage { position: relative; width: 100%; max-width: 460px; margin: 0 auto; aspect-ratio: 3 / 4; max-height: 440px; border-radius: 14px; border: 2px solid #678e6a; background: radial-gradient(circle at 50% 50%, transparent 14%, rgba(255,255,255,.22) 14.5%, rgba(255,255,255,.22) 15.5%, transparent 16%), linear-gradient(to bottom, transparent 49.6%, rgba(255,255,255,.25) 49.8%, rgba(255,255,255,.25) 50.2%, transparent 50.4%), repeating-linear-gradient(to top, #1f3d29 0 28px, #254731 28px 56px); overflow: hidden; user-select: none; }
    .pitch-stage.volley-court { aspect-ratio: 1 / 1.05; max-height: 360px; background: linear-gradient(to bottom, rgba(255,255,255,.35) 33%, rgba(255,255,255,.35) 33.8%, transparent 33.8%), linear-gradient(180deg, #b86a35 0%, #9e5627 100%); border-color: #f3f5ec; }
    .pitch-stage.volley-court:before { content: "NET"; position: absolute; top: 0; left: 0; right: 0; height: 22px; background: rgba(14, 21, 17, .82); color: var(--lime); font-size: 10px; font-weight: 800; letter-spacing: .16em; display: grid; place-items: center; border: none; }

  <script type="module">
    /* 1. SUPABASE BACKEND */
    const base = 'https://jkelyomdaylljxnvhuhi.supabase.co';
    const key = 'sb_publishable_nM0-WI_TOSBJsr5N4MaT9Q_6Ju3JEVO';
    const sessionKey = 'levelup.gala.session';
    const META_ID = '00000000-0000-0000-0000-000000000026';
    let renewing, generation = 0;

    function readSession() { try { return JSON.parse(sessionStorage.getItem(sessionKey)); } catch { return null; } }
    function writeSession(data) {
      if (!data?.access_token) return false;
      sessionStorage.setItem(sessionKey, JSON.stringify({ access_token: data.access_token, refresh_token: data.refresh_token, expires: Date.now() + data.expires_in * 1000 }));
      return true;
    }

    async function request(path, body, token) {
      const headers = { apikey: key, 'Content-Type': 'application/json' };
      if (token) headers.Authorization = 'Bearer ' + token;
      const response = await fetch(base + path, { method: 'POST', headers, body: JSON.stringify(body), cache: 'no-store' });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error(data?.message || data?.msg || data?.error_description || 'The request failed. Please try again.');
        error.status = response.status;
        throw error;
      }
      return data;
    }

    async function accessToken() {
      const session = readSession();
      if (!session) return undefined;
      if (session.expires > Date.now() + 60000) return session.access_token;
      if (!renewing) {
        const start = generation;
        renewing = request('/auth/v1/token?grant_type=refresh_token', { refresh_token: session.refresh_token })
          .then(data => { if (generation !== start) return readSession()?.access_token; writeSession(data); return data.access_token; })
          .catch(error => { if (generation === start && [400, 401, 403].includes(error.status)) { sessionStorage.removeItem(sessionKey); throw new Error('Your session expired. Please sign in again.'); } throw error; })
          .finally(() => { renewing = undefined; });
      }
      return renewing;
    }

    async function rpc(name, args) { return request('/rest/v1/rpc/gala_' + name, args, await accessToken()); }

    function logoUrl(path) {
      if (!path || typeof path !== 'string') return '';
      const raw = path.trim();
      if (!raw) return '';
      if (/^data:image\//i.test(raw)) return raw;
      if (/^https?:\/\//i.test(raw)) {
        try {
          const u = new URL(raw);
          if (u.pathname.startsWith('/api/photo/')) {
            return 'https://campus-auction-arena.vercel.app' + u.pathname + u.search;
          }
          return raw;
        } catch {
          return raw;
        }
      }
      if (raw.startsWith('/')) {
        return 'https://campus-auction-arena.vercel.app' + raw;
      }
      if (/^api\/photo\//i.test(raw)) {
        return 'https://campus-auction-arena.vercel.app/' + raw;
      }
      if (/^assets\//i.test(raw) || /^\.\/assets\//i.test(raw)) {
        return raw.startsWith('./') ? raw : './' + raw;
      }
      return 'https://jkelyomdaylljxnvhuhi.supabase.co/storage/v1/object/public/' + raw.replace(/^\/+/, '');
    }

    async function snapshot() {
      const result = await rpc('snapshot', {});
      const metaRec = (result.fixtures || []).find(f => f.id === META_ID || f.details?.isSiteMeta);
      const rawMeta = metaRec?.details?.siteMeta || {};

      // Merge event branding overrides
      const customBrand = rawMeta.eventBranding || {};
      result.branding = {
        ...(result.branding || {}),
        name: customBrand.name !== undefined && customBrand.name !== '' ? customBrand.name : (result.branding?.name || 'LEVEL UP ’26'),
        subtitle: customBrand.subtitle !== undefined && customBrand.subtitle !== '' ? customBrand.subtitle : (result.branding?.subtitle || 'Sports & games gala'),
        college: customBrand.college !== undefined && customBrand.college !== '' ? customBrand.college : (result.branding?.college || 'Markaz Wafy Games Gala · 2026'),
        logo: logoUrl(customBrand.logo || result.branding?.logo || result.branding?.image || '')
      };

      // Merge team overrides, added teams, and deleted teams
      const teamOverrides = rawMeta.teamOverrides || {};
      const deletedTeamIds = new Set(rawMeta.deletedTeamIds || []);
      const baseTeams = (result.teams || []).filter(t => !deletedTeamIds.has(t.id)).map(t => {
        const ov = teamOverrides[t.id] || {};
        return {
          ...t,
          name: ov.name || t.name,
          color: ov.color || t.color,
          logo: logoUrl(ov.logo !== undefined ? ov.logo : (t.logo || t.image || t.logo_url || t.avatar || ''))
        };
      });
      const addedTeams = (rawMeta.addedTeams || []).filter(t => !deletedTeamIds.has(t.id)).map(t => ({
        ...t,
        logo: logoUrl(t.logo || '')
      }));
      result.teams = [...baseTeams, ...addedTeams];

    function fileToCompressedDataUrl(file, maxDim = 256) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read image file.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Invalid image file.'));
          img.onload = () => {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/webp', 0.86));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function save(id, version, section, value = {}) { return rpc('save', { p_id: id, p_version: version, p_section: section, p_value: value }); }
    function manager(email, permissions, assigned, remove = false) { return rpc('manager', { p_email: email, p_permissions: permissions, p_assigned: assigned, p_remove: remove }); }
    async function login(email, password) { const data = await request('/auth/v1/token?grant_type=password', { email: email.trim(), password }); generation++; writeSession(data); }
    async function register(email, password) { const data = await request('/auth/v1/signup', { email: email.trim(), password }); generation++; const signedIn = writeSession(data); return { signedIn, confirmationRequired: !signedIn }; }
    async function logout() { const token = readSession()?.access_token; generation++; sessionStorage.removeItem(sessionKey); if (token) await request('/auth/v1/logout?scope=local', {}, token).catch(() => {}); }

    /* 2. STOPWATCH, EXTRA TIME & SCORING */
    const sides = ['home', 'away'], sideKey = s => s === 'home' ? 'Home' : 'Away', opponent = s => s === 'home' ? 'away' : 'home';
    const integer = (v, min = 0) => Number.isSafeInteger(v) && v >= min;
    const check = (c, m) => { if (!c) throw new Error(m); };
    const number = (v, fb) => integer(Number(v), 1) ? Number(v) : fb;
    const isSetSport = sport => sport === 'volleyball' || sport === 'badminton';

    function computeClock(history = [], status = 'scheduled') {
      let accMs = 0, runningSince = null, stateLabel = 'stopped', extraMins = 0;
      for (const e of history) {
        if (e.kind === 'start') { if (runningSince === null) runningSince = Date.parse(e.at); stateLabel = 'running'; }
        else if (e.kind === 'timer_start') { if (typeof e.baseSec === 'number') accMs = e.baseSec * 1000; runningSince = Date.parse(e.at); stateLabel = 'running'; }
        else if (e.kind === 'timer_pause') { if (runningSince !== null) { accMs += Math.max(0, Date.parse(e.at) - runningSince); runningSince = null; } if (typeof e.baseSec === 'number') accMs = e.baseSec * 1000; stateLabel = 'paused'; }
        else if (e.kind === 'timer_stop' || e.kind === 'finish') { if (runningSince !== null) { accMs += Math.max(0, Date.parse(e.at) - runningSince); runningSince = null; } if (typeof e.baseSec === 'number') accMs = e.baseSec * 1000; stateLabel = 'stopped'; }
        else if (e.kind === 'timer_set') { accMs = (Number(e.baseSec) || 0) * 1000; if (runningSince !== null) runningSince = Date.parse(e.at); }
        else if (e.kind === 'extra_time') { extraMins = Math.max(0, Number(e.extraMins) || 0); }
        else if (e.kind === 'period' && e.period === 'Half time') { if (runningSince !== null) { accMs += Math.max(0, Date.parse(e.at) - runningSince); runningSince = null; } stateLabel = 'stopped'; }
      }
      if (status === 'finished') { runningSince = null; stateLabel = 'stopped'; }
      return { accMs, runningSince, stateLabel, extraMins };
    }

    function formatClock(clock, now = Date.now()) {
      const extra = clock.runningSince ? Math.max(0, now - clock.runningSince) : 0;
      const totalSec = Math.floor((clock.accMs + extra) / 1000);
      const mins = Math.floor(totalSec / 60), secs = totalSec % 60;
      return { mins, secs, text: String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0'), running: Boolean(clock.runningSince), stateLabel: clock.stateLabel, extraMins: clock.extraMins || 0 };
    }

    function setRules(details) {
      const isBadminton = details.sport === 'badminton';
      const bestOf = number(details.bestOf, 3);
      return {
        toWin: Math.floor(bestOf / 2) + 1,
        target: number(details.pointLimit, isBadminton ? 21 : 25),
        deciding: number(details.decidingLimit, isBadminton ? 21 : 15),
        cap: isBadminton ? number(details.pointCap, 30) : 999,
        margin: details.winByTwo === false ? 1 : 2

    }

    function settleSet(score, rules) {
      const deciding = sides.every(side => score.setsWon[side] === rules.toWin - 1);
      const target = deciding ? rules.deciding : rules.target;
      const lead = score.home > score.away ? 'home' : 'away';
      const hitCap = rules.cap && score[lead] >= rules.cap;
      if (!hitCap && (score[lead] < target || score[lead] - score[opponent(lead)] < rules.margin)) return;
      score.sets.push({ home: score.home, away: score.away });
      score.setsWon[lead]++;
      score.timeouts = { home: 0, away: 0 };
      if (score.setsWon[lead] >= rules.toWin) score.winner = lead;
      else { score.home = 0; score.away = 0; score.period = 'Set ' + (score.sets.length + 1); }
    }

    function replay(details, history = []) {
      const initHome = (details.positionsHome?.length ? details.positionsHome.map(p => p.playerId) : details.lineupHome) || [];
      const initAway = (details.positionsAway?.length ? details.positionsAway.map(p => p.playerId) : details.lineupAway) || [];
      const score = {
        status: 'scheduled',
        home: 0,
        away: 0,
        period: '',
        server: details.initialServer || 'home',
        sets: [],
        setsWon: { home: 0, away: 0 },
        timeouts: { home: 0, away: 0 },
        attempts: {},
        results: {},
        bouts: [],
        winner: null,
        activeLineups: { home: [...initHome], away: [...initAway] },
        timeline: history
      };
      for (const e of history) {
        switch (e.kind) {
          case 'start':
            score.status = 'live';
            score.period = e.period || '';
            if (e.server) score.server = e.server;
            break;
          case 'finish':
            score.status = 'finished';
            if (!score.winner && details.format !== 'individual' && score.home !== score.away && !isSetSport(details.sport)) {
              score.winner = score.home > score.away ? 'home' : 'away';
            }
            break;
          case 'period': score.period = e.period; break;
          case 'server': score.server = e.side; break;
          case 'goal': case 'point': score[e.side]++; break;
          case 'yellow': case 'red':
            if (e.kind === 'red') {
              score.activeLineups[e.side] = score.activeLineups[e.side].filter(id => id !== e.playerId);
              if (isSetSport(details.sport) && !score.winner) {
                score[opponent(e.side)]++;
                score.server = opponent(e.side);
                settleSet(score, e.rules || setRules(details));
              }
            }
            break;
          case 'sub': score.activeLineups[e.side] = score.activeLineups[e.side].map(id => id === e.playerId ? e.otherPlayerId : id); break;
          case 'timeout': score.timeouts[e.side] = (score.timeouts[e.side] || 0) + 1; break;
          case 'rally':
            score[e.side]++;
            score.server = e.side;
            settleSet(score, e.rules);
            break;
          case 'bout_add':
            score.bouts.push({ id: e.boutId, round: e.round || ('Round ' + (score.bouts.length + 1)), homePlayerId: e.homePlayerId, awayPlayerId: e.awayPlayerId, winner: null });
            break;
          case 'bout_win': {
            const b = score.bouts.find(x => x.id === e.boutId);
            if (b && !b.winner) {
              b.winner = e.side;
              score[e.side]++;
            }
            break;
          }
          case 'bout_remove':
            score.bouts = score.bouts.filter(x => x.id !== e.boutId || x.winner);
            break;
          case 'correct':
            score.home = e.home; score.away = e.away;
            if (Array.isArray(e.sets)) {
              score.sets = e.sets.map(s => ({ home: Number(s.home) || 0, away: Number(s.away) || 0 }));
              score.setsWon = { home: score.sets.filter(s => s.home > s.away).length, away: score.sets.filter(s => s.away > s.home).length };
            }
            if (e.rules) settleSet(score, e.rules);
            break;
          case 'hit': case 'miss': {
            const targetId = e.teamId || e.playerId;
            const attempt = score.attempts[targetId] ||= { hits: 0, total: 0 };
            attempt.total++;
            if (e.kind === 'hit') attempt.hits++;
            break;
          }
          case 'result': {
            const targetId = e.teamId || e.playerId;
            score.results[targetId] = e.value;
            break;
          }
        }
      }
      return score;
    }

    function record(details, previous, input) {
      const timeline = [...(previous.timeline || [])];
      if (input.kind === 'undo') { check(timeline.length, 'There are no recorded actions to undo.'); timeline.pop(); return replay(details, timeline); }
      const s = replay(details, timeline);
      const e = { ...input, at: new Date().toISOString() };
      const sport = details.sport, individual = details.format === 'individual';
      if (e.kind === 'start') {
        check(s.status === 'scheduled', 'This event has already started.');
        e.period = individual ? '' : sport === 'football' ? 'First half' : isSetSport(sport) ? 'Set 1' : sport === 'armwrestling' ? 'Round 1' : '';
      } else {
        check(s.status === 'live', 'Go live before recording a score.');
        if (['goal', 'yellow', 'red', 'sub', 'point', 'rally', 'timeout', 'server', 'bout_win'].includes(e.kind)) check(sides.includes(e.side), 'Choose a team.');
        switch (e.kind) {
          case 'finish': case 'timer_start': case 'timer_pause': case 'timer_stop': case 'timer_set': case 'extra_time': break;
          case 'server':
            check(sport === 'badminton' && !individual, 'Server control is for badminton.');
            break;
          case 'goal': case 'yellow': case 'red': case 'sub': case 'period':
            if (sport === 'volleyball' && ['yellow', 'red', 'sub'].includes(e.kind)) {
              if (e.kind === 'sub') check(e.playerId && e.otherPlayerId && e.otherPlayerId !== e.playerId, 'Select court player and substitute.');
              if (e.kind === 'red') e.rules = setRules(details);
              break;
            }
            check(sport === 'football' && !individual, 'This control is for team football.');
            if (e.kind === 'period') check(['First half', 'Half time', 'Second half', 'Extra time', 'Penalties'].includes(e.period), 'Choose the match period.');
            else {
              check(integer(e.minute) && e.minute <= 999, 'Enter a match minute between 0 and 999.');
              if (e.kind !== 'goal') check(e.playerId, 'Select a player.');
              if (e.kind === 'sub') check(e.otherPlayerId && e.otherPlayerId !== e.playerId, 'Choose the player coming on.');
            }
            break;
          case 'timeout': check(sport === 'volleyball' && !individual, 'Timeouts are for volleyball matches.'); check((s.timeouts[e.side] || 0) < 2, 'Both timeouts already used in this set.'); break;
          case 'rally': check(isSetSport(sport) && !individual && !s.winner, 'The final set is complete.'); e.rules = setRules(details); break;
          case 'bout_add':
            check(sport === 'armwrestling' && !individual, 'Bouts are for arm wrestling events.');
            check(e.homePlayerId && e.awayPlayerId, 'Select both participants for the bout.');
            break;
          case 'bout_win':
            check(sport === 'armwrestling' && !individual, 'Bouts are for arm wrestling events.');
            check(s.bouts.some(b => b.id === e.boutId && !b.winner), 'This bout is already decided.');
            break;
          case 'bout_remove':
            check(sport === 'armwrestling' && !individual, 'Bouts are for arm wrestling events.');
            break;
          case 'point': check(!individual && (sport === 'custom' || sport === 'armwrestling'), 'Choose a team event.'); break;
          case 'correct': check(!individual && (!s.winner || isSetSport(sport)), 'Undo the last action to edit a completed match.'); check(integer(e.home) && integer(e.away), 'Scores must be whole numbers.'); if (isSetSport(sport)) e.rules = setRules(details); break;
          case 'hit': case 'miss': case 'result': {
            const validTeams = details.teamIds || [];
            const validPlayers = details.playerIds || [];
            const targetId = e.teamId || e.playerId;
            check(individual && (validTeams.includes(targetId) || validPlayers.includes(targetId)), 'Choose a registered team.');
            if (e.kind === 'result') check(Number.isFinite(e.value), 'Enter a valid result.');
            else { check(sport === 'crossbar', 'Attempts are for crossbar challenges.'); check((s.attempts[targetId]?.total || 0) < number(details.attemptLimit, 5), 'All attempts used.'); }
            break;
          }
          default: throw new Error('Unknown scoring action.');
        }
      }
      timeline.push(e);
      return replay(details, timeline);
    }

    function node(tag, title, className) { const el = document.createElement(tag); if (title != null) el.textContent = title; if (className) el.className = className; return el; }
    function scSelect(items) { const el = node('select'); for (const [v, t] of items) el.add(new Option(t, v)); return el; }
    function numeric(value, min = 0, max = null) { const el = node('input'); el.type = 'number'; el.value = value; el.min = min; if (max != null) el.max = max; return el; }
    function scField(label, control) { const el = node('label', label, 'sc-field'); el.append(control); return el; }

    let adminClockInterval = null;
    function mountScoring(container, fixture, data, onSave) {
      if (adminClockInterval) { clearInterval(adminClockInterval); adminClockInterval = null; }
      const d = fixture.details, score = replay(d, fixture.score?.timeline || []);
      const teams = new Map((data.teams || []).map(t => [t.id, t])), players = new Map((data.players || []).map(p => [p.id, p]));
      const team = side => teams.get(d[side + 'Id'])?.name || sideKey(side), teamById = id => teams.get(id)?.name || 'Team', player = id => players.get(id)?.name || 'Player';
      const individual = d.format === 'individual';
      const panel = node('section', null, 'sc-console'); container.replaceChildren(panel);
      const title = node('div', null, 'sc-head'); title.append(node('h3', 'Scoring desk'), node('span', score.status, 'sc-state ' + score.status)); panel.append(title);
      const feedback = node('p', '', 'sc-feedback'); feedback.setAttribute('role', 'alert');
      let busy = false;
      async function submit(action) {
        if (busy) return;
        try { const next = record(d, fixture.score || {}, action); busy = true; panel.inert = true; feedback.textContent = ''; await onSave(next); }
        catch (error) { feedback.textContent = error.message || 'Could not save this action.'; }
        finally { busy = false; panel.inert = false; }
      }
      function button(label, run, style = '') { const b = node('button', label, 'sc-btn ' + style); b.type = 'button'; b.addEventListener('click', run); return b; }
      function section(name) { const box = node('div', null, 'sc-box'); box.append(node('h4', name)); panel.append(box); return box; }
      const statusLabel = score.status === 'live' ? score.period || 'Live' : score.status === 'finished' ? 'Final result' : 'Scheduled';
      if (!individual) {
        const board = node('div', null, 'sc-board');
        for (const side of sides) {
          const col = node('div');
          const serveTag = d.sport === 'badminton' && score.server === side && score.status === 'live' ? ' 🏸' : '';
          col.append(node('span', team(side) + serveTag), node('strong', String(score[side])));
          if (d.sport === 'volleyball') col.append(node('small', score.setsWon[side] + ' sets · ' + (score.timeouts[side] || 0) + '/2 TO'));
          if (d.sport === 'badminton') col.append(node('small', score.setsWon[side] + ' sets won'));

      }

      if (score.status === 'live') {
        const clockData = computeClock(score.timeline, score.status), curSnap = formatClock(clockData);
        const timerBox = node('div', null, 'sc-timer-box');
        const topRow = node('div', null, 'sc-timer-top'), left = node('div');
        const clockEl = node('div', curSnap.text, 'sc-clock-display'); left.append(clockEl);
        if (curSnap.extraMins > 0) left.append(node('div', '+' + curSnap.extraMins + ' min Added / Extra Time', 'sc-extra-badge'));
        const subEl = node('div', clockData.stateLabel === 'running' ? 'Clock running' : clockData.stateLabel === 'paused' ? 'Clock paused' : 'Clock stopped (Half / Break)');
        subEl.style.color = '#b0b9ac'; subEl.style.fontSize = '12px'; subEl.style.marginTop = '4px'; left.append(subEl);

        const mainBtns = node('div', null, 'sc-row');
        if (clockData.running) {
          mainBtns.append(button('Pause', () => { const cur = formatClock(clockData); submit({ kind: 'timer_pause', baseSec: cur.mins * 60 + cur.secs, label: 'Timer paused at ' + cur.text }); }, 'sc-pause'));
          mainBtns.append(button('Stop (Half / Break)', () => { const cur = formatClock(clockData); submit({ kind: 'timer_stop', baseSec: cur.mins * 60 + cur.secs, label: 'Timer stopped at ' + cur.text }); }, 'sc-stop'));
        } else {
          mainBtns.append(button('Start / Resume', () => { const cur = formatClock(clockData); submit({ kind: 'timer_start', baseSec: cur.mins * 60 + cur.secs, label: 'Timer started at ' + cur.text }); }, 'sc-primary'));
          if (clockData.stateLabel === 'paused') {

          }
        }
        topRow.append(left, mainBtns);

        const subBar = node('div', null, 'sc-timer-subbar'), presetGroup = node('div', null, 'sc-row');
        presetGroup.append(button('00:00', () => submit({ kind: 'timer_set', baseSec: 0, label: 'Timer reset to 00:00' })));
        presetGroup.append(button('45:00', () => submit({ kind: 'timer_set', baseSec: 45 * 60, label: 'Timer set to 45:00' })));

        const customWrap = node('div', null, 'sc-custom-time');

        const setCustomBtn = button('Set Clock', () => {

        });
        setCustomBtn.style.minHeight = '30px'; setCustomBtn.style.padding = '3px 9px';
        customWrap.append(minInp, node('span', ':'), secInp, setCustomBtn);
        presetGroup.append(customWrap);

        const extraWrap = node('div', null, 'sc-custom-time');
        extraWrap.append(node('span', 'Extra +'));
        const extraInp = numeric(curSnap.extraMins || 0, 0, 60);
        const setExtraBtn = button('Set Extra', () => {
          const ex = Math.max(0, Number(extraInp.value) || 0);

          const clearExBtn = button('Clear', () => submit({ kind: 'extra_time', extraMins: 0, label: 'Added time cleared' }));

        subBar.append(presetGroup, extraWrap);
        timerBox.append(topRow, subBar);
        panel.append(timerBox);
        if (clockData.running) adminClockInterval = setInterval(() => { if (!document.body.contains(clockEl)) { clearInterval(adminClockInterval); return; } clockEl.textContent = formatClock(clockData).text; }, 1000);
      }

      if (score.status === 'scheduled') panel.append(button('Go live & start timer', () => submit({ kind: 'start', label: 'Event started' }), 'sc-primary'));
      if (score.status === 'live') {
        if (!individual && d.sport === 'football') {
          const controls = section('Match incident');
          const period = scSelect(['First half', 'Half time', 'Second half', 'Extra time', 'Penalties'].map(s => [s, s])); period.value = score.period;
          controls.append(scField('Period (Half time auto-stops clock)', period), button('Update period', () => submit({ kind: 'period', period: period.value, label: period.value })));
          const side = scSelect(sides.map(k => [k, team(k)]));
          const currentMin = formatClock(computeClock(score.timeline, score.status)).mins;
          const minute = numeric(currentMin || [...score.timeline].reverse().find(e => integer(e.minute))?.minute || 0, 0, 999);
          const who = scSelect([]), incoming = scSelect([]);
          const fill = () => {
            const k = side.value, roster = (data.players || []).filter(p => p.teamId === d[k + 'Id']);
            const active = score.activeLineups[k].filter(Boolean), hasLineup = active.length > 0;
            const sentOff = new Set(score.timeline.filter(e => e.side === k && e.kind === 'red').map(e => e.playerId));
            who.replaceChildren(new Option('Select player', '')); incoming.replaceChildren(new Option('Select substitute', ''));

    /* 3. FORMATION & COURT HELPERS */
    function generatePositions(formationStr, existing = [], sport = 'football') {
      if (sport === 'volleyball') {
        const zones = [{ x: 22, y: 24, zone: 'Z4' }, { x: 50, y: 24, zone: 'Z3' }, { x: 78, y: 24, zone: 'Z2' }, { x: 22, y: 64, zone: 'Z5' }, { x: 50, y: 64, zone: 'Z6' }, { x: 78, y: 64, zone: 'Z1' }, { x: 84, y: 88, zone: 'L', isLibero: true }];
        return zones.map((z, idx) => ({ ...z, playerId: existing[idx]?.playerId || '' }));
      }
      const nums = String(formationStr || '').split('-').map(Number).filter(n => n > 0 && n <= 11);
      const rows = nums.length ? [1, ...nums] : [1, 4, 3, 3], out = [];
      let idx = 0;
      rows.forEach((count, rIdx) => {
        const y = rows.length === 1 ? 85 : Math.round(88 - (rIdx / (rows.length - 1)) * 74);
        for (let c = 0; c < count; c++) { out.push({ x: Math.round(((c + 1) / (count + 1)) * 100), y, playerId: existing[idx]?.playerId || '' }); idx++; }
      });
      return out;
    }

    const symbols = {

    function icon(name) { return `<svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${symbols[name] || symbols.field}</svg>`; }
    function e(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    const fmtTime = new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' });

    function standings() {
      const groups = new Map, knockout = [];
      for (const f of fixtures().filter(f => !mode(f))) {
        const stage = (f.details.stage || '').trim();
        if (/knockout|eliminat|quarters?|semis?|final|play.?off|round of|third.?place|3rd.?place/i.test(stage)) { knockout.push(f); continue; }
        const key = JSON.stringify([f.details.sport, stage]); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(f);
      }
      const tables = [...groups.values()].map(fs => {
        const { sport, stage } = fs[0].details, football = sport === 'football', isSet = isSetSport(sport), rows = new Map;
        function side(id) { if (!rows.has(id)) rows.set(id, { id, played: 0, won: 0, drawn: 0, lost: 0, for: 0, against: 0, pts: 0, isLive: false }); return rows.get(id); }
        for (const f of fs) {
          const d = f.details; if (!team(d.homeId) || !team(d.awayId)) continue;
          const a = side(d.homeId), b = side(d.awayId), matchSt = st(f);
          if (matchSt !== 'finished' && matchSt !== 'live') continue;
          if (matchSt === 'live') { a.isLive = true; b.isLive = true; }
          const s = score(f), x = Number(isSet ? s.setsWon?.home : s.home) || 0, y = Number(isSet ? s.setsWon?.away : s.away) || 0;
          a.played++; b.played++; a.for += x; b.against += x; b.for += y; a.against += y;
          if (x > y) { a.won++; b.lost++; a.pts += 3; } else if (y > x) { b.won++; a.lost++; b.pts += 3; } else { a.drawn++; b.drawn++; a.pts++; b.pts++; }
        }
        const rank = [...rows.values()].sort((a, b) => (football ? b.pts - a.pts : b.won - a.won) || (b.for - b.against) - (a.for - a.against) || b.for - a.for || String(team(a.id)?.name).localeCompare(team(b.id)?.name));
        const activeGames = fs.filter(f => st(f) === 'live' || st(f) === 'finished');
        return `<section class="group">${sectionHead(e(standardName[sport] || label(sport)) + (stage ? ' · ' + e(stage) : ''))}
          <div class="sport-table"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>${isSet ? 'SD' : football ? 'GD' : 'Diff'}</th>${football ? '<th>Pts</th>' : ''}</tr></thead><tbody>${rank.map((r, i) => `<tr><td>${i + 1}</td><td><a class="stand-team" href="#team/${encodeURIComponent(r.id)}">${crest(team(r.id))}<span>${e(team(r.id)?.name)}</span>${r.isLive ? '<span class="live-pill-mini">LIVE</span>' : ''}</a></td><td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td><td>${r.for - r.against}</td>${football ? `<td><b>${r.pts}</b></td>` : ''}</tr>`).join('')}</tbody></table></div>
          ${football ? '<p class="hint">Includes live &amp; full-time matches · Win 3 · Draw 1 · Loss 0</p>' : ''}
          ${activeGames.length ? `<div class="fixture-list grid-2" style="margin-top:10px">${activeGames.map(fixtureCard).join('')}</div>` : ''}
        </section>`;
      }).join('');
      return pageHead('Standings', 'Live & final group tables and knockout results.') + (tables + (knockout.length ? `<section class="group">${sectionHead('Knockout stage')}<div class="fixture-list grid-2">${knockout.map(fixtureCard).join('')}</div></section>` : '') || empty('standings', 'Waiting for the first fixtures', 'Sport tables will appear after team fixtures are scheduled.'));
    }

    function ledger() { return fixtures().filter(f => st(f) === 'finished').flatMap(f => (f.awards?.entries || []).map(a => ({ ...a, points: Number(a.points) || 0, event: f }))); }

    function leaderboard() {

      let arr = (isTeam ? state.teams : state.players).map(p => ({ p, rows: points(p.id) })).map(r => ({ ...r, total: r.rows.reduce((n, a) => n + a.points, 0) })).sort((a, b) => b.total - a.total || a.p.name.localeCompare(b.p.name));

    function interactiveArena(d, s) {
      const side = filters.pitchSide === 'away' ? 'away' : 'home', isHome = side === 'home', isVolley = d.sport === 'volleyball';

      const subs = (isHome ? d.subsHome : d.subsAway) || [];
      if (!positions.some(p => p.playerId) && !subs.length && !form) return '';

      const subEvents = (s.timeline || []).filter(ev => ev.kind === 'sub' && ev.side === side);

      const pointEvents = (s.timeline || []).filter(ev => (ev.kind === 'goal' || ev.kind === 'rally') && ev.side === side);

      const resolvedNodes = positions.map((pos, idx) => {
        let pid = pos.playerId;

        const yellows = cardEvents.filter(ev => ev.playerId === pid && ev.kind === 'yellow').length;

        <div class="pitch-stage ${isVolley ? 'volley-court' : ''}" style="--team:${color(t?.color)}">
          ${resolvedNodes.map(n => `<button type="button" class="pitch-node ${n.pid && n.pid === filters.selectedPlayer ? 'selected' : ''}" style="left:${n.x}%;top:${n.y}%" data-select-player="${e(n.pid)}">

            <span class="pitch-label">${e(n.name.split(' ')[0])}${n.pts ? (isVolley ? ' ★' + n.pts : ' ⚽') : ''}${n.reds ? ' 🟥' : n.yellows ? ' 🟨' : ''}</span>

          ${isIndividual ? `<h2 class="subhead">${d.sport === 'crossbar' ? 'Team Attempts' : 'Competing Teams'}</h2>${teamRankIds.map(id => `<div class="attempt-row">${crest(team(id))}<span>${e(team(id)?.name || 'Team')}</span><strong>${d.sport === 'crossbar' ? `${e(s.attempts?.[id]?.hits ?? 0)} / ${e(s.attempts?.[id]?.total ?? 0)} hits` : e(s.results?.[id] ?? '—')}</strong></div>`).join('') || '<p class="hint">Competing teams will appear here.</p>'}` : ''}

    function livePage() {

    function route() { let parts = location.hash.slice(1).split('/'); return { tab: parts[0] || 'home', id: parts[1] ? decodeURIComponent(parts[1]) : '' }; }

    function renderPublic() {
      let { tab, id } = route();
      let panel = ({ home, fixtures: fixtureList, standings, leaderboard, live: livePage, announcements: announcementsPage, committee: committeePage, contact: contactPage, match: () => matchPage(state.fixtures.find(f => f.id === id)), team: () => teamPage(id) })[tab] || home;

    function formatEventTitleHtml(name, emTag = 'i') {
      const clean = e(name || 'LEVEL UP ’26');

      if (parts.length > 1) {
        const last = parts.pop();
        return `${parts.join(' ')} <${emTag}>${last}</${emTag}>`;
      }
      return clean;
    }

    function applyBrandingUI(branding = {}) {
      const evName = branding.name || 'LEVEL UP ’26';
      const evSub = branding.subtitle || 'Sports & games gala';
      const logo = branding.logo || './assets/event-logo.png';

      const el = document.getElementById('brand-icon');

        img.alt = '';

          el.classList.add('photo');

        img.onerror = () => {

    async function refreshPublic() {
      if (refreshing || route().tab === 'admin') return;

        const next = await snapshot();
        if (!Array.isArray(next?.teams) || !Array.isArray(next?.fixtures)) throw Error('Invalid snapshot');
        let sig = JSON.stringify([next.teams, next.players, next.fixtures, next.branding, next.siteMeta]), changed = sig !== priorSignature || failed;
        Object.assign(state, next); loaded = true; failed = false; priorSignature = sig;
        applyBrandingUI(next.branding);

    /* 5. ADMIN CONTROL ROOM */
    const app = document.querySelector('#app'), account = document.querySelector('#account'), notice = document.querySelector('#notice');
    const permissions = { schedule: 'Schedule and lineups', score: 'Live scoring', awards: 'Championship awards', delete: 'Delete fixtures' };

    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let adminData, view = 'fixtures', activeId = '', authMode = 'login', busy = false;
    let designerState = { Home: { formation: '4-3-3', positions: [], selectedIdx: 0, open: true }, Away: { formation: '4-3-3', positions: [], selectedIdx: 0, open: false } };

    async function runAdmin(task) {
      if (busy) return;
      busy = true; app.inert = true; account.inert = true; statusMsg();
      try { await task(); } catch (err) { statusMsg(err.message || 'Unable to complete this action.', true); }
      finally { app.inert = false; account.inert = false; busy = false; }

    function renderAdmin() {
      applyBrandingUI(adminData?.branding || {});
      account.innerHTML = '';
      if (adminData.role !== 'admin' && adminData.role !== 'manager') { authAdmin(); return; }

    function authAdmin() {
      let reg = authMode === 'register';
      app.innerHTML = '<section class="panel login"><h2>' + (reg ? 'Manager registration' : 'Staff sign in') + '</h2><p class="hint">' + (reg ? 'Use the email address authorised by the main administrator.' : 'Sign in with your administrator or manager account.') + '</p><form id="auth"><div class="fields"><div class="full">' + admField('Email address', admInput('email', '', 'email', 'autocomplete="username" required')) + '</div><div class="full">' + admField('Password', admInput('password', '', 'password', 'autocomplete="' + (reg ? 'new-password' : 'current-password') + '" required')) + '</div></div><div class="actions"><button class="primary">' + (reg ? 'Register' : 'Sign in') + '</button>' + admBtn(reg ? 'Back to sign in' : 'Register as a manager', 'toggleAuth') + '</div></form></section>';
    }

    function listingAdmin() {
      let fixtures = [...adminData.fixtures].filter(f => adminData.role === 'admin' || !adminData.assigned.length || adminData.assigned.includes(f.id)).sort((a, b) => (a.details.startTime || '').localeCompare(b.details.startTime || ''));
      app.innerHTML = '<section class="panel"><div class="bar"><h2>Fixtures & events</h2><div class="actions">' +
        (allowed('schedule') ? admBtn('+ Add fixture', 'new', 'accent') : '') +
        (adminData.role === 'admin' ? admBtn('Teams & Logos', 'teams') + admBtn('Players', 'players') + admBtn('Event & Notices', 'siteMeta') + admBtn('Managers', 'access') : '') +
        admBtn('Refresh', 'refresh') +
        '</div></div>' + (fixtures.length ? fixtures.map(f => {
          let d = f.details, s = f.score.status || 'scheduled';
          return '<article class="item"><div><strong>' + esc(d.name) + '</strong><span class="meta">' + esc([sports[d.sport], dateLabel(d.startTime), d.venue, s].filter(Boolean).join(' · ')) + '</span></div><div class="actions" data-id="' + esc(f.id) + '">' + (allowed('score', f) ? admBtn('Score', 'score', 'primary') : '') + (allowed('schedule', f) ? admBtn('Edit', 'details') : '') + (allowed('awards', f) ? admBtn('Awards', 'awards') : '') + (allowed('delete', f) ? admBtn('Delete', 'delete', 'danger') : '') + '</div></article>';
        }).join('') : '<p class="hint">No fixtures to manage yet.</p>') + '</section>';
    }

    function dateLabel(iso) { return iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : ''; }
    function localTime(iso) { return iso ? new Date(new Date(iso).getTime() + 19800000).toISOString().slice(0, 16) : ''; }

    function initDesigner(d) {
      const sport = d.sport || 'football';
      for (const side of ['Home', 'Away']) {
        const fStr = d['formation' + side] || '4-3-3', savedPos = d['positions' + side], legacy = (d['lineup' + side] || []).map(id => ({ playerId: id }));
        const validSaved = savedPos?.length && (sport === 'volleyball' ? savedPos.some(p => p.zone) : !savedPos.some(p => p.zone));
        designerState[side] = { formation: fStr, positions: validSaved ? JSON.parse(JSON.stringify(savedPos)) : generatePositions(fStr, legacy, sport), selectedIdx: 0, open: side === 'Home' };
      }
    }

    function renderArenaDesigner(side, teamId, sport) {
      const isVolley = sport === 'volleyball', stSide = designerState[side], roster = adminData.players.filter(p => p.teamId === teamId), selNode = stSide.positions[stSide.selectedIdx] || stSide.positions[0];
      return `<div class="adm-pitch-wrap" data-designer-side="${side}">
        ${!isVolley ? `<div class="fields" style="margin:8px 0">
          <label class="field">Formation numbers (e.g. 4-3-3 or 3-5-2)<input type="text" data-form-input="${side}" value="${esc(stSide.formation)}" placeholder="e.g. 4-3-3"></label>
          <div style="display:flex;align-items:end"><button type="button" data-reset-dots="${side}">Arrange dots from formation</button></div>
        </div>` : `<div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0"><span class="hint" style="margin:0">6 Court Zones + Libero (L)</span><button type="button" data-reset-dots="${side}">Reset court zones</button></div>`}
        <p class="hint">Drag any dot smoothly on the ${isVolley ? 'court' : 'pitch'}. Tap a dot to pick the player below.</p>
        <div class="adm-pitch-board ${isVolley ? 'volley-board' : ''}" data-board="${side}">
          ${stSide.positions.map((pos, idx) => {
            const pName = adminData.players.find(p => p.id === pos.playerId)?.name || (pos.isLibero ? 'Libero' : '#' + (idx + 1));
            return `<div class="adm-dot ${pos.isLibero ? 'libero-dot' : ''} ${idx === stSide.selectedIdx ? 'active' : ''}" data-dot-idx="${idx}" style="left:${pos.x}%;top:${pos.y}%"><span>${pos.isLibero ? 'L' : (pos.zone || idx + 1)}</span><small>${esc(pName)}</small></div>`;
          }).join('')}
        </div>
        ${selNode ? `<div class="adm-dot-picker" data-picker-box="${side}">
          <strong data-picker-label="${side}">${selNode.isLibero ? 'Libero (L)' : (selNode.zone ? 'Zone ' + selNode.zone : 'Position #' + (stSide.selectedIdx + 1))} Player:</strong>
          <select data-assign-player="${side}" style="min-width:200px"><option value="">— Unassigned —</option>${roster.map(p => `<option value="${esc(p.id)}" ${p.id === selNode.playerId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
        </div>` : ''}
      </div>`;
    }

    function fixtureForm() {
      const d = { ...current()?.details }, teamOpts = adminData.teams.map(t => [t.id, t.name]), sport = d.sport || 'football';
      const defaultTeamIds = (d.teamIds && d.teamIds.length) ? d.teamIds : adminData.teams.map(t => t.id);
      initDesigner(d);

      app.innerHTML = admBtn('← Back to fixtures', 'fixtures', 'back') +
        '<form class="panel" id="fixture"><h2>' + (current() ? 'Edit fixture' : 'Create event or fixture') + '</h2>' +
        '<div class="fields">' +
          admField('Event / fixture name', admInput('name', d.name, 'text', 'required maxlength="100" placeholder="Football · Group A"')) +
          admField('Competition stage', admInput('stage', d.stage, 'text', 'placeholder="Group A, semi-final, final…" maxlength="80"')) +
          admField('Sport / scoring format', admSelect('sport', admOpts(Object.entries(sports), sport))) +
          admField('Match Structure', admSelect('format', admOpts([['team', 'Head-to-Head (2 Teams)'], ['individual', 'Individual Program (Final Team Only)']], d.format || 'team'))) +
          admField('Start time (India)', admInput('startTime', localTime(d.startTime), 'datetime-local', 'required')) +
          admField('Venue', admInput('venue', d.venue, 'text', 'required maxlength="100"')) +
        '</div>' +
        '<div class="fields" id="teams">' +
          admField('Home team', admSelect('homeId', admOpts(teamOpts, d.homeId, 'Select team'))) +
          admField('Away team', admSelect('awayId', admOpts(teamOpts, d.awayId, 'Select team'))) +
        '</div>' +
        '<div id="competingTeams"><fieldset><legend>Competing Teams (Final Team Only — No Individual Names Needed)</legend><div class="pick">' + adminData.teams.map(t => admCheckbox('teamIds', t.id, t.name, defaultTeamIds.includes(t.id))).join('') + '</div></fieldset></div>' +
        '<div id="lineups"></div>' +
        '<div class="fields" id="setRulesBox">' +
          admField('Best of (sets)', admInput('bestOf', d.bestOf ?? 3, 'number', 'min="1" max="99" step="2"')) +
          admField('Regular set target', admInput('pointLimit', d.pointLimit ?? (sport === 'badminton' ? 21 : 25), 'number', 'min="1" max="999"')) +
          admField('Deciding set target', admInput('decidingLimit', d.decidingLimit ?? (sport === 'badminton' ? 21 : 15), 'number', 'min="1" max="999"')) +
          admField('Initial Server (Badminton)', admSelect('initialServer', admOpts([['home', 'Home Team'], ['away', 'Away Team']], d.initialServer || 'home'))) +
          admCheckbox('winByTwo', 'yes', 'Win by two points', d.winByTwo ?? true) +
        '</div>' +
        '<div class="fields" id="crossbar">' + admField('Attempts per team', admInput('attemptLimit', d.attemptLimit ?? 5, 'number', 'min="1" max="100"')) + '</div>' +
        '<div class="actions spaced"><button class="primary">Save fixture</button>' + admBtn('Cancel', 'fixtures') + '</div></form>';

      const form = app.querySelector('#fixture');

      function renderLineups() {
        const lineups = form.querySelector('#lineups'), curSport = form.sport.value;
        const fd = new FormData(form);
        const curSubs = { Home: fd.getAll('subsHome'), Away: fd.getAll('subsAway') };
        if (curSubs.Home.length) d.subsHome = curSubs.Home;
        if (curSubs.Away.length) d.subsAway = curSubs.Away;
        const curBad = { Home: fd.getAll('badmintonPlayersHome'), Away: fd.getAll('badmintonPlayersAway') };
        if (curBad.Home.length) d.badmintonPlayersHome = curBad.Home;
        if (curBad.Away.length) d.badmintonPlayersAway = curBad.Away;

        lineups.innerHTML = '';
        if (form.format.value !== 'team') return;

        if (curSport === 'badminton') {
          for (const side of ['Home', 'Away']) {
            const id = form.elements[side.toLowerCase() + 'Id'].value;
            if (!id) continue;
            const players = adminData.players.filter(p => p.teamId === id);
            lineups.insertAdjacentHTML('beforeend',
              `<fieldset class="spaced"><legend>${esc(teamName(id))} · Badminton Player(s) (Singles / Doubles)</legend>
                <div class="pick">${players.map(p => admCheckbox('badmintonPlayers' + side, p.id, p.name, (d['badmintonPlayers' + side] || []).includes(p.id))).join('')}</div>
              </fieldset>`
            );
          }
          return;
        }

        if (curSport !== 'football' && curSport !== 'volleyball') return;
        for (const side of ['Home', 'Away']) {
          const id = form.elements[side.toLowerCase() + 'Id'].value;
          if (!id) continue;
          const players = adminData.players.filter(p => p.teamId === id), openAttr = designerState[side].open ? 'open' : '';
          lineups.insertAdjacentHTML('beforeend',
            `<details class="spaced" data-side-details="${side}" ${openAttr}>
              <summary>${esc(teamName(id))} · ${curSport === 'volleyball' ? 'Court Lineup & Subs' : 'Formation & Subs'}</summary>
              ${renderArenaDesigner(side, id, curSport)}
              <fieldset style="margin-top:12px"><legend>Substitutes Bench</legend><div class="pick">${players.map(p => admCheckbox('subs' + side, p.id, p.name, (d['subs' + side] || []).includes(p.id))).join('')}</div></fieldset>
            </details>`
          );
        }
      }

      form.addEventListener('toggle', ev => { const det = ev.target.closest('[data-side-details]'); if (det) designerState[det.dataset.sideDetails].open = det.open; }, true);

      function update() {
        const sport = form.sport.value, isTeam = form.format.value === 'team';
        for (const [id, on] of [['teams', isTeam], ['competingTeams', !isTeam], ['setRulesBox', isSetSport(sport) && isTeam], ['crossbar', sport === 'crossbar']]) {
          let group = form.querySelector('#' + id); group.hidden = !on; group.querySelectorAll('input,select').forEach(e => e.disabled = !on);
        }
        renderLineups();
      }

      let dragging = null;
      form.addEventListener('pointerdown', ev => {
        const dot = ev.target.closest('.adm-dot'); if (!dot) return;
        ev.preventDefault();
        const board = dot.closest('.adm-pitch-board'), side = board.dataset.board, idx = Number(dot.dataset.dotIdx);
        designerState[side].selectedIdx = idx;
        board.querySelectorAll('.adm-dot').forEach((el, i) => el.classList.toggle('active', i === idx));
        const selNode = designerState[side].positions[idx], lbl = form.querySelector(`[data-picker-label="${side}"]`), sel = form.querySelector(`[data-assign-player="${side}"]`);
        if (lbl && selNode) lbl.textContent = (selNode.isLibero ? 'Libero (L)' : (selNode.zone ? 'Zone ' + selNode.zone : 'Position #' + (idx + 1))) + ' Player:';
        if (sel && selNode) sel.value = selNode.playerId || '';
        dragging = { side, idx, board, dot }; dot.setPointerCapture(ev.pointerId);
      });

      form.addEventListener('pointermove', ev => {
        if (!dragging) return;
        const rect = dragging.board.getBoundingClientRect(); if (!rect.width || !rect.height) return;
        const x = Math.max(8, Math.min(92, Math.round(((ev.clientX - rect.left) / rect.width) * 100)));
        const y = Math.max(8, Math.min(92, Math.round(((ev.clientY - rect.top) / rect.height) * 100)));
        designerState[dragging.side].positions[dragging.idx].x = x; designerState[dragging.side].positions[dragging.idx].y = y;
        dragging.dot.style.left = x + '%'; dragging.dot.style.top = y + '%';
      });

      const stopDrag = () => { dragging = null; };
      form.addEventListener('pointerup', stopDrag); form.addEventListener('pointercancel', stopDrag);

      form.addEventListener('click', ev => {
        const resetBtn = ev.target.closest('[data-reset-dots]');
        if (resetBtn) {
          const side = resetBtn.dataset.resetDots, inp = form.querySelector(`[data-form-input="${side}"]`);
          if (inp) designerState[side].formation = inp.value.trim();
          designerState[side].positions = generatePositions(designerState[side].formation, designerState[side].positions, form.sport.value);
          designerState[side].selectedIdx = 0; renderLineups();
        }
      });

      form.addEventListener('change', ev => {
        if (ev.target.dataset.formInput) {
          const side = ev.target.dataset.formInput;
          designerState[side].formation = ev.target.value.trim();
          designerState[side].positions = generatePositions(designerState[side].formation, designerState[side].positions, form.sport.value);
          designerState[side].selectedIdx = 0; renderLineups(); return;
        }
        if (ev.target.dataset.assignPlayer) {
          const side = ev.target.dataset.assignPlayer, stSide = designerState[side], idx = stSide.selectedIdx;
          if (stSide.positions[idx]) {
            stSide.positions[idx].playerId = ev.target.value;
            const pName = adminData.players.find(p => p.id === ev.target.value)?.name || (stSide.positions[idx].isLibero ? 'Libero' : '#' + (idx + 1));
            const dotLabel = form.querySelector(`[data-board="${side}"] [data-dot-idx="${idx}"] small`);
            if (dotLabel) dotLabel.textContent = pName;
          }
          return;
        }
        if (['homeId', 'awayId', 'sport', 'format'].includes(ev.target.name)) {
          if (ev.target.name === 'homeId') { designerState.Home.positions.forEach(p => p.playerId = ''); designerState.Home.open = true; }
          if (ev.target.name === 'awayId') { designerState.Away.positions.forEach(p => p.playerId = ''); designerState.Away.open = true; }
          if (ev.target.name === 'sport') {
            if (form.sport.value === 'crossbar') form.format.value = 'individual';
            if (['football', 'volleyball', 'badminton', 'armwrestling'].includes(form.sport.value)) {
              form.format.value = 'team';
              if (form.sport.value === 'badminton') {
                form.pointLimit.value = 21;
                form.decidingLimit.value = 21;
              } else if (form.sport.value === 'volleyball') {
                form.pointLimit.value = 25;
                form.decidingLimit.value = 15;
              }
              designerState.Home.positions = generatePositions(designerState.Home.formation, [], form.sport.value);
              designerState.Away.positions = generatePositions(designerState.Away.formation, [], form.sport.value);
            }
          }
          update();
        }
      });

      update();
    }

    function readFixture(form) {
      const values = new FormData(form), get = k => String(values.get(k) || '').trim(), all = k => values.getAll(k), sport = get('sport'), format = get('format');
      let d = {
        ...current()?.details,
        name: get('name'),
        stage: get('stage'),
        venue: get('venue'),
        sport,
        format,
        startTime: new Date(get('startTime') + ':00+05:30').toISOString(),
        homeId: get('homeId'),
        awayId: get('awayId'),
        teamIds: all('teamIds'),
        playerIds: [],
        bestOf: Number(get('bestOf') || 3),
        pointLimit: Number(get('pointLimit') || (sport === 'badminton' ? 21 : 25)),
        decidingLimit: Number(get('decidingLimit') || (sport === 'badminton' ? 21 : 15)),
        initialServer: get('initialServer') || 'home',
        winByTwo: values.has('winByTwo'),
        attemptLimit: Number(get('attemptLimit') || 5),
        badmintonPlayersHome: all('badmintonPlayersHome'),
        badmintonPlayersAway: all('badmintonPlayersAway')
      };
      if (!d.name || !d.venue) throw Error('Enter a fixture name and venue.');
      if (format === 'team' && (!d.homeId || !d.awayId || d.homeId === d.awayId)) throw Error('Choose two different teams.');
      if (format === 'individual' && !d.teamIds.length) throw Error('Select at least one competing team.');
      if (['football', 'volleyball', 'badminton', 'armwrestling'].includes(sport) && format !== 'team') throw Error('This sport requires two head-to-head teams.');
      if (sport === 'crossbar' && format !== 'individual') throw Error('Select Individual Program (Final Team Only) for crossbar team attempts.');
      for (const side of ['Home', 'Away']) {
        d['formation' + side] = designerState[side].formation;
        d['positions' + side] = designerState[side].positions;
        d['lineup' + side] = designerState[side].positions.map(p => p.playerId).filter(Boolean);
        d['subs' + side] = all('subs' + side);
      }
      return d;
    }
