          return '<article class="item"><div><strong>' + esc(d.name) + '</strong><span class="meta">' + esc([sports[d.sport], dateLabel(d.startTime), d.venue, s].filter(Boolean).join(' · ')) + '</span></div><div class="actions" data-id="' + esc(f.id) + '">' + (allowed('score', f) ? admBtn('Score', 'score', 'primary') : '') + (allowed('schedule', f) ? admBtn('Edit', 'details') : '') + (allowed('awards', f) ? admBtn('Awards', 'awards') : '') + (allowed('delete', f) ? admBtn('Delete', 'delete', 'danger') : '') + '</div></article>';
        }).join('') : '<p class="hint">No fixtures to manage yet.</p>') + '</section>';
    }

    function dateLabel(iso) { return iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : ''; }
    function localTime(iso) { return iso ? new Date(new Date(iso).getTime() + 19800000).toISOString().slice(0, 16) : ''; }

    function initDesigner(d) {
      for (const side of ['Home', 'Away']) {
        const fStr = d['formation' + side] || '4-3-3';
        const savedPos = d['positions' + side];
        const legacy = (d['lineup' + side] || []).map(id => ({ playerId: id }));
        designerState[side] = {
          formation: fStr,
          positions: savedPos?.length ? JSON.parse(JSON.stringify(savedPos)) : generatePositions(fStr, legacy),
          selectedIdx: 0
        };
      }
    }

    function renderPitchDesigner(side, teamId) {
      const stSide = designerState[side];
      const roster = adminData.players.filter(p => p.teamId === teamId);
      const selNode = stSide.positions[stSide.selectedIdx] || stSide.positions[0];

      return `<div class="adm-pitch-wrap" data-designer-side="${side}">
        <div class="fields" style="margin:8px 0">
          <label class="field">Formation numbers (e.g. 4-3-3 or 3-5-2)
            <input type="text" data-form-input="${side}" value="${esc(stSide.formation)}" placeholder="e.g. 4-3-3">
          </label>
          <div style="display:flex;align-items:end">
            <button type="button" data-reset-dots="${side}">Arrange dots from formation</button>
          </div>
        </div>
        <p class="hint">Drag any dot anywhere on the pitch to position players. Click a dot to assign their name.</p>
        <div class="adm-pitch-board" data-board="${side}">
          ${stSide.positions.map((pos, idx) => {
            const pName = adminData.players.find(p => p.id === pos.playerId)?.name || ('#' + (idx + 1));
            return `<div class="adm-dot ${idx === stSide.selectedIdx ? 'active' : ''}" data-dot-idx="${idx}" style="left:${pos.x}%;top:${pos.y}%">
              <span>${idx + 1}</span>
              <small>${esc(pName)}</small>
            </div>`;
          }).join('')}
        </div>
        ${selNode ? `<div class="adm-dot-picker">
          <strong>Position #${stSide.selectedIdx + 1} Player:</strong>
          <select data-assign-player="${side}" style="min-width:200px">
            <option value="">— Unassigned —</option>
            ${roster.map(p => `<option value="${esc(p.id)}" ${p.id === selNode.playerId ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>` : ''}
      </div>`;
    }

    function fixtureForm() {
      const d = { ...current()?.details }, teamOpts = adminData.teams.map(t => [t.id, t.name]), sport = d.sport || 'football';
      initDesigner(d);

      app.innerHTML = admBtn('← Back to fixtures', 'fixtures', 'back') +
        '<form class="panel" id="fixture"><h2>' + (current() ? 'Edit fixture' : 'Create event or fixture') + '</h2>' +
        '<div class="fields">' +
          admField('Event / fixture name', admInput('name', d.name, 'text', 'required maxlength="100" placeholder="Football · Group A"')) +
          admField('Competition stage', admInput('stage', d.stage, 'text', 'placeholder="Group A, semi-final, final…" maxlength="80"')) +
          admField('Sport / scoring format', admSelect('sport', admOpts(Object.entries(sports), sport))) +
          admField('Participants', admSelect('format', admOpts([['team', 'Teams'], ['individual', 'Individuals']], d.format || 'team'))) +
          admField('Start time (India)', admInput('startTime', localTime(d.startTime), 'datetime-local', 'required')) +
          admField('Venue', admInput('venue', d.venue, 'text', 'required maxlength="100"')) +
        '</div>' +
        '<div class="fields" id="teams">' +
          admField('Home team', admSelect('homeId', admOpts(teamOpts, d.homeId, 'Select team'))) +
          admField('Away team', admSelect('awayId', admOpts(teamOpts, d.awayId, 'Select team'))) +
        '</div>' +
        '<div id="players"><fieldset><legend>Participants</legend><div class="pick">' + adminData.players.map(p => admCheckbox('playerIds', p.id, p.name + ' · ' + teamName(p.teamId), (d.playerIds || []).includes(p.id))).join('') + '</div></fieldset></div>' +
        '<div id="lineups"></div>' +
        '<div class="fields" id="volley">' +
          admField('Best of (sets)', admInput('bestOf', d.bestOf ?? 3, 'number', 'min="1" max="99" step="2"')) +
          admField('Regular set target', admInput('pointLimit', d.pointLimit ?? 25, 'number', 'min="1" max="999"')) +
          admField('Deciding set target', admInput('decidingLimit', d.decidingLimit ?? 15, 'number', 'min="1" max="999"')) +
          admCheckbox('winByTwo', 'yes', 'Win by two points', d.winByTwo ?? true) +
        '</div>' +
        '<div class="fields" id="crossbar">' + admField('Attempts per participant', admInput('attemptLimit', d.attemptLimit ?? 5, 'number', 'min="1" max="100"')) + '</div>' +
        '<div class="actions spaced"><button class="primary">Save fixture</button>' + admBtn('Cancel', 'fixtures') + '</div></form>';

      const form = app.querySelector('#fixture');

      function renderLineups() {
        const lineups = form.querySelector('#lineups');
        lineups.innerHTML = '';
        if (form.sport.value !== 'football' || form.format.value !== 'team') return;
        for (const side of ['Home', 'Away']) {
          const id = form.elements[side.toLowerCase() + 'Id'].value;
          if (!id) continue;
          const players = adminData.players.filter(p => p.teamId === id);
          const openAttr = side === 'Home' ? 'open' : '';
          lineups.insertAdjacentHTML('beforeend',
            `<details class="spaced" ${openAttr}>
              <summary>${esc(teamName(id))} · Interactive Formation &amp; Subs</summary>
              ${renderPitchDesigner(side, id)}
              <fieldset style="margin-top:12px"><legend>Substitutes Bench</legend>
                <div class="pick">${players.map(p => admCheckbox('subs' + side, p.id, p.name, (d['subs' + side] || []).includes(p.id))).join('')}</div>
              </fieldset>
            </details>`
          );
        }
      }

      function update() {
        const sport = form.sport.value, isTeam = form.format.value === 'team';
        for (const [id, on] of [['teams', isTeam], ['players', !isTeam], ['volley', sport === 'volleyball'], ['crossbar', sport === 'crossbar']]) {
          let group = form.querySelector('#' + id); group.hidden = !on; group.querySelectorAll('input,select').forEach(e => e.disabled = !on);
        }
        renderLineups();
      }

      /* Interactive Drag & Click Handlers for Pitch Dots */
      let dragging = null;
      form.addEventListener('pointerdown', ev => {
        const dot = ev.target.closest('.adm-dot');
        if (!dot) return;
        const board = dot.closest('.adm-pitch-board');
        const side = board.dataset.board;
        const idx = Number(dot.dataset.dotIdx);
        designerState[side].selectedIdx = idx;
        dragging = { side, idx, board };
        dot.setPointerCapture(ev.pointerId);
        renderLineups();
      });

      form.addEventListener('pointermove', ev => {
        if (!dragging) return;
        const rect = dragging.board.getBoundingClientRect();
        const x = Math.max(6, Math.min(94, Math.round(((ev.clientX - rect.left) / rect.width) * 100)));
        const y = Math.max(6, Math.min(94, Math.round(((ev.clientY - rect.top) / rect.height) * 100)));
        designerState[dragging.side].positions[dragging.idx].x = x;
        designerState[dragging.side].positions[dragging.idx].y = y;
        const dotEl = dragging.board.querySelector(`[data-dot-idx="${dragging.idx}"]`);
        if (dotEl) { dotEl.style.left = x + '%'; dotEl.style.top = y + '%'; }
      });

      form.addEventListener('pointerup', () => { dragging = null; });

      form.addEventListener('click', ev => {
        const resetBtn = ev.target.closest('[data-reset-dots]');
        if (resetBtn) {
          const side = resetBtn.dataset.resetDots;
          const inp = form.querySelector(`[data-form-input="${side}"]`);
          designerState[side].formation = inp.value.trim();
          designerState[side].positions = generatePositions(designerState[side].formation, designerState[side].positions);
          designerState[side].selectedIdx = 0;
          renderLineups();
        }
      });

      form.addEventListener('change', ev => {
        if (ev.target.dataset.formInput) {
          const side = ev.target.dataset.formInput;
          designerState[side].formation = ev.target.value.trim();
          designerState[side].positions = generatePositions(designerState[side].formation, designerState[side].positions);
          designerState[side].selectedIdx = 0;
          renderLineups();
          return;
        }
        if (ev.target.dataset.assignPlayer) {
          const side = ev.target.dataset.assignPlayer;
          const stSide = designerState[side];
          if (stSide.positions[stSide.selectedIdx]) {
            stSide.positions[stSide.selectedIdx].playerId = ev.target.value;
          }
          renderLineups();
          return;
        }
        if (['homeId', 'awayId', 'sport', 'format'].includes(ev.target.name)) {
          if (ev.target.name === 'homeId') designerState.Home.positions.forEach(p => p.playerId = '');
          if (ev.target.name === 'awayId') designerState.Away.positions.forEach(p => p.playerId = '');
          if (ev.target.name === 'sport') {
            if (form.sport.value === 'crossbar') form.format.value = 'individual';
            if (['football', 'volleyball'].includes(form.sport.value)) form.format.value = 'team';
          }
          update();
        }
      });

      update();
    }

    function readFixture(form) {
      const values = new FormData(form), get = k => String(values.get(k) || '').trim(), all = k => values.getAll(k), sport = get('sport'), format = get('format');
      let d = {
        ...current()?.details,
        name: get('name'), stage: get('stage'), venue: get('venue'), sport, format,
        startTime: new Date(get('startTime') + ':00+05:30').toISOString(),
        homeId: get('homeId'), awayId: get('awayId'), playerIds: all('playerIds'),
        bestOf: Number(get('bestOf') || 3), pointLimit: Number(get('pointLimit') || 25),
        decidingLimit: Number(get('decidingLimit') || 15), winByTwo: values.has('winByTwo'),
        attemptLimit: Number(get('attemptLimit') || 5)
      };
      if (!d.name || !d.venue) throw Error('Enter a fixture name and venue.');
      if (format === 'team' && (!d.homeId || !d.awayId || d.homeId === d.awayId)) throw Error('Choose two different teams.');
      if (format === 'individual' && !d.playerIds.length) throw Error('Select at least one participant.');
      if ((sport === 'football' || sport === 'volleyball') && format !== 'team') throw Error('Football and volleyball scoring require two teams.');
      if (sport === 'crossbar' && format !== 'individual') throw Error('Select Individuals for crossbar attempt tracking.');
      for (const side of ['Home', 'Away']) {
        d['formation' + side] = designerState[side].formation;
        d['positions' + side] = designerState[side].positions;
        d['lineup' + side] = designerState[side].positions.map(p => p.playerId).filter(Boolean);
        d['subs' + side] = all('subs' + side);
      }
      return d;
    }

    function editorAdmin() {
      const f = current(), scoring = view === 'score';
      app.innerHTML = admBtn('← Back to fixtures', 'fixtures', 'back') + '<section class="panel"><div class="bar"><div><p class="overline">' + (scoring ? 'Scoring desk' : 'Championship awards') + '</p><h2>' + esc(f.details.name) + '</h2></div>' + admBtn('Reload latest', 'refresh') + '</div><div id="editor"></div></section>';
      const el = app.querySelector('#editor');
      if (scoring) {
        mountScoring(el, f, adminData, async score => {
          try { await save(f.id, f.version, 'score', score); await reloadAdmin(); statusMsg('Score saved.'); }
          catch (err) { statusMsg(err.message || 'Unable to save the score.', true); throw err; }
        });
        return;
      }
      el.innerHTML = '<form id="award"><p class="hint">Participant name is optional—leave it as "Team award (Optional)" to credit the team directly.</p><div id="awardRows"></div><div class="actions spaced">' + admBtn('+ Add placing', 'addAward') + '<button class="primary">Save awards</button></div></form>';
      for (const entry of (f.awards.entries || [])) addAward(entry);
      if (!f.awards.entries?.length) addAward({});
    }

    function addAward(entry = {}) {
      const f = current(), rows = app.querySelector('#awardRows'), row = document.createElement('div'); row.className = 'award-row';
      const players = adminData.players.filter(p => !f.details.playerIds?.length || f.details.playerIds.includes(p.id) || entry.playerId === p.id);
      row.innerHTML = admField('Place', admInput('place', entry.place ?? rows.children.length + 1, 'number', 'required min="1" max="1000"')) +
        admField('Player (Optional)', admSelect('playerId', admOpts(players.map(p => [p.id, p.name]), entry.playerId, 'Team award (Optional)'))) +
        admField('Credited team', admSelect('teamId', admOpts(adminData.teams.map(t => [t.id, t.name]), entry.teamId, 'Select team'), 'required')) +
        admField('Points', admInput('points', entry.points ?? '', 'number', 'step="any" required')) +
        admBtn('Remove', 'removeAward', 'danger');
      row.querySelector('[name=playerId]').onchange = e => { const player = adminData.players.find(p => p.id === e.target.value); if (player) row.querySelector('[name=teamId]').value = player.teamId; };
      rows.append(row);
    }

    function siteMetaAdmin() {
      if (adminData.role !== 'admin') { navigateAdmin('fixtures'); return; }
      const meta = adminData.siteMeta || { announcements: [], committee: [], contact: '' };
      app.innerHTML = admBtn('← Back to fixtures', 'fixtures', 'back') +
        `<form class="panel" id="siteMetaForm">
          <h2>Announcements, Committee &amp; Contact</h2>
          <p class="hint">Updates here appear immediately in the public Home screen and Slide Menu.</p>
          <fieldset class="spaced"><legend>Announcements</legend>
            <div id="annRows">${(meta.announcements || []).map(a => `<div class="fields" style="border-bottom:1px solid #d6ded5;padding-bottom:10px">
              <label class="field">Title<input name="annTitle" value="${esc(a.title)}"></label>
              <label class="field">Details<input name="annBody" value="${esc(a.body || '')}"></label>
            </div>`).join('')}</div>
            ${admBtn('+ Add announcement', 'addAnnRow')}
          </fieldset>
          <fieldset class="spaced"><legend>Sports Committee</legend>
            <div id="commRows">${(meta.committee || []).map(c => `<div class="fields" style="border-bottom:1px solid #d6ded5;padding-bottom:10px">
              <label class="field">Name<input name="commName" value="${esc(c.name)}"></label>
              <label class="field">Role / Designation<input name="commRole" value="${esc(c.role || '')}"></label>
            </div>`).join('')}</div>
            ${admBtn('+ Add committee member', 'addCommRow')}
          </fieldset>
          <div class="fields">
            <div class="full"><label class="field">Contact Information<textarea name="contact" rows="2">${esc(meta.contact || '')}</textarea></label></div>
          </div>
          <div class="actions spaced"><button class="primary">Publish Site Info</button></div>
        </form>`;
    }

    function accessAdmin() {
      if (adminData.role !== 'admin') { navigateAdmin('fixtures'); return; }
      const managers = adminData.managers || [];
      app.innerHTML = admBtn('← Back to fixtures', 'fixtures', 'back') + '<section class="panel"><h2>Manager access</h2><p class="hint">Choose the actions and fixtures each manager can edit. Once added, they can register with the authorised email address.</p><div>' + managers.map((m, i) => '<article class="item"><div><strong>' + esc(m.email) + '</strong><div class="meta">' + esc(m.permissions.map(k => permissions[k]).join(', ')) + ' · ' + (m.assigned.length ? m.assigned.length + ' fixtures' : 'All fixtures') + '</div></div><div class="actions" data-index="' + i + '">' + admBtn('Edit access', 'editManager') + admBtn('Remove', 'removeManager', 'danger') + '</div></article>').join('') + '</div></section><section class="panel"><form id="manager"><h2 id="managerTitle">Add manager</h2><div class="fields">' + admField('Email address', admInput('email', '', 'email', 'required')) + '</div><div class="two"><fieldset><legend>Permissions</legend>' + Object.entries(permissions).map(([k, l]) => admCheckbox('permissions', k, l, false)).join('') + '</fieldset><fieldset><legend>Fixture access</legend><label class="check"><input type="radio" name="scope" value="all" checked>All fixtures</label><label class="check"><input type="radio" name="scope" value="selected">Selected fixtures only</label><div class="pick" id="assignment" hidden>' + adminData.fixtures.map(f => admCheckbox('assigned', f.id, f.details.name, false)).join('') + '</div></fieldset></div><div class="actions spaced"><button class="primary">Save manager access</button></div></form></section>';
      app.querySelector('#manager').onchange = () => { const form = app.querySelector('#manager'); form.querySelector('#assignment').hidden = form.scope.value !== 'selected'; };
    }

    function editManager(m) {
      const form = app.querySelector('#manager');
      form.email.value = m.email; form.email.readOnly = true;
      form.scope.value = m.assigned.length ? 'selected' : 'all';
      form.querySelector('#assignment').hidden = !m.assigned.length;
      form.querySelectorAll('[name=permissions],[name=assigned]').forEach(el => el.checked = m[el.name].includes(el.value));
      app.querySelector('#managerTitle').textContent = 'Edit manager';
      form.scrollIntoView({ behavior: 'smooth' });
    }

    async function onAdminClick(event) {
      const b = event.target.closest('[data-action]'); if (!b) return;
      const action = b.dataset.action, id = b.closest('[data-id]')?.dataset.id;
      if (['fixtures', 'score', 'awards', 'details', 'new', 'access', 'siteMeta'].includes(action)) { navigateAdmin(action, id); return; }
      if (action === 'toggleAuth') { authMode = authMode === 'login' ? 'register' : 'login'; statusMsg(); authAdmin(); return; }
      if (action === 'addAward') { addAward({}); return; }
      if (action === 'removeAward') { b.closest('.award-row').remove(); return; }
      if (action === 'addAnnRow') {
        app.querySelector('#annRows').insertAdjacentHTML('beforeend', `<div class="fields" style="border-bottom:1px solid #d6ded5;padding-bottom:10px"><label class="field">Title<input name="annTitle" placeholder="Notice title"></label><label class="field">Details<input name="annBody" placeholder="Message"></label></div>`);
        return;
      }
      if (action === 'addCommRow') {
        app.querySelector('#commRows').insertAdjacentHTML('beforeend', `<div class="fields" style="border-bottom:1px solid #d6ded5;padding-bottom:10px"><label class="field">Name<input name="commName" placeholder="Member name"></label><label class="field">Role / Designation<input name="commRole" placeholder="Role"></label></div>`);
        return;
      }
      if (action === 'editManager') { editManager(adminData.managers[Number(b.closest('[data-index]').dataset.index)]); return; }
      if (action === 'refresh') { await runAdmin(async () => { await reloadAdmin(); statusMsg('Latest data loaded.'); }); return; }
      if (action === 'logout') { await runAdmin(async () => { await logout(); view = 'fixtures'; activeId = ''; authMode = 'login'; await reloadAdmin(); }); return; }
      if (action === 'delete') {
        const f = adminData.fixtures.find(f => f.id === id);
        if (!confirm('Delete ' + f.details.name + ' and remove its result and award points?')) return;
        await runAdmin(async () => { await save(id, f.version, 'delete', {}); await reloadAdmin(); statusMsg('Fixture deleted.'); });
        return;
      }
      if (action === 'removeManager') {
        const m = adminData.managers[Number(b.closest('[data-index]').dataset.index)];
        if (!confirm('Remove gala access for ' + m.email + '?')) return;
        await runAdmin(async () => { await manager(m.email, [], [], true); await reloadAdmin(); statusMsg('Manager access removed.'); });
      }
    }

    app.addEventListener('click', onAdminClick);
    account.addEventListener('click', onAdminClick);
    app.addEventListener('submit', event => {
      const form = event.target;
      if (!['fixture', 'auth', 'award', 'manager', 'siteMetaForm'].includes(form.id)) return;
      event.preventDefault();
      runAdmin(async () => {
        if (form.id === 'auth') {
          const email = form.email.value.trim(), password = form.password.value;
          if (authMode === 'register') {
            await register(email, password); authMode = 'login'; await reloadAdmin();
            statusMsg('Registration submitted. Check your email if confirmation is required, then sign in.');
          } else {
            await login(email, password); await reloadAdmin();
            if (adminData.role === 'public') statusMsg('This account does not have gala access. Use an authorised email or contact the main administrator.', true);
          }
          return;
        }
        if (form.id === 'fixture') {
          const d = readFixture(form), f = current();
          await save(f?.id || crypto.randomUUID(), f?.version || 0, 'details', d);
          view = 'fixtures'; activeId = ''; await reloadAdmin(); statusMsg('Fixture saved.');
          return;
        }
        if (form.id === 'award') {
          const f = current(), entries = [...form.querySelectorAll('.award-row')].map(row => ({ place: Number(row.querySelector('[name=place]').value), playerId: row.querySelector('[name=playerId]').value || '', teamId: row.querySelector('[name=teamId]').value, points: Number(row.querySelector('[name=points]').value) }));
          await save(f.id, f.version, 'awards', { entries }); await reloadAdmin(); statusMsg('Championship awards saved.');
          return;
        }
        if (form.id === 'siteMetaForm') {
          const fd = new FormData(form);
          const titles = fd.getAll('annTitle'), bodies = fd.getAll('annBody');
          const announcements = titles.map((t, i) => ({ title: String(t).trim(), body: String(bodies[i] || '').trim() })).filter(a => a.title);
          const names = fd.getAll('commName'), roles = fd.getAll('commRole');
          const committee = names.map((n, i) => ({ name: String(n).trim(), role: String(roles[i] || '').trim() })).filter(c => c.name);
          const contact = String(fd.get('contact') || '').trim();
          const ver = adminData.metaRecord?.version || 0;
          await save(META_ID, ver, 'details', {
            isSiteMeta: true,
            name: 'System Site Info',
            venue: 'Control Desk',
            sport: 'custom',
            format: 'team',
            startTime: '2099-01-01T00:00:00.000Z',
            siteMeta: { announcements, committee, contact }
          });
          view = 'fixtures'; await reloadAdmin(); statusMsg('Site announcements & contact published.');
          return;
        }
        if (form.id === 'manager') {
          const fd = new FormData(form), perms = fd.getAll('permissions'), assigned = fd.get('scope') === 'selected' ? fd.getAll('assigned') : [];
          if (!perms.length) throw Error('Choose at least one permission.');
          if (fd.get('scope') === 'selected' && !assigned.length) throw Error('Choose at least one fixture.');
          await manager(form.email.value.trim().toLowerCase(), perms, assigned, false);
          await reloadAdmin(); statusMsg('Manager access saved.');
        }
      });
    });

    /* ================= 6. DRAWER, ROUTING & BOOTSTRAP ================= */
    const pubShell = document.getElementById('public-shell');
    const admShell = document.getElementById('admin-shell');
    const drawer = document.getElementById('side-drawer');
    const backdrop = document.getElementById('drawer-backdrop');

    function setDrawer(open) {
      drawer.classList.toggle('open', open);
      backdrop.classList.toggle('open', open);
    }

    document.getElementById('open-drawer').addEventListener('click', () => setDrawer(true));
    document.getElementById('close-drawer').addEventListener('click', () => setDrawer(false));
    backdrop.addEventListener('click', () => setDrawer(false));
    drawer.addEventListener('click', ev => {
      if (ev.target.closest('a')) setDrawer(false);
    });

    function syncShell() {
      setDrawer(false);
      const isAdmin = route().tab === 'admin';
      pubShell.hidden = isAdmin;
      admShell.hidden = !isAdmin;
      if (isAdmin) {
        document.title = 'Gala control room · Level Up ’26';
        reloadAdmin().catch(err => {
          statusMsg(err.message || 'Unable to load the control room.', true);
          app.removeAttribute('aria-busy');
          app.innerHTML = admBtn('Try again', 'refresh');
        });
      } else {
        if (adminClockInterval) { clearInterval(adminClockInterval); adminClockInterval = null; }
        renderPublic();
        refreshPublic();
      }
    }

    document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = icon(el.dataset.icon));
    main.addEventListener('click', ev => {
      const selectPlayerBtn = ev.target.closest('[data-select-player]');
      if (selectPlayerBtn) {
        const pid = selectPlayerBtn.dataset.selectPlayer;
        filters.selectedPlayer = filters.selectedPlayer === pid ? '' : pid;
        renderPublic();
        return;
      }
      const el = ev.target.closest('button'); if (!el) return;
      if (el.hasAttribute('data-retry')) refreshPublic();
      if (el.dataset.set) { filters[el.dataset.set] = el.dataset.value; renderPublic(); }
    });
    main.addEventListener('change', ev => {
      if (ev.target.dataset.filter) { filters[ev.target.dataset.filter] = ev.target.value; renderPublic(); }
    });
    window.addEventListener('hashchange', syncShell);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && route().tab !== 'admin') refreshPublic(); });

    syncShell();
    setInterval(() => { if (!document.hidden && route().tab !== 'admin') refreshPublic(); }, 5000);
  </script>
</body>
</html>
