<html lang="en">
<head>
  
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* Branded Launch Splash Screen */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 38%, #162820 0%, #0d1410 72%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #app-splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #app-splash img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(0, 210, 255, 0.28));
      animation: splashPop 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #app-splash strong {
      font: italic 800 30px/1 'Barlow Condensed', Impact, sans-serif;
      letter-spacing: -0.02em;
      color: #f3f5ec;
      text-transform: uppercase;
    }
    #app-splash strong span { color: #c2f568; }
    #app-splash small {
      font: 700 11px/1 'DM Sans', system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9ea99c;
    }
    @keyframes splashPop {
      from { opacity: 0; transform: scale(0.84) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
  </style>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1410">
  <meta name="description" content="The official Level Up ’26 college sports and games gala match centre. Follow fixtures, live scores, results and championship standings.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Level Up ’26">
  <link id="pwa-manifest" rel="manifest" href="">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="">
  <title>Level Up ’26 · Match Centre</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=DM+Sans:wght@400;500;600;650;700;750&display=swap');

    :root {
      color-scheme: dark;
      --outer-bg: #070b09;
      --bg: #0e1511;
      --panel: #16201a;
      --panel-2: #1c2821;
      --line: #2c3a31;
      --lime: #c2f568;
      --text: #f3f5ec;
      --muted: #9ea99c;
      --danger: #ff6559;
      --warn: #f9d452;
      --title: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
      --body: 'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior-y: none; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0%, #16241b 0%, var(--bg) 52%, #0a100d 100%);
      background-attachment: fixed;
      color: var(--text);
      font: 15px/1.45 var(--body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button, a, select { touch-action: manipulation; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .hidden, [hidden] { display: none !important; }

    /* Full-Screen App Shell */
    .app-frame {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow-x: clip;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar { position: sticky; top: 0; z-index: 20; width: 100%; background: rgba(14, 21, 17, .92); backdrop-filter: blur(14px); border-bottom: 1px solid #222e26; padding-top: env(safe-area-inset-top); }
    .top-inner { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-icon { display: grid; place-items: center; border-radius: 10px; background: var(--lime); width: 38px; height: 38px; color: #132012; font: italic 800 18px/1 var(--title); letter-spacing: -.04em; overflow: hidden; flex: none; }
    .brand-icon img { height: 100%; width: 100%; object-fit: contain; }
    .brand-icon.photo { background: none; }
    .brand b { display: block; font: italic 800 22px/.92 var(--title); letter-spacing: -.03em; }
    .brand i { color: var(--lime); font-style: italic; }
    .brand small { display: block; color: var(--muted); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-top: 2px; }
    .menu-btn { width: 40px; height: 40px; border-radius: 11px; background: var(--panel); border: 1px solid var(--line); color: var(--text); display: grid; place-items: center; }
    .menu-btn:hover { border-color: var(--lime); color: var(--lime); }

    .ico { width: 1.2em; height: 1.2em; display: inline-block; vertical-align: -.2em; flex: none; }
    .skip { position: absolute; left: -200vw; }
    .skip:focus { left: 10px; top: 10px; z-index: 50; background: #17251f; padding: 10px; }

    /* Slide Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 6, .72);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(320px, 84%);
      background: #131c17;
      border-left: 1px solid #2b382f;
      z-index: 45;
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.22, 1, .36, 1);
      display: flex;
      flex-direction: column;
      padding: calc(18px + env(safe-area-inset-top)) 18px 18px;
      overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-inner-sticky { display: flex; flex-direction: column; gap: 14px; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .drawer-head strong { font: italic 800 22px/1 var(--title); text-transform: uppercase; letter-spacing: -.02em; }
    .drawer-head strong span { color: var(--lime); }
    .drawer-nav { display: grid; gap: 9px; }
    .drawer-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-weight: 650; font-size: 14px; text-align: left; width: 100%; }
    .drawer-item-left { display: flex; align-items: center; gap: 11px; }
    .drawer-item:hover { border-color: var(--lime); background: var(--panel-2); }
    .drawer-item.accent { background: var(--lime); color: #132012; border-color: var(--lime); font-weight: 750; }
    .drawer-item.accent:hover { background: #d5ff89; }
    .drawer-item.install-pill { background: #1d3223; border-color: #4f7e46; color: var(--lime); }
    .drawer-sep { height: 1px; background: var(--line); margin: 4px 0; }

    /* Main Content */
    main.container { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px 20px 104px; flex: 1; }
    #public-shell h1, #public-shell h2, #public-shell h3, #public-shell p { margin: 0; }
    #public-shell h1, #public-shell h2, #public-shell h3 { font-family: var(--title); line-height: 1.02; }
    #public-shell h1, #public-shell h2 { text-transform: uppercase; }
    .loading, .notice { margin: 18px 0; color: var(--muted); }

    /* Hero */
    .hero { position: relative; overflow: hidden; isolation: isolate; border: 1px solid #354738; border-radius: 18px; background: radial-gradient(circle at 85% 20%, rgba(194, 245, 104, .22), transparent 52%), linear-gradient(135deg, #16291c 0%, #1d3524 60%, #2c4727 100%); padding: 26px 24px; }
    .hero:before, .hero:after { content: ""; position: absolute; inset: 0; z-index: -1; }
    .hero:before { background: url('./assets/pitch.jpg') center/cover no-repeat; opacity: .35; }
    .hero:after { background: linear-gradient(180deg, rgba(10, 22, 14, .45), rgba(10, 22, 14, .92)); }
    .hero-kicker { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--lime); }
    .hero-kicker:before { content: ""; width: 16px; height: 2px; background: var(--lime); }
    .hero h1 { font-size: clamp(46px, 7vw, 60px); font-weight: 800; font-style: italic; letter-spacing: -.04em; line-height: .88; margin-top: 8px; }
    .hero h1 span { color: var(--lime); }
    .hero-bottom { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hero-actions { display: flex; gap: 9px; }
    .primary, .secondary, .link-btn, .seg, .tool-input { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; }
    .primary, .secondary { border-radius: 10px; padding: 10px 16px; border: 1px solid transparent; font-size: 13.5px; }
    .primary { background: var(--lime); color: #142013; }
    .secondary { background: rgba(24, 38, 28, .85); border-color: #465a48; color: var(--text); }
    .primary:hover { background: #d7ff91; }
    .secondary:hover { border-color: var(--lime); }
    .stats { display: inline-flex; gap: 16px; padding: 8px 14px; background: rgba(12, 20, 15, .75); border: 1px solid rgba(194, 245, 104, .22); border-radius: 10px; }
    .stats > div + div { padding-left: 16px; border-left: 1px solid #354738; }
    .stats strong { font: 700 22px/1 var(--title); color: var(--lime); display: block; }
    .stats small { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-top: 2px; }

    /* Cards & Lists */
    .section { margin-top: 24px; }
    .sect-head, .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .sect-head h2 { font-size: 28px; font-style: italic; letter-spacing: -.02em; }
    .link-btn { font-size: 13px; color: var(--lime); background: none; border: none; padding: 4px 0; }
    .card, .fixture, .team-tile, .rank-row, .sport-table, .live-article, .podium-card { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; }
    .empty { padding: 16px; display: flex; align-items: center; gap: 14px; }
    .empty-icon { width: 40px; height: 40px; border: 1px solid #3a4c3d; background: #1f2e24; border-radius: 11px; display: grid; place-items: center; color: var(--lime); flex: none; }
    .empty strong { font-size: 14.5px; display: block; }
    .empty p, .muted, .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* Announcements & Contacts */
    .announce-list { display: grid; gap: 9px; }
    .announce-card { padding: 13px 15px; border-radius: 13px; background: linear-gradient(90deg, rgba(194, 245, 104, .11), rgba(22, 32, 26, .95)); border: 1px solid rgba(194, 245, 104, .32); display: flex; gap: 11px; align-items: flex-start; }
    .announce-badge { padding: 3px 7px; border-radius: 6px; background: var(--lime); color: #132012; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; flex: none; margin-top: 2px; }
    .announce-card strong { display: block; font-size: 14.5px; color: var(--text); }
    .announce-card p { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .contact-card { padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .contact-info { min-width: 0; display: grid; gap: 2px; }
    .contact-info b { font: 700 20px/1.1 var(--title); letter-spacing: .01em; color: var(--text); }
    .contact-role { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--lime); }
    .contact-num { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
    .call-btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 15px; border-radius: 10px; background: var(--lime); color: #132012; font-weight: 750; font-size: 13.5px; flex: none; }
    .call-btn:hover { background: #d6ff8e; }

    /* Teams */
    .teams-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 640px) {
      .teams-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .team-tile { display: flex; align-items: center; gap: 11px; padding: 13px 12px; position: relative; overflow: hidden; text-align: left; width: 100%; }
    .team-tile:before { position: absolute; top: 0; left: 0; bottom: 0; width: 3.5px; background: var(--team); content: ""; }
    .team-tile b, .team-line b { font: 700 20px/1.05 var(--title); letter-spacing: .01em; }
    .team-caption { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .crest { width: 40px; height: 40px; background: color-mix(in srgb, var(--team) 18%, #18221b); border: 1px solid color-mix(in srgb, var(--team) 45%, #344437); border-radius: 10px; display: inline-grid; place-items: center; color: var(--text); flex: none; font: 700 18px/1 var(--title); overflow: hidden; }
    .crest img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }

    /* Bottom Navigation */
    .bottom { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; z-index: 25; border-top: 1px solid #2b382f; background: rgba(14, 21, 17, .94); backdrop-filter: blur(14px); padding-bottom: env(safe-area-inset-bottom); }
    .nav-inner { width: 100%; max-width: 760px; margin: 0 auto; display: flex; justify-content: space-around; }
    .nav-inner a { flex: 1; color: var(--muted); min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 650; font-size: 11px; position: relative; }
    .nav-inner a .ico { width: 19px; height: 19px; }
    .nav-inner a[aria-current=page] { color: var(--lime); }
    .nav-inner a[aria-current=page]:after { content: ""; height: 3px; background: var(--lime); width: 32px; position: absolute; top: 0; border-radius: 0 0 3px 3px; }

    /* Fixtures & Results */
    .page-head { margin: 6px 0 16px; display: block; }
    .page-head h1 { font-size: 42px; font-style: italic; letter-spacing: -.03em; }
    .page-head p { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
    .tools, .chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .tools { margin-bottom: 16px; }
    .seg, .tool-input { font-size: 12.5px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; }
    .seg.active { background: var(--lime); border-color: var(--lime); color: #142013; }
    .tool-input { max-width: 100%; min-height: 36px; }
    .fixture-list, .rank-list { display: grid; gap: 10px; }
    @media (min-width: 660px) {
      .fixture-list.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .fixture { padding: 14px 16px; display: block; }
    .fixture:hover, .team-tile:hover, .rank-row summary:hover { border-color: #628554; background: var(--panel-2); }
    .info-line, .foot-line { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .fixture-sport, .meta { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border: 1px solid #3f4f41; color: #c0c9bc; background: #202d23; border-radius: 6px; padding: 2px 7px; display: inline-flex; align-items: center; gap: 5px; }
    .tag.live { color: #cbff9a; border-color: #53864b; background: #253e29; }
    .tag.live:before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--lime); animation: pulse 1.5s infinite; }
    .tag.finished { color: #c2d6f8; border-color: #415575; background: #1c2738; }
    .tag.stopped { color: #f9d452; border-color: #6e5d28; background: #2d2716; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }

    .team-line { display: flex; align-items: center; gap: 9px; margin-top: 9px; min-width: 0; }
    .team-line strong { margin-left: auto; font: 700 22px var(--title); }
    .team-line .crest, .stand-team .crest { width: 26px; height: 26px; border-radius: 7px; font-size: 12px; }
    .serve-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); display: inline-block; box-shadow: 0 0 8px var(--lime); flex: none; }
    .foot-line { margin-top: 10px; padding-top: 8px; border-top: 1px solid #28352c; flex-wrap: wrap; justify-content: flex-start; color: var(--muted); font-size: 11.5px; }
    .fixture-title { margin-top: 8px; font-size: 22px; }
    .day-title { font-size: 18px; margin: 16px 0 8px; color: var(--lime); }
    .group { margin: 12px 0 22px; }

    /* Final Podium Cards (Results Section) */
    .podium-card { padding: 15px 16px; display: grid; gap: 10px; }
    .podium-list { display: grid; gap: 7px; }
    .podium-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; background: #1a261f; border: 1px solid #29382e; }
    .podium-row.place-1 { background: rgba(194, 245, 104, .11); border-color: rgba(194, 245, 104, .42); }
    .podium-row.place-2 { background: rgba(210, 224, 240, .06); border-color: rgba(210, 224, 240, .26); }
    .podium-row.place-3 { background: rgba(235, 168, 102, .07); border-color: rgba(235, 168, 102, .28); }
    .medal-pill { min-width: 38px; padding: 3px 7px; border-radius: 7px; text-align: center; font: 800 13px/1.1 var(--title); letter-spacing: .04em; background: #26352c; color: var(--text); flex: none; }
    .place-1 .medal-pill { background: var(--lime); color: #132012; }
    .place-2 .medal-pill { background: #d6e2ef; color: #132012; }
    .place-3 .medal-pill { background: #e8a86b; color: #1a120a; }
    .podium-row .crest { width: 28px; height: 28px; border-radius: 8px; font-size: 13px; }
    .podium-info { flex: 1; min-width: 0; }
    .podium-info b { display: block; font: 700 18px/1.1 var(--title); letter-spacing: .01em; }
    .podium-info small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
    .podium-right { text-align: right; flex: none; }
    .podium-right strong { display: block; font: 800 17px/1.1 var(--title); color: var(--lime); }
    .podium-right small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; }

    /* Leaderboard & Teammates Drawer */
    .rank-row summary { cursor: pointer; display: flex; align-items: center; gap: 11px; padding: 13px 15px; list-style: none; }
    .rank-row summary::-webkit-details-marker { display: none; }
    .rank-index { min-width: 24px; font: 700 22px var(--title); color: var(--lime); }
    .rank-name { flex: 1; min-width: 0; }
    .rank-name b { display: block; font-size: 16.5px; }
    .rank-name small { color: var(--muted); font-size: 12px; }
    .rank-points { font: 700 22px var(--title); color: var(--lime); }
    .rank-points small { font: 600 10px var(--body); color: var(--muted); margin-left: 3px; }
    .team-expand-body { padding: 11px 15px 14px 48px; border-top: 1px solid #243129; }
    .team-expand-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .teammates-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9px; background: #1f3025; border: 1px solid #486b4a; color: var(--lime); font-weight: 700; font-size: 12.5px; }
    .teammates-btn:hover, .teammates-btn.open { background: var(--lime); color: #132012; border-color: var(--lime); }
    .teammates-box { margin: 8px 0 12px; padding: 10px 12px; border-radius: 10px; background: #111914; border: 1px solid #2b3a30; }
    .teammates-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .teammate-pill { padding: 5px 10px; border-radius: 8px; background: #1a261f; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; }
    .award-list { font-size: 13px; color: var(--muted); }
    .award-list ul { margin: 6px 0 0; padding-left: 18px; }
    .award-list li { margin: 4px 0; }
    .badge-count { font: 700 11px var(--body); vertical-align: middle; margin-left: 6px; color: var(--lime); background: #253623; border: 1px solid #465d41; border-radius: 99px; padding: 2px 8px; }

    /* Match Detail & Clock */
    .live-article { padding: 18px; margin-top: 12px; }
    .match-clock-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 6px; }
    .match-clock-banner { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 99px; background: #1f3324; border: 1px solid #476d44; color: var(--lime); font: 700 13.5px/1 var(--body); font-variant-numeric: tabular-nums; }
    .match-clock-banner.stopped { background: #2b2617; border-color: #6b5a27; color: #f9d452; }
    .extra-time-pill { display: inline-block; padding: 2px 8px; border-radius: 6px; background: rgba(249, 212, 82, .16); border: 1px solid rgba(249, 212, 82, .45); color: #f9d452; font: 800 10.5px/1.1 var(--body); letter-spacing: .04em; }
    .match-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; padding: 20px 0; }
    .match-side { display: grid; justify-items: center; gap: 7px; font: 700 20px/1.1 var(--title); }
    .match-side small.roster-tag { font: 600 11.5px/1.25 var(--body); color: var(--muted); max-width: 170px; }
    .match-score > strong { font: 800 48px/1 var(--title); color: var(--lime); white-space: nowrap; }
    .match-score > strong > small { display: block; font: 600 11px var(--body); color: var(--muted); margin-top: 5px; }
    .subhead { font-size: 21px; margin: 20px 0 8px; }

    /* Rubik's Cube, Eating & Push-Up Public Leaderboard */
    .rubiks-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; background: #1a261f; border: 1px solid var(--line); margin-bottom: 7px; }
    .rubiks-row.podium-1 { border-color: var(--lime); background: rgba(194, 245, 104, .1); }
    .rubiks-rank { font: 800 20px/1 var(--title); color: var(--lime); min-width: 26px; text-align: center; }
    .rubiks-row .crest { width: 28px; height: 28px; border-radius: 8px; font-size: 12px; }
    .rubiks-info { flex: 1; min-width: 0; }
    .rubiks-info b { display: block; font-size: 14.5px; color: var(--text); }
    .rubiks-info small { color: var(--muted); font-size: 11.5px; }
    .rubiks-time { font: 800 20px/1 var(--title); color: var(--lime); font-variant-numeric: tabular-nums; padding: 5px 10px; border-radius: 8px; background: #121c16; border: 1px solid #2e4034; }
    .rubiks-time.dnf { color: var(--danger); border-color: rgba(255, 101, 89, .4); background: rgba(255, 101, 89, .08); font-size: 14px; font-family: var(--body); }
    .rubiks-time.pending { color: var(--muted); border-color: var(--line); font-size: 13px; font-family: var(--body); font-weight: 600; }

    /* Arm Wrestling 4-Box Bracket & Team Points */
    .arm-team-strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0 14px; }
    @media (min-width: 580px) { .arm-team-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .arm-team-pill { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; background: #1a261f; border: 1px solid var(--line); }
    .arm-team-pill .crest { width: 26px; height: 26px; border-radius: 7px; font-size: 11px; }
    .arm-team-pill div { flex: 1; min-width: 0; }
    .arm-team-pill b { display: block; font: 700 15px/1.1 var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .arm-team-pill small { font-size: 10px; color: var(--muted); }
    .arm-team-pill strong { font: 800 20px/1 var(--title); color: var(--lime); }

    .arm-boxes-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 8px; }
    @media (min-width: 620px) { .arm-boxes-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .arm-box-card { padding: 12px 13px; border-radius: 12px; background: #1a261f; border: 1px solid var(--line); display: grid; gap: 8px; }
    .arm-box-card.decided { border-color: #4f7a49; }
    .arm-box-card.live-box { border-color: var(--lime); background: #1f2f24; }
    .arm-box-head { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .arm-slot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 9px; background: #131c17; border: 1px solid #28362d; }
    .arm-slot.winner { background: rgba(194, 245, 104, .14); border-color: var(--lime); }
    .arm-slot-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .arm-slot-left .crest { width: 24px; height: 24px; border-radius: 6px; font-size: 11px; }
    .arm-slot-left b { display: block; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .arm-slot.winner .arm-slot-left b { color: var(--lime); }
    .arm-slot-left small { display: block; font-size: 11px; color: var(--muted); }
    .win-badge { font-size: 9.5px; font-weight: 800; padding: 3px 7px; border-radius: 5px; background: var(--lime); color: #132012; text-transform: uppercase; flex: none; }

    /* Badminton Court Banner */
    .badminton-panel { padding: 14px; border-radius: 12px; background: linear-gradient(180deg, #1b382c 0%, #152b22 100%); border: 1.5px solid #487660; margin-top: 10px; }
    .badminton-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
    .badminton-side { padding: 10px; border-radius: 9px; background: rgba(12, 20, 15, .55); border: 1px solid rgba(255,255,255,.08); }
    .badminton-side.serving { border-color: var(--lime); background: rgba(194, 245, 104, .12); }
    .badminton-pts { font: 800 34px/1 var(--title); color: var(--text); }
    .badminton-side.serving .badminton-pts { color: var(--lime); }
    .serve-pill { display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; padding: 2px 7px; border-radius: 99px; background: var(--lime); color: #132012; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }

    /* Interactive Pitch & Court */
    .pitch-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .pitch-tab { flex: 1; padding: 8px 10px; border-radius: 9px; background: #1b271f; border: 1px solid var(--line); color: var(--muted); font-weight: 700; font-size: 12.5px; }
    .pitch-tab.active { background: var(--lime); color: #132012; border-color: var(--lime); }
    .pitch-stage { position: relative; width: 100%; max-width: 460px; margin: 0 auto; aspect-ratio: 3 / 4; max-height: 440px; border-radius: 14px; border: 2px solid #678e6a; background: radial-gradient(circle at 50% 50%, transparent 14%, rgba(255,255,255,.22) 14.5%, rgba(255,255,255,.22) 15.5%, transparent 16%), linear-gradient(to bottom, transparent 49.6%, rgba(255,255,255,.25) 49.8%, rgba(255,255,255,.25) 50.2%, transparent 50.4%), repeating-linear-gradient(to top, #1f3d29 0 28px, #254731 28px 56px); overflow: hidden; user-select: none; }
    .pitch-stage.volley-court { aspect-ratio: 1 / 1.05; max-height: 360px; background: linear-gradient(to bottom, rgba(255,255,255,.35) 33%, rgba(255,255,255,.35) 33.8%, transparent 33.8%), linear-gradient(180deg, #b86a35 0%, #9e5627 100%); border-color: #f3f5ec; }
    .pitch-stage.volley-court:before { content: "NET"; position: absolute; top: 0; left: 0; right: 0; height: 22px; background: rgba(14, 21, 17, .82); color: var(--lime); font-size: 10px; font-weight: 800; letter-spacing: .16em; display: grid; place-items: center; border: none; }
    .pitch-stage.volley-court:after { display: none; }
    .pitch-stage:not(.volley-court):before, .pitch-stage:not(.volley-court):after { content: ""; position: absolute; left: 24%; right: 24%; height: 15%; border: 1.5px solid rgba(255,255,255,.24); pointer-events: none; }
    .pitch-stage:not(.volley-court):before { top: 0; border-top: 0; }
    .pitch-stage:not(.volley-court):after { bottom: 0; border-bottom: 0; }
    .pitch-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 2; cursor: pointer; max-width: 88px; text-align: center; background: none; border: none; padding: 0; }
    .pitch-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--team, var(--lime)); border: 2px solid #ffffff; color: #0d1410; font: 800 11px/1 var(--body); display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0,0,0,.45); transition: transform .15s; }
    .pitch-dot.libero { background: #f9d452; color: #132012; border-color: #132012; }
    .pitch-node:hover .pitch-dot, .pitch-node.selected .pitch-dot { transform: scale(1.16); outline: 3px solid var(--lime); }
    .pitch-label { background: rgba(11, 18, 14, .88); color: #f3f5ec; padding: 2px 6px; border-radius: 5px; font-size: 10.5px; font-weight: 650; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 84px; border: 1px solid rgba(255,255,255,.14); }
    .player-spotlight { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: #1b2820; border: 1px solid #3c4f40; display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .subs-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
    .sub-chip { padding: 6px 10px; border-radius: 8px; background: #1a261f; border: 1px solid var(--line); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
    .sub-chip.subbed { border-color: #4f7a49; color: var(--lime); }
    .volley-meta-bar { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #1a261f; border: 1px solid var(--line); font-size: 12px; margin-bottom: 10px; }

    .timeline { list-style: none; padding: 0; margin: 0; }
    .timeline li, .attempt-row, .set-row { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
    .timeline time { color: var(--lime); min-width: 34px; font-weight: 700; }
    .notice { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: #2b2d1d; border-radius: 10px; font-size: 13px; }
    .status-msg { color: var(--muted); font-size: 12.5px; }
    .attempt-row strong, .set-row strong { margin-left: auto; }
    .card-mark { display: inline-block; width: 10px; height: 14px; border-radius: 2px; vertical-align: -2px; margin-right: 6px; }
    .card-mark.yellow { background: #f9d452; }
    .card-mark.red { background: #ff6559; }

    /* ================= USER-FRIENDLY STAFF CONTROL ROOM ================= */
    #admin-shell { --forest: #142b22; --admin-lime: #c4f66a; --ink: #192820; --admin-muted: #55675c; --admin-line: #d6ded5; --admin-bg: #eef2eb; color-scheme: light; font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); background: var(--admin-bg); min-height: 100vh; }
    #admin-shell > header { background: var(--forest); color: white; border-bottom: 3px solid var(--admin-lime); }
    #admin-shell .header-inner, #admin-shell main { max-width: 860px; margin: auto; padding: 0 18px; }
    #admin-shell .header-inner, #admin-shell .intro, #admin-shell .bar, #admin-shell .item, #admin-shell .actions, #admin-shell .account { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #admin-shell .header-inner { height: 64px; }
    #admin-shell .brand { font-family: 'Barlow Condensed', Impact, sans-serif; font-size: 25px; font-weight: 800; color: white; display: flex; align-items: center; gap: 10px; }
    #admin-shell .brand em { color: var(--admin-lime); font-style: italic; }
    #admin-shell .public-link { color: #eff6e8; font-size: .9rem; font-weight: 600; background: rgba(255,255,255,.1); padding: 7px 12px; border-radius: 8px; }
    #admin-shell .public-link:hover { background: rgba(255,255,255,.18); }
    #admin-shell .intro { padding: 20px 0 14px; }
    #admin-shell .overline { font-weight: 700; color: var(--admin-muted); text-transform: uppercase; letter-spacing: .12em; margin: 0; font-size: .75rem; }
    #admin-shell h1, #admin-shell h2, #admin-shell h3 { font-family: 'Barlow Condensed', Impact, sans-serif; margin: 0; font-weight: 700; line-height: 1.05; color: var(--ink); }
    #admin-shell h1 { font-size: clamp(30px, 5vw, 44px); }
    #admin-shell h2 { font-size: 26px; }
    #admin-shell h3 { font-size: 21px; }
    #admin-shell button { cursor: pointer; background: white; border: 1px solid #c3cfc3; border-radius: 10px; color: var(--ink); font: 650 .9rem 'DM Sans', system-ui; padding: 9px 14px; min-height: 40px; transition: all .15s; }
    #admin-shell button:hover:not(:disabled) { border-color: #607a66; background: #f8faf7; }
    #admin-shell button.primary, #admin-shell button.active { background: var(--forest); color: white; border-color: var(--forest); }
    #admin-shell button.primary:hover:not(:disabled) { background: #1e3d31; }
    #admin-shell button.accent { background: var(--admin-lime); color: var(--forest); border-color: #a9df4c; font-weight: 750; }
    #admin-shell button.accent:hover:not(:disabled) { background: #d3ff82; }
    #admin-shell button.danger { color: #a1261d; border-color: #e4bcb8; background: #fff9f8; }
    #admin-shell button.danger:hover:not(:disabled) { background: #ffecea; border-color: #c86d65; }
    #admin-shell .actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-start; gap: 8px; }
    #admin-shell .panel { background: white; border: 1px solid var(--admin-line); padding: clamp(16px, 3vw, 24px); border-radius: 16px; margin: 0 0 18px; box-shadow: 0 2px 8px rgba(20, 43, 34, .04); }
    #admin-shell .login { max-width: 440px; margin: 20px auto; }
    #admin-shell .login input { width: 100%; }

    /* Admin Quick Navigation Tabs */
    .adm-nav-strip { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; scrollbar-width: none; }
    .adm-nav-strip::-webkit-scrollbar { display: none; }
    .adm-nav-tab { flex: none; padding: 9px 15px !important; border-radius: 99px !important; font-size: .88rem !important; background: white !important; border: 1px solid #cbd6ca !important; color: var(--ink) !important; }
    .adm-nav-tab.active { background: var(--forest) !important; color: var(--admin-lime) !important; border-color: var(--forest) !important; }

    /* Admin Search & Filter Bar */
    .adm-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; background: #f5f8f3; padding: 10px 12px; border-radius: 12px; border: 1px solid #dce4da; margin-bottom: 14px; }
    .adm-search { flex: 1; min-width: 200px; background: white !important; border: 1px solid #b8c7bb !important; border-radius: 9px !important; padding: 8px 12px !important; min-height: 40px; }
    .adm-pills { display: flex; gap: 5px; flex-wrap: wrap; }
    .adm-pill-btn { padding: 6px 11px !important; min-height: 34px !important; font-size: .82rem !important; border-radius: 8px !important; }

    /* Admin Fixture Row & Reorder Controls */
    .adm-fixture-card { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 1px solid #dce4da; border-radius: 12px; background: #fcfdfb; margin-bottom: 10px; transition: border-color .15s, background .15s; }
    .adm-fixture-card:hover { border-color: #93ab96; background: white; }
    .adm-fixture-card.is-live { border-left: 4px solid #4d9e38; background: #f6fbf3; }
    .adm-order-col { display: flex; flex-direction: column; gap: 4px; flex: none; }
    .adm-move-btn { width: 34px !important; height: 32px !important; min-height: 32px !important; padding: 0 !important; display: grid; place-items: center; font-size: 15px !important; font-weight: 800 !important; border-radius: 8px !important; background: #f1f5ef !important; color: var(--forest) !important; }
    .adm-move-btn:hover:not(:disabled) { background: var(--admin-lime) !important; border-color: #97c942 !important; }
    .adm-fixture-body { flex: 1; min-width: 0; }
    .adm-fixture-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .adm-status-badge { font-size: .72rem; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; background: #e8eee6; color: #3d5243; }
    .adm-status-badge.live { background: #c4f66a; color: #142b22; }
    .adm-status-badge.finished { background: #dce7f7; color: #1e3b63; }

    /* Admin Results Podium Form & Cards */
    .adm-podium-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
    @media (max-width: 720px) { .adm-podium-grid { grid-template-columns: 1fr; } }
    .adm-podium-slot { padding: 14px; border-radius: 12px; border: 1.5px solid #cbd6ca; background: #f8faf6; display: grid; gap: 10px; }
    .adm-podium-slot.slot-1 { border-color: #8cc63f; background: #f3fae9; }
    .adm-podium-slot.slot-2 { border-color: #9eb3c8; background: #f4f7fb; }
    .adm-podium-slot.slot-3 { border-color: #d49d6a; background: #fbf6f1; }
    .adm-podium-slot h3 { display: flex; align-items: center; justify-content: space-between; font-size: 20px; }
    .adm-result-summary-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .adm-result-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; background: #f0f5ed; border: 1px solid #d1ddd0; font-size: .84rem; font-weight: 600; }
    .adm-result-chip.r1 { background: #e6f7cc; border-color: #9ed455; }

    /* Arm Wrestling 4-Box Setup & Scoring */
    .arm-setup-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
    @media (max-width: 650px) { .arm-setup-grid { grid-template-columns: 1fr; } }
    .arm-setup-card { padding: 12px; border-radius: 10px; border: 1px solid #c5d1c6; background: #f8faf7; display: grid; gap: 8px; }
    .sc-arm-box { border: 1.5px solid #c4d2c3; border-radius: 11px; padding: 12px; background: #f8faf7; display: grid; gap: 9px; }
    .sc-arm-box.decided { border-color: #7ab356; background: #f1f8ec; }
    .sc-arm-slot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 8px; background: white; border: 1px solid #d5dfd4; flex-wrap: wrap; }
    .sc-arm-slot.win { background: #e4f7c8; border-color: #8cc63f; }

    #admin-shell .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 16px 0; }
    #admin-shell .fields-3 { display: grid; grid-template-columns: 1.2fr 1fr 1.1fr auto; align-items: end; gap: 10px; margin: 12px 0; }
    #admin-shell .full { grid-column: 1 / -1; }
    #admin-shell label.field { display: grid; gap: 6px; font-size: .88rem; font-weight: 650; color: var(--ink); }
    #admin-shell input, #admin-shell select, #admin-shell textarea { font: inherit; color: var(--ink); padding: 10px 11px; background: white; border: 1px solid #b8c7bb; border-radius: 9px; min-width: 0; max-width: 100%; min-height: 42px; }
    #admin-shell input[type=checkbox], #admin-shell input[type=radio] { accent-color: #31583d; min-height: auto; width: 17px; height: 17px; }
    #admin-shell .check { display: flex; align-items: center; gap: 8px; min-height: 32px; color: var(--ink); font-size: .9rem; cursor: pointer; }
    #admin-shell .pick { max-height: 210px; overflow: auto; padding: 10px; background: #f6f8f4; border-radius: 9px; border: 1px solid #e0e7df; }
    #admin-shell .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    #admin-shell .item { border-top: 1px solid var(--admin-line); padding: 14px 0; }
    #admin-shell .item:first-child { border-top: 0; }
    #admin-shell .meta, #admin-shell .hint { font-size: .88rem; color: var(--admin-muted); line-height: 1.45; text-transform: none; letter-spacing: normal; font-weight: 400; }
    #admin-shell .hint { margin: 8px 0 14px; }
    #admin-shell .pill { background: #e6f4d7; color: var(--ink); border-radius: 20px; padding: 5px 11px; font-size: .8rem; font-weight: 700; }
    #admin-shell .back { margin-bottom: 14px; }
    #admin-shell .bar { margin-bottom: 14px; align-items: center; }
    #admin-shell .spaced { margin-top: 16px; }
    #admin-shell fieldset { min-width: 0; border: 1px solid var(--admin-line); padding: 14px; border-radius: 12px; }
    #admin-shell legend { font-weight: 700; padding: 0 6px; color: var(--ink); font-size: .92rem; }
    #admin-shell details { padding: 12px; border: 1px solid var(--admin-line); border-radius: 10px; margin-top: 10px; }
    #admin-shell summary { cursor: pointer; font-weight: 650; color: var(--ink); }
    #notice:not(:empty) { padding: 12px 15px; background: #dff0c9; color: var(--ink); border: 1px solid #b8d892; border-radius: 10px; margin-bottom: 14px; font-weight: 600; font-size: .92rem; }
    #notice.error { color: #862b20; background: #ffeae6; border-color: #f0b9b0; }
    #admin-shell .award-row { display: grid; grid-template-columns: .7fr 1.3fr 1.3fr .8fr auto; align-items: end; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--admin-line); }
    #admin-shell main { padding-bottom: 60px; }

    /* Rubik's Cube, Eating & Push-Up Admin Controls */
    .sc-cube-team-block { border: 1px solid #dce4da; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: #f9fbf8; }
    .sc-cube-team-head { font-weight: 700; font-size: 14px; color: #142b22; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .sc-cube-player { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #e6ece4; flex-wrap: wrap; }
    .sc-cube-player:first-of-type { border-top: 0; }
    .sc-cube-player.solved { background: #eef7e6; padding: 8px 10px; border-radius: 8px; margin: 3px 0; border: 1px solid #c5e0ae; }
    .sc-cube-player.dnf { background: #fff3f1; padding: 8px 10px; border-radius: 8px; margin: 3px 0; border: 1px solid #ecc0ba; }
