<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1410">
  <meta name="description" content="The official Level Up ’26 college sports and games gala match centre. Follow fixtures, live scores and championship standings.">
  <title>Level Up ’26 · Match Centre</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=DM+Sans:wght@400;500;600;650;700;750&display=swap');

    /* ================= ROOT & RESET ================= */
    :root {
      color-scheme: dark;
      --outer-bg: #070b09;
      --bg: #0e1511;
      --panel: #16201a;
      --panel-2: #1c2821;
      --line: #2c3a31;
      --lime: #c2f568;
      --lime-dim: rgba(194, 245, 104, .14);
      --text: #f3f5ec;
      --muted: #9ea99c;
      --danger: #ff6559;
      --warn: #f9d452;
      --title: 'Barlow Condensed', 'Arial Narrow', Impact, sans-serif;
      --body: 'DM Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--outer-bg);
      color: var(--text);
      font: 15px/1.45 var(--body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; text-decoration: none; }
    button, a, select { touch-action: manipulation; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 2px;
    }
    button:disabled { opacity: .5; }
    .hidden, [hidden] { display: none !important; }

    /* ================= APP FRAME (COMPACT MOBILE-FIRST ON DESKTOP) ================= */
    .app-frame {
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
      box-shadow: 0 0 0 1px #1e2922, 0 24px 60px rgba(0, 0, 0, .65);
      display: flex;
      flex-direction: column;
    }

    /* ================= PUBLIC TOPBAR ================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(14, 21, 17, .92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #222e26;
      padding: 0 16px;
    }
    .top-inner {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--lime);
      width: 36px;
      height: 36px;
      color: #132012;
      font: italic 800 18px/1 var(--title);
      letter-spacing: -.04em;
      overflow: hidden;
      flex: none;
    }
    .brand-icon img { height: 100%; width: 100%; object-fit: contain; }
    .brand-icon.photo { background: none; }
    .brand b { display: block; font: italic 800 21px/.92 var(--title); letter-spacing: -.03em; }
    .brand i { color: var(--lime); font-style: italic; }
    .brand small {
      display: block;
      color: var(--muted);
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-top: 2px;
    }
    .menu-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      display: grid;
      place-items: center;
    }
    .menu-btn:hover { border-color: var(--lime); color: var(--lime); }

    .ico { width: 1.2em; height: 1.2em; display: inline-block; vertical-align: -.2em; flex: none; }
    .skip { position: absolute; left: -200vw; }
    .skip:focus { left: 10px; top: 10px; z-index: 50; background: #17251f; padding: 10px; }

    /* ================= SLIDE-OUT SIDE DRAWER ================= */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 6, .72);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(320px, 84vw);
      background: #131c17;
      border-left: 1px solid #2b382f;
      z-index: 45;
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.22, 1, .36, 1);
      display: flex;
      flex-direction: column;
      padding: 18px;
      overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }
    .drawer-head strong { font: italic 800 22px/1 var(--title); text-transform: uppercase; letter-spacing: -.02em; }
    .drawer-head strong span { color: var(--lime); }
    .drawer-nav { display: grid; gap: 8px; }
    .drawer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      text-align: left;
      width: 100%;
    }
    .drawer-item:hover { border-color: var(--lime); background: var(--panel-2); }
    .drawer-item.accent { background: var(--lime); color: #132012; border-color: var(--lime); font-weight: 700; }
    .drawer-item.accent:hover { background: #d5ff89; }
    .drawer-card {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .drawer-card h4 {
      margin: 0 0 8px;
      font: 700 12px/1 var(--body);
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--lime);
    }
    .drawer-card p, .drawer-card li { font-size: 13px; color: var(--muted); margin: 4px 0; }
    .drawer-card ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .drawer-card li strong { color: var(--text); display: block; font-size: 13.5px; }

    /* ================= MAIN CONTENT & TYPOGRAPHY ================= */
    main.container { padding: 16px 16px 96px; flex: 1; }
    #public-shell h1, #public-shell h2, #public-shell h3, #public-shell p { margin: 0; }
    #public-shell h1, #public-shell h2, #public-shell h3 { font-family: var(--title); line-height: 1.02; }
    #public-shell h1, #public-shell h2 { text-transform: uppercase; }
    .loading, .notice { margin: 18px 0; color: var(--muted); }

    /* Hero Card */
    .hero {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid #354738;
      border-radius: 18px;
      background: radial-gradient(circle at 85% 20%, rgba(194, 245, 104, .22), transparent 52%),
                  linear-gradient(135deg, #16291c 0%, #1d3524 60%, #2c4727 100%);
      padding: 22px 20px;
    }
    .hero:before, .hero:after { content: ""; position: absolute; inset: 0; z-index: -1; }
    .hero:before { background: url('./assets/pitch.jpg') center/cover no-repeat; opacity: .35; }
    .hero:after { background: linear-gradient(180deg, rgba(10, 22, 14, .45), rgba(10, 22, 14, .92)); }
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--lime);
    }
    .hero-kicker:before { content: ""; width: 16px; height: 2px; background: var(--lime); }
    .hero h1 { font-size: 52px; font-weight: 800; font-style: italic; letter-spacing: -.04em; line-height: .88; margin-top: 8px; }
    .hero h1 span { color: var(--lime); }
    .hero-bottom {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-actions { display: flex; gap: 8px; }
    .primary, .secondary, .link-btn, .seg, .tool-input {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 700;
    }
    .primary, .secondary { border-radius: 10px; padding: 9px 14px; border: 1px solid transparent; font-size: 13px; }
    .primary { background: var(--lime); color: #142013; }
    .secondary { background: rgba(24, 38, 28, .85); border-color: #465a48; color: var(--text); }
    .primary:hover { background: #d7ff91; }
    .secondary:hover { border-color: var(--lime); }
    .stats {
      display: inline-flex;
      gap: 14px;
      padding: 7px 12px;
      background: rgba(12, 20, 15, .75);
      border: 1px solid rgba(194, 245, 104, .22);
      border-radius: 10px;
    }
    .stats > div + div { padding-left: 14px; border-left: 1px solid #354738; }
    .stats strong { font: 700 20px/1 var(--title); color: var(--lime); display: block; }
    .stats small { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-top: 2px; }

    /* Sections & Cards */
    .section { margin-top: 22px; }
    .sect-head, .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .sect-head h2 { font-size: 26px; font-style: italic; letter-spacing: -.02em; }
    .link-btn { font-size: 12.5px; color: var(--lime); background: none; border: none; padding: 4px 0; }
    .card, .fixture, .team-tile, .rank-row, .sport-table, .live-article {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
    }
    .empty { padding: 16px; display: flex; align-items: center; gap: 14px; }
    .empty-icon {
      width: 40px;
      height: 40px;
      border: 1px solid #3a4c3d;
      background: #1f2e24;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: var(--lime);
      flex: none;
    }
    .empty strong { font-size: 14.5px; display: block; }
    .empty p, .muted, .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }

    /* Announcements Strip on Home */
    .announce-list { display: grid; gap: 8px; }
    .announce-card {
      padding: 12px 14px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(194, 245, 104, .11), rgba(22, 32, 26, .95));
      border: 1px solid rgba(194, 245, 104, .32);
      display: flex;
      gap: 11px;
      align-items: flex-start;
    }
    .announce-badge {
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--lime);
      color: #132012;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      flex: none;
      margin-top: 2px;
    }
    .announce-card strong { display: block; font-size: 14px; color: var(--text); }
    .announce-card p { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

    /* Teams Grid */
    .teams-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .team-tile {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 12px;
      position: relative;
      overflow: hidden;
      text-align: left;
      width: 100%;
    }
    .team-tile:before { position: absolute; top: 0; left: 0; bottom: 0; width: 3.5px; background: var(--team); content: ""; }
    .team-tile b, .team-line b { font: 700 20px/1.05 var(--title); letter-spacing: .01em; }
    .team-caption { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .crest {
      width: 40px;
      height: 40px;
      background: color-mix(in srgb, var(--team) 18%, #18221b);
      border: 1px solid color-mix(in srgb, var(--team) 45%, #344437);
      border-radius: 10px;
      display: inline-grid;
      place-items: center;
      color: var(--text);
      flex: none;
      font: 700 18px/1 var(--title);
      overflow: hidden;
    }
    .crest img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }

    /* Floating App Bottom Navigation */
    .bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      z-index: 25;
      border-top: 1px solid #2b382f;
      background: rgba(14, 21, 17, .94);
      backdrop-filter: blur(14px);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-inner { display: flex; justify-content: space-around; }
    .nav-inner a {
      flex: 1;
      color: var(--muted);
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-weight: 650;
      font-size: 10.5px;
      position: relative;
    }
    .nav-inner a .ico { width: 19px; height: 19px; }
    .nav-inner a[aria-current=page] { color: var(--lime); }
    .nav-inner a[aria-current=page]:after {
      content: "";
      height: 3px;
      background: var(--lime);
      width: 30px;
      position: absolute;
      top: 0;
      border-radius: 0 0 3px 3px;
    }

    /* Fixtures & Match Cards */
    .page-head { margin: 6px 0 16px; display: block; }
    .page-head h1 { font-size: 40px; font-style: italic; letter-spacing: -.03em; }
    .page-head p { color: var(--muted); margin-top: 4px; font-size: 13.5px; }
    .tools, .chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .tools { margin-bottom: 16px; }
    .seg, .tool-input {
      font-size: 12.5px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 11px;
    }
    .seg.active { background: var(--lime); border-color: var(--lime); color: #142013; }
    .tool-input { max-width: 100%; min-height: 36px; }
    .fixture-list, .rank-list { display: grid; gap: 10px; }
    .fixture { padding: 14px 15px; display: block; }
    .fixture:hover, .team-tile:hover, .rank-row summary:hover { border-color: #628554; background: var(--panel-2); }
    .info-line, .foot-line { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .fixture-sport, .meta { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      border: 1px solid #3f4f41;
      color: #c0c9bc;
      background: #202d23;
      border-radius: 6px;
      padding: 2px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .tag.live { color: #cbff9a; border-color: #53864b; background: #253e29; }
    .tag.live:before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--lime); animation: pulse 1.5s infinite; }
    .tag.finished { color: #c2d6f8; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }

    .team-line { display: flex; align-items: center; gap: 9px; margin-top: 9px; min-width: 0; }
    .team-line strong { margin-left: auto; font: 700 22px var(--title); }
    .team-line .crest, .stand-team .crest { width: 26px; height: 26px; border-radius: 7px; font-size: 12px; }
    .foot-line {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #28352c;
      flex-wrap: wrap;
      justify-content: flex-start;
      color: var(--muted);
      font-size: 11.5px;
    }
    .fixture-title { margin-top: 8px; font-size: 22px; }
    .day-title { font-size: 18px; margin: 16px 0 8px; color: var(--lime); }
    .group { margin: 12px 0 22px; }

    /* Standings Table */
    .sport-table { overflow: auto; }
    #public-shell table { border-collapse: collapse; width: 100%; text-align: center; font-size: 13px; }
    #public-shell th, #public-shell td { padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    #public-shell thead th { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: #1a261f; }
    #public-shell tbody tr:last-child td { border-bottom: 0; }
    #public-shell th:nth-child(2), #public-shell td:nth-child(2) { text-align: left; }
    .stand-team { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .live-pill-mini {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: #27432b;
      color: var(--lime);
      border: 1px solid #4e7e46;
      letter-spacing: .06em;
    }

    /* Leaderboard */
    .rank-row summary { cursor: pointer; display: flex; align-items: center; gap: 11px; padding: 12px 14px; list-style: none; }
    .rank-row summary::-webkit-details-marker { display: none; }
    .rank-index { min-width: 24px; font: 700 22px var(--title); color: var(--lime); }
    .rank-name { flex: 1; min-width: 0; }
    .rank-name b { display: block; font-size: 15px; }
    .rank-name small { color: var(--muted); font-size: 12px; }
    .rank-points { font: 700 22px var(--title); color: var(--lime); }
    .rank-points small { font: 600 10px var(--body); color: var(--muted); margin-left: 3px; }
    .award-list { padding: 0 14px 12px 48px; font-size: 13px; color: var(--muted); }
    .award-list li { margin: 4px 0; }
    .badge-count {
      font: 700 11px var(--body);
      vertical-align: middle;
      margin-left: 6px;
      color: var(--lime);
      background: #253623;
      border: 1px solid #465d41;
      border-radius: 99px;
      padding: 2px 8px;
    }

    /* Live Match Detail & Interactive Pitch */
    .live-article { padding: 16px; margin-top: 12px; }
    .match-clock-banner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      background: #1f3324;
      border: 1px solid #476d44;
      color: var(--lime);
      font: 700 13px/1 var(--body);
      font-variant-numeric: tabular-nums;
    }
    .match-score {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      text-align: center;
      padding: 18px 0;
    }
    .match-side { display: grid; justify-items: center; gap: 7px; font: 700 18px/1.1 var(--title); }
    .match-score > strong { font: 800 44px/1 var(--title); color: var(--lime); white-space: nowrap; }
    .match-score > strong small { display: block; font: 600 11px var(--body); color: var(--muted); margin-top: 5px; }
    .subhead { font-size: 21px; margin: 20px 0 8px; }

    /* Interactive Pitch */
    .pitch-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .pitch-tab {
      flex: 1;
      padding: 8px 10px;
      border-radius: 9px;
      background: #1b271f;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
      font-size: 12.5px;
    }
    .pitch-tab.active { background: var(--lime); color: #132012; border-color: var(--lime); }
    .pitch-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 440px;
      border-radius: 14px;
      border: 2px solid #678e6a;
      background:
        radial-gradient(circle at 50% 50%, transparent 14%, rgba(255,255,255,.22) 14.5%, rgba(255,255,255,.22) 15.5%, transparent 16%),
        linear-gradient(to bottom, transparent 49.6%, rgba(255,255,255,.25) 49.8%, rgba(255,255,255,.25) 50.2%, transparent 50.4%),
        repeating-linear-gradient(to top, #1f3d29 0 28px, #254731 28px 56px);
      overflow: hidden;
      user-select: none;
    }
    .pitch-stage:before, .pitch-stage:after {
      content: "";
      position: absolute;
      left: 24%;
      right: 24%;
      height: 15%;
      border: 1.5px solid rgba(255,255,255,.24);
      pointer-events: none;
    }
    .pitch-stage:before { top: 0; border-top: 0; }
    .pitch-stage:after { bottom: 0; border-bottom: 0; }

    .pitch-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      z-index: 2;
      cursor: pointer;
      max-width: 84px;
      text-align: center;
    }
    .pitch-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--team, var(--lime));
      border: 2px solid #ffffff;
      color: #0d1410;
      font: 800 11px/1 var(--body);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,.45);
      transition: transform .15s;
    }
    .pitch-node:hover .pitch-dot, .pitch-node.selected .pitch-dot { transform: scale(1.16); outline: 3px solid var(--lime); }
    .pitch-label {
      background: rgba(11, 18, 14, .86);
      color: #f3f5ec;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 650;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 82px;
      border: 1px solid rgba(255,255,255,.14);
    }
    .player-spotlight {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #1b2820;
      border: 1px solid #3c4f40;
      display: flex;
      align-items: center;
      justify-content: space-between;

  <script type="module">
    /* ================= 1. SUPABASE BACKEND ================= */
    const base = 'https://jkelyomdaylljxnvhuhi.supabase.co';
    const key = 'sb_publishable_nM0-WI_TOSBJsr5N4MaT9Q_6Ju3JEVO';
    const sessionKey = 'levelup.gala.session';
    const META_ID = '00000000-0000-0000-0000-000000000026';
    let renewing;
    let generation = 0;

    function readSession() {
      try { return JSON.parse(sessionStorage.getItem(sessionKey)); }
      catch { return null; }
    }

    function writeSession(data) {
      if (!data?.access_token) return false;
      sessionStorage.setItem(sessionKey, JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires: Date.now() + data.expires_in * 1000
      }));
      return true;
    }

    async function request(path, body, token) {
      const headers = { apikey: key, 'Content-Type': 'application/json' };
      if (token) headers.Authorization = 'Bearer ' + token;
      const response = await fetch(base + path, { method: 'POST', headers, body: JSON.stringify(body), cache: 'no-store' });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error(data?.message || data?.msg || data?.error_description || 'The request failed. Please try again.');
        error.status = response.status;
        throw error;
      }
      return data;
    }

    async function accessToken() {
      const session = readSession();
      if (!session) return undefined;
      if (session.expires > Date.now() + 60000) return session.access_token;
      if (!renewing) {
        const start = generation;
        renewing = request('/auth/v1/token?grant_type=refresh_token', { refresh_token: session.refresh_token })
          .then(data => {
            if (generation !== start) return readSession()?.access_token;
            writeSession(data);
            return data.access_token;
          }).catch(error => {
            if (generation === start && [400, 401, 403].includes(error.status)) {
              sessionStorage.removeItem(sessionKey);
              throw new Error('Your session expired. Please sign in again.');
            }
            throw error;
          }).finally(() => { renewing = undefined; });
      }
      return renewing;
    }

    async function rpc(name, args) {
      return request('/rest/v1/rpc/gala_' + name, args, await accessToken());
    }

    function logoUrl(path) {
      if (/^\/api\/photo\/[a-z0-9-]+$/i.test(path || '')) return 'https://campus-auction-arena.vercel.app' + path;
      if (/^https:\/\//i.test(path || '') || /^data:image\/(png|jpeg|webp|gif);base64,/i.test(path || '')) return path;
      return '';
    }

    async function snapshot() {
      const result = await rpc('snapshot', {});
      for (const team of result.teams) team.logo = logoUrl(team.logo);
      result.branding.logo = logoUrl(result.branding.logo);
      const metaRec = (result.fixtures || []).find(f => f.id === META_ID || f.details?.isSiteMeta);
      result.siteMeta = metaRec?.details?.siteMeta || {
        announcements: [
          { title: 'Welcome to Level Up ’26', body: 'Follow live match updates, standings and championship points right here.' }
        ],
        committee: [
          { role: 'General Convenor', name: 'Sports Committee · Level Up ’26' },
          { role: 'Match Control', name: 'Gala Technical Desk' }
        ],
        contact: 'For fixture enquiries or protests, visit the Gala Control Desk at the main venue.'
      };
      result.metaRecord = metaRec || null;
      result.fixtures = (result.fixtures || []).filter(f => f.id !== META_ID && !f.details?.isSiteMeta);
      return result;
    }

    function save(id, version, section, value = {}) {
      return rpc('save', { p_id: id, p_version: version, p_section: section, p_value: value });
    }

    function manager(email, permissions, assigned, remove = false) {
      return rpc('manager', { p_email: email, p_permissions: permissions, p_assigned: assigned, p_remove: remove });
    }

    async function login(email, password) {
      const data = await request('/auth/v1/token?grant_type=password', { email: email.trim(), password });
      generation++;
      writeSession(data);
    }

    async function register(email, password) {
      const data = await request('/auth/v1/signup', { email: email.trim(), password });
      generation++;
      const signedIn = writeSession(data);
      return { signedIn, confirmationRequired: !signedIn };
    }

    async function logout() {
      const token = readSession()?.access_token;
      generation++;
      sessionStorage.removeItem(sessionKey);
      if (token) await request('/auth/v1/logout?scope=local', {}, token).catch(() => {});
    }

    /* ================= 2. STOPWATCH & SCORING ENGINE ================= */
    const sides = ['home', 'away'];
    const sideKey = side => side === 'home' ? 'Home' : 'Away';
    const opponent = side => side === 'home' ? 'away' : 'home';
    const integer = (v, min = 0) => Number.isSafeInteger(v) && v >= min;
    const check = (condition, message) => { if (!condition) throw new Error(message); };
    const number = (v, fallback) => integer(Number(v), 1) ? Number(v) : fallback;

    function computeClock(history = [], status = 'scheduled') {
      let accMs = 0;
      let runningSince = null;
      for (const e of history) {
        if (e.kind === 'start' && runningSince === null) {
          runningSince = Date.parse(e.at);
        } else if (e.kind === 'timer_start') {
          if (typeof e.baseSec === 'number') accMs = e.baseSec * 1000;
          runningSince = Date.parse(e.at);
        } else if (e.kind === 'timer_pause' || e.kind === 'finish') {
          if (runningSince !== null) {
            accMs += Math.max(0, Date.parse(e.at) - runningSince);
            runningSince = null;
          }
          if (typeof e.baseSec === 'number') accMs = e.baseSec * 1000;
        } else if (e.kind === 'timer_set') {
          accMs = (Number(e.baseSec) || 0) * 1000;
          if (runningSince !== null) runningSince = Date.parse(e.at);
        }
      }
      if (status === 'finished') runningSince = null;
      return { accMs, runningSince };
    }

    function formatClock(clock, now = Date.now()) {
      const extra = clock.runningSince ? Math.max(0, now - clock.runningSince) : 0;
      const totalSec = Math.floor((clock.accMs + extra) / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return {
        mins,
        secs,
        text: String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0'),
        running: Boolean(clock.runningSince)
      };
    }

    function volleyballRules(details) {
      const bestOf = number(details.bestOf, 3);
      return {
        toWin: Math.floor(bestOf / 2) + 1,
        target: number(details.pointLimit, 25),
        deciding: number(details.decidingLimit, 15),
        margin: details.winByTwo === false ? 1 : 2
      };
    }

    function settleSet(score, rules) {
      const deciding = sides.every(side => score.setsWon[side] === rules.toWin - 1);
      const target = deciding ? rules.deciding : rules.target;
      const lead = score.home > score.away ? 'home' : 'away';
      if (score[lead] < target || score[lead] - score[opponent(lead)] < rules.margin) return;
      score.sets.push({ home: score.home, away: score.away });
      score.setsWon[lead]++;
      if (score.setsWon[lead] >= rules.toWin) score.winner = lead;
      else {
        score.home = 0;
        score.away = 0;
        score.period = 'Set ' + (score.sets.length + 1);
      }
    }

    function replay(details, history = []) {
      const initHome = (details.positionsHome?.length ? details.positionsHome.map(p => p.playerId) : details.lineupHome) || [];
      const initAway = (details.positionsAway?.length ? details.positionsAway.map(p => p.playerId) : details.lineupAway) || [];
      const score = {
        status: 'scheduled', home: 0, away: 0, period: '', sets: [],
        setsWon: { home: 0, away: 0 }, attempts: {}, results: {}, winner: null,
        activeLineups: { home: [...initHome], away: [...initAway] },
        timeline: history
      };
      for (const e of history) {
        switch (e.kind) {
          case 'start':
            score.status = 'live';
            score.period = e.period || '';
            break;
          case 'finish':
            score.status = 'finished';
            if (!score.winner && details.format !== 'individual' && score.home !== score.away && details.sport !== 'volleyball') {
              score.winner = score.home > score.away ? 'home' : 'away';
            }
            break;
          case 'period': score.period = e.period; break;
          case 'goal': case 'point': score[e.side]++; break;
          case 'yellow': case 'red':
            if (e.kind === 'red') score.activeLineups[e.side] = score.activeLineups[e.side].filter(id => id !== e.playerId);
            break;
          case 'sub':
            score.activeLineups[e.side] = score.activeLineups[e.side].map(id => id === e.playerId ? e.otherPlayerId : id);
            break;
          case 'rally':
            score[e.side]++;
            settleSet(score, e.rules);
            break;
          case 'correct':
            score.home = e.home; score.away = e.away;
            if (e.rules) settleSet(score, e.rules);
            break;
          case 'hit': case 'miss': {
            const attempt = score.attempts[e.playerId] ||= { hits: 0, total: 0 };
            attempt.total++;
            if (e.kind === 'hit') attempt.hits++;
            break;
          }
          case 'result': score.results[e.playerId] = e.value; break;
        }
      }
      return score;
    }

    function record(details, previous, input) {
      const timeline = [...(previous.timeline || [])];
      if (input.kind === 'undo') {
        check(timeline.length, 'There are no recorded actions to undo.');
        timeline.pop();
        return replay(details, timeline);
      }
      const s = replay(details, timeline);
      const e = { ...input, at: new Date().toISOString() };
      const sport = details.sport;
      const individual = details.format === 'individual';
      if (e.kind === 'start') {
        check(s.status === 'scheduled', 'This event has already started.');
        e.period = individual ? '' : sport === 'football' ? 'First half' : sport === 'volleyball' ? 'Set 1' : '';
      } else {
        check(s.status === 'live', 'Go live before recording a score.');
        if (['goal', 'yellow', 'red', 'sub', 'point', 'rally'].includes(e.kind)) check(sides.includes(e.side), 'Choose a team.');
        switch (e.kind) {
          case 'finish':
          case 'timer_start':
          case 'timer_pause':
          case 'timer_set':
            break;
          case 'goal': case 'yellow': case 'red': case 'sub': case 'period':
            check(sport === 'football' && !individual, 'This control is for team football.');
            if (e.kind === 'period') check(['First half', 'Half time', 'Second half', 'Extra time', 'Penalties'].includes(e.period), 'Choose the match period.');
            else {
              check(integer(e.minute) && e.minute <= 999, 'Enter a match minute between 0 and 999.');
              if (e.kind !== 'goal') check(e.playerId, 'Select a player.');
              if (e.kind === 'sub') check(e.otherPlayerId && e.otherPlayerId !== e.playerId, 'Choose the player coming on.');
            }
            break;
          case 'rally':
            check(sport === 'volleyball' && !individual && !s.winner, 'The final set is complete.');
            e.rules = volleyballRules(details);
            break;
          case 'point': check(!individual && sport === 'custom', 'Choose a team event.'); break;
          case 'correct':
            check(!individual && !s.winner, 'Undo the last rally to correct a completed match.');
            check(integer(e.home) && integer(e.away), 'Scores must be whole numbers of zero or more.');
            if (sport === 'volleyball') e.rules = volleyballRules(details);
            break;
          case 'hit': case 'miss': case 'result':
            check(individual && (details.playerIds || []).includes(e.playerId), 'Choose a registered participant.');
            if (e.kind === 'result') check(Number.isFinite(e.value), 'Enter a valid result.');
            else {
              check(sport === 'crossbar', 'Attempts are available for crossbar challenges.');
              check((s.attempts[e.playerId]?.total || 0) < number(details.attemptLimit, 5), 'This player has used all attempts.');
            }
            break;
          default: throw new Error('Unknown scoring action.');
        }
      }
      timeline.push(e);
      return replay(details, timeline);
    }

    function node(tag, title, className) {
      const el = document.createElement(tag);
      if (title != null) el.textContent = title;
      if (className) el.className = className;
      return el;
    }
    function scSelect(items) {
      const el = node('select');
      for (const [value, text] of items) el.add(new Option(text, value));
      return el;
    }
    function numeric(value, min = 0, max = null) {
      const el = node('input');
      el.type = 'number'; el.value = value; el.min = min;
      if (max != null) el.max = max;
      return el;
    }
    function scField(label, control) {
      const el = node('label', label, 'sc-field'); el.append(control); return el;
    }

    let adminClockInterval = null;
    function mountScoring(container, fixture, data, onSave) {
      if (adminClockInterval) { clearInterval(adminClockInterval); adminClockInterval = null; }
      const d = fixture.details;
      const score = replay(d, fixture.score?.timeline || []);
      const teams = new Map((data.teams || []).map(t => [t.id, t]));
      const players = new Map((data.players || []).map(p => [p.id, p]));
      const team = side => teams.get(d[side + 'Id'])?.name || sideKey(side);
      const player = id => players.get(id)?.name || 'Player';
      const individual = d.format === 'individual';
      const panel = node('section', null, 'sc-console'); container.replaceChildren(panel);
      const title = node('div', null, 'sc-head');
      title.append(node('h3', 'Scoring desk'), node('span', score.status, 'sc-state ' + score.status));
      panel.append(title);
      const feedback = node('p', '', 'sc-feedback'); feedback.setAttribute('role', 'alert');
      let busy = false;
      async function submit(action) {
        if (busy) return;
        try {
          const next = record(d, fixture.score || {}, action);
          busy = true; panel.inert = true; feedback.textContent = '';
          await onSave(next);
        } catch (error) { feedback.textContent = error.message || 'Could not save this action.'; }
        finally { busy = false; panel.inert = false; }
      }
      function button(label, run, style = '') {
        const b = node('button', label, 'sc-btn ' + style);
        b.type = 'button'; b.addEventListener('click', run); return b;
      }
      function section(name) {
        const box = node('div', null, 'sc-box'); box.append(node('h4', name)); panel.append(box); return box;
      }
      const statusLabel = score.status === 'live' ? score.period || 'Live' : score.status === 'finished' ? 'Final result' : 'Scheduled';
      if (!individual) {
        const board = node('div', null, 'sc-board');
        for (const side of sides) {
          const col = node('div'); col.append(node('span', team(side)), node('strong', String(score[side])));
          if (d.sport === 'volleyball') col.append(node('small', score.setsWon[side] + ' sets won'));
          board.append(col);
        }
        panel.append(board, node('p', statusLabel, 'sc-period'));
        if (score.sets.length) panel.append(node('p', score.sets.map((set, i) => 'Set ' + (i + 1) + ' · ' + set.home + '–' + set.away).join('   /   '), 'sc-sets'));
      }

      /* Live Stopwatch Controls */
      if (score.status === 'live') {
        const clockData = computeClock(score.timeline, score.status);
        const timerBox = node('div', null, 'sc-timer-box');
        const left = node('div');
        const clockEl = node('div', formatClock(clockData).text, 'sc-clock-display');
        const subEl = node('small', clockData.running ? 'Timer running' : 'Timer stopped / paused');
        subEl.style.color = '#b0b9ac';
        left.append(clockEl, subEl);

        const btns = node('div', null, 'sc-row');
        if (clockData.running) {
          btns.append(button('Stop / Pause timer', () => {
            const cur = formatClock(clockData);
            submit({ kind: 'timer_pause', baseSec: cur.mins * 60 + cur.secs, label: 'Timer paused at ' + cur.text });
          }, 'sc-stop'));
        } else {
          btns.append(button('Resume timer', () => {
            const cur = formatClock(clockData);
            submit({ kind: 'timer_start', baseSec: cur.mins * 60 + cur.secs, label: 'Timer resumed at ' + cur.text });
          }, 'sc-primary'));
        }
        btns.append(button('Reset 00:00', () => submit({ kind: 'timer_set', baseSec: 0, label: 'Timer reset to 00:00' })));
        btns.append(button('Set 45:00', () => submit({ kind: 'timer_set', baseSec: 45 * 60, label: 'Timer set to 45:00' })));
        timerBox.append(left, btns);
        panel.append(timerBox);

        if (clockData.running) {
          adminClockInterval = setInterval(() => {
            if (!document.body.contains(clockEl)) { clearInterval(adminClockInterval); return; }
            clockEl.textContent = formatClock(clockData).text;
          }, 1000);
        }
      }

      if (score.status === 'scheduled') panel.append(button('Go live & start timer', () => submit({ kind: 'start', label: 'Event started' }), 'sc-primary'));
      if (score.status === 'live') {
        if (!individual && d.sport === 'football') {
          const controls = section('Match incident');
          const period = scSelect(['First half', 'Half time', 'Second half', 'Extra time', 'Penalties'].map(s => [s, s])); period.value = score.period;
          controls.append(scField('Period', period), button('Update period', () => submit({ kind: 'period', period: period.value, label: period.value })));
          const side = scSelect(sides.map(k => [k, team(k)]));
          const currentMin = formatClock(computeClock(score.timeline, score.status)).mins;
          const minute = numeric(currentMin || [...score.timeline].reverse().find(e => integer(e.minute))?.minute || 0, 0, 999);
          const who = scSelect([]), incoming = scSelect([]);
          const fill = () => {
            const k = side.value; const roster = (data.players || []).filter(p => p.teamId === d[k + 'Id']);
            const active = score.activeLineups[k].filter(Boolean);
            const hasLineup = active.length > 0;
            const sentOff = new Set(score.timeline.filter(e => e.side === k && e.kind === 'red').map(e => e.playerId));
            who.replaceChildren(new Option('Select player', ''));
            incoming.replaceChildren(new Option('Select substitute', ''));
            for (const p of roster.filter(p => !sentOff.has(p.id))) {
              if (!hasLineup || active.includes(p.id)) who.add(new Option(p.name, p.id));
              if (!hasLineup || !active.includes(p.id)) incoming.add(new Option(p.name, p.id));
            }
          };
          side.onchange = fill; fill();
          const form = node('div', null, 'sc-grid');
          form.append(scField('Team', side), scField('Minute (auto-filled)', minute), scField('Player', who), scField('Coming on (for Sub)', incoming)); controls.append(form);
          const row = node('div', null, 'sc-row'); controls.append(row);
          for (const [kind, label] of [['goal', 'Goal'], ['yellow', 'Yellow card'], ['red', 'Red card'], ['sub', 'Substitution']]) {
            row.append(button(label, () => submit({
              kind, side: side.value, playerId: who.value, otherPlayerId: kind === 'sub' ? incoming.value : '', minute: minute.valueAsNumber,
              label: label + ' · ' + team(side.value) + (who.value ? ' · ' + player(who.value) : '') + (kind === 'sub' ? ' / ' + player(incoming.value) : '')
            }), kind === 'goal' ? 'sc-primary' : ''));
          }
        } else if (!individual) {
          const box = section(d.sport === 'volleyball' ? 'Record rally' : 'Add point');
          if (score.winner) box.append(node('p', team(score.winner) + ' won the match.'));
          else {
            const buttons = node('div', null, 'sc-row'); box.append(buttons);
            for (const side of sides) buttons.append(button('+1 ' + team(side), () => submit({ kind: d.sport === 'volleyball' ? 'rally' : 'point', side, label: 'Point · ' + team(side) }), 'sc-primary'));
          }
        } else {
          const box = section(d.sport === 'crossbar' ? 'Record attempt' : 'Record individual result');
          const ids = d.playerIds || [];
          const pick = scSelect(ids.map(id => [id, player(id)])); box.append(scField('Participant', pick));
          if (d.sport === 'crossbar') {
            const info = node('p', '', 'sc-info');
            const update = () => { const a = score.attempts[pick.value] || { hits: 0, total: 0 }; info.textContent = a.hits + ' hits · ' + a.total + ' of ' + number(d.attemptLimit, 5) + ' attempts'; };
            update(); pick.onchange = update; box.append(info);
            for (const [kind, label] of [['hit', 'Hit'], ['miss', 'Miss']]) box.append(button(label, () => submit({ kind, playerId: pick.value, label: label + ' · ' + player(pick.value) }), kind === 'hit' ? 'sc-primary' : ''));
          } else {
            const val = numeric(score.results[pick.value] ?? ''); val.step = 'any'; pick.onchange = () => { val.value = score.results[pick.value] ?? ''; };
            box.append(scField('Result value', val), button('Save result', () => submit({ kind: 'result', playerId: pick.value, value: val.valueAsNumber, label: player(pick.value) + ' · ' + val.value }), 'sc-primary'));
          }
        }
        if (!individual && !score.winner) {
          const correction = node('details', null, 'sc-box'); correction.append(node('summary', 'Correct current score'));
          const h = numeric(score.home), a = numeric(score.away);
          correction.append(scField(team('home'), h), scField(team('away'), a), button('Save correction', () => submit({ kind: 'correct', home: h.valueAsNumber, away: a.valueAsNumber, label: 'Score corrected to ' + h.value + '–' + a.value }))); panel.append(correction);
        }
      }
      const foot = node('div', null, 'sc-row'); panel.append(foot);
      if (score.timeline.length) foot.append(button('Undo last action', () => submit({ kind: 'undo' })));
      if (score.status === 'live') foot.append(button('Finish event', () => { if (window.confirm('Finish this event and publish the final score?')) submit({ kind: 'finish', label: 'Full time' }); }));
      panel.append(feedback);
      if (score.timeline.length) {
        const box = section('Recent actions (admin log)');
        const list = node('ol', null, 'sc-history');
        for (const e of score.timeline.slice(-5).reverse()) list.append(node('li', (e.minute != null ? e.minute + '′  ' : '') + (e.label || e.kind)));
        box.append(list);
      }
    }

    /* ================= 3. FORMATION HELPERS ================= */
    function generatePositions(formationStr, existing = []) {
      const nums = String(formationStr || '').split('-').map(Number).filter(n => n > 0 && n <= 11);
      const rows = nums.length ? [1, ...nums] : [1, 4, 3, 3];
      const out = [];
      let idx = 0;
      const totalRows = rows.length;
      rows.forEach((count, rIdx) => {
        const y = totalRows === 1 ? 85 : Math.round(88 - (rIdx / (totalRows - 1)) * 74);
        for (let c = 0; c < count; c++) {
          const x = Math.round(((c + 1) / (count + 1)) * 100);
          out.push({ x, y, playerId: existing[idx]?.playerId || '' });
          idx++;
        }
      });
      return out;
    }

    /* ================= 4. PUBLIC MATCH CENTRE UI ================= */
    const main = document.querySelector('#content');
    const nav = document.querySelector('#navigation');
    const views = ['home', 'fixtures', 'standings', 'leaderboard', 'live'];
    const symbols = {
      home: '<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',
      fixtures: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v5m10-5v5M3 11h18"/>',
      standings: '<path d="M3 21V11h5v10zm6 0V4h6v17zm7 0v-8h5v8z"/>',
      leaderboard: '<path d="M7 3h10v5a5 5 0 0 1-10 0zm0 2H3v2a4 4 0 0 0 5 4m9-6h4v2a4 4 0 0 1-5 4m-4 2v5m-4 2h8"/>',
      live: '<circle cx="12" cy="12" r="2"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9m9-9a6.4 6.4 0 0 1 0 9M4.3 4.3a10.9 10.9 0 0 0 0 15.4m15.4-15.4a10.9 10.9 0 0 1 0 15.4"/>',
      settings: '<circle cx="12" cy="8" r="3.5"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/>',
      field: '<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M12 5v14"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
      pin: '<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0z"/><circle cx="12" cy="10" r="2"/>',
      people: '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-14a3 3 0 0 1 0 5m1 3a5 5 0 0 1 4 5"/>',
      menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
      close: '<path d="M6 6l12 12M18 6 6 18"/>'
    };
    function icon(name) { return `<svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${symbols[name] || symbols.field}</svg>`; }
    function e(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function color(s) { return /^#[0-9a-f]{3,8}$/i.test(s) ? s : '#9dbd75'; }
    function imgURL(s) { return typeof s === 'string' && (/^(https:\/\/|data:image\/(?:png|jpe?g|webp|gif|avif);base64,)/i.test(s) || /^\.\/assets\/[\w.-]+$/.test(s)) ? s : ''; }
    const fmtTime = new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' });
    const fmtDay = new Intl.DateTimeFormat('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' });
    const fmtKey = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Kolkata' });
    const day = (s, fmt = fmtDay) => s && Number.isFinite(Date.parse(s)) ? fmt.format(new Date(s)) : 'Time TBC';
    const standardName = { football: 'Football', volleyball: 'Volleyball', crossbar: 'Crossbar challenge', custom: 'Custom event' };
    const label = s => String(s || '').replace(/^./, c => c.toUpperCase());
    const state = { teams: [], players: [], fixtures: [], branding: {}, siteMeta: { announcements: [], committee: [], contact: '' } };
    const filters = { status: 'all', sport: 'all', team: 'all', date: 'all', leader: 'teams', pitchSide: 'home', selectedPlayer: '' };
    let loaded = false, failed = false, refreshing = false, lastHash = '', priorSignature = '';

    const team = id => state.teams.find(t => t.id === id);
    const player = id => state.players.find(p => p.id === id);
    const score = f => f.score || {};
    const st = f => score(f).status || 'scheduled';
    const title = f => f.details?.name || standardName[f.details?.sport] || 'Event';
    const mode = f => f.details.format === 'individual';
    const ids = f => Array.isArray(f.details.playerIds) ? f.details.playerIds : [];
    const groupTeam = (f, t) => f.details.homeId === t || f.details.awayId === t || ids(f).some(id => player(id)?.teamId === t);
    const fixtures = () => [...state.fixtures].sort((a, b) => String(a.details.startTime || '9999').localeCompare(String(b.details.startTime || '9999')));
    const fixtureLink = f => '#match/' + encodeURIComponent(f.id);

    function crest(t) { let u = imgURL(t?.logo); return `<span class="crest" style="--team:${color(t?.color)}">${u ? `<img alt="" loading="lazy" src="${e(u)}">` : e((t?.name || '?').slice(0, 2).toUpperCase())}</span>`; }
    function empty(name, heading, body) { return `<div class="card empty"><span class="empty-icon">${icon(name)}</span><div><strong>${e(heading)}</strong><p>${e(body)}</p></div></div>`; }
    function sectionHead(title, link, href) { return `<div class="sect-head"><h2>${title}</h2>${link ? `<a class="link-btn" href="${href}">${link}</a>` : ''}</div>`; }
    function status(f) {
      const s = st(f);
      if (s === 'live') {
        const clk = formatClock(computeClock(score(f).timeline, 'live'));
        return `<span class="tag live">Live · <span data-live-clock="${e(f.id)}">${clk.text}</span></span>`;
      }
      return `<span class="tag ${s === 'finished' ? 'finished' : ''}">${s === 'finished' ? 'Full time' : e(label(s))}</span>`;
    }
    function sportName(f) { return standardName[f.details.sport] || label(f.details.sport); }
    function rowTeam(t, s) { return `<div class="team-line">${crest(t)}<b>${e(t?.name || 'Team TBC')}</b><strong>${e(s)}</strong></div>`; }
    function fixtureCard(f) {
      let d = f.details, s = score(f), v = d.sport === 'volleyball', hasScore = st(f) !== 'scheduled', individual = mode(f);
      return `<a class="fixture" href="${fixtureLink(f)}"><div class="info-line"><span class="fixture-sport">${e(sportName(f))}${d.stage ? ' · ' + e(d.stage) : ''}</span>${status(f)}</div><h3 class="fixture-title">${e(title(f))}</h3>${individual ? `<p class="hint">${ids(f).length} ${ids(f).length === 1 ? 'participant' : 'participants'}</p>` : rowTeam(team(d.homeId), hasScore ? (v ? s.setsWon?.home : s.home) ?? 0 : '') + rowTeam(team(d.awayId), hasScore ? (v ? s.setsWon?.away : s.away) ?? 0 : '')}${v && st(f) === 'live' && !s.winner ? `<p class="hint">Set ${(s.sets?.length || 0) + 1} · ${e(s.home ?? 0)} – ${e(s.away ?? 0)}</p>` : ''}<div class="foot-line">${icon('clock')}${e(day(d.startTime))}${d.startTime ? ' · ' + e(day(d.startTime, fmtTime)) : ''}${d.venue ? ' ' + icon('pin') + e(d.venue) : ''}</div></a>`;
    }
    function pageHead(name, p) { return `<header class="page-head"><div><h1>${e(name)}</h1>${p ? `<p>${e(p)}</p>` : ''}</div></header>`; }
    function message() { return failed ? `<div role="status" class="notice">${loaded ? 'Live updates paused. Showing last available scores.' : 'Match centre could not load.'}<button class="seg" data-retry>Retry</button></div>` : ''; }

    function renderAnnouncements() {
      const list = state.siteMeta?.announcements || [];
      if (!list.length) return '';
      return `<section class="section">${sectionHead('Announcements')}<div class="announce-list">${list.map(a => `<div class="announce-card"><span class="announce-badge">Notice</span><div><strong>${e(a.title)}</strong>${a.body ? `<p>${e(a.body)}</p>` : ''}</div></div>`).join('')}</div></section>`;
    }

    function home() {
      let all = fixtures(), live = all.filter(f => st(f) === 'live'), next = all.filter(f => st(f) === 'scheduled');
      return `<section class="hero" aria-labelledby="home-title">
        <div class="hero-kicker">${e(state.branding?.college || 'Markaz Wafy Games Gala · 2026')}</div>
        <h1 id="home-title">Matchday<br><span>Central.</span></h1>
        <div class="hero-bottom">
          <div class="hero-actions"><a href="#fixtures" class="primary">${icon('fixtures')} Fixtures</a><a href="#live" class="secondary">${icon('live')} Live</a></div>
          ${loaded ? `<div class="stats"><div><strong>${state.teams.length}</strong><small>Teams</small></div><div><strong>${state.players.length}</strong><small>Players</small></div></div>` : ''}
        </div>
      </section>
      <section class="section">${sectionHead('Live now' + (live.length ? `<span class="badge-count">${live.length}</span>` : ''), 'Live centre', '#live')}<div class="fixture-list">${live.length ? live.slice(0, 3).map(fixtureCard).join('') : empty('live', 'No events live right now', 'Live scores appear here the moment a match kicks off.')}</div></section>
      ${renderAnnouncements()}
      <section class="section">${sectionHead('Up next', 'All fixtures', '#fixtures')}<div class="fixture-list">${next.length ? next.slice(0, 3).map(fixtureCard).join('') : empty('fixtures', 'Awaiting the schedule', 'Upcoming fixtures appear here when published.')}</div></section>
      <section class="section">${sectionHead('Competing teams', 'Leaderboard', '#leaderboard')}<div class="teams-grid">${state.teams.map(t => `<a class="team-tile" style="--team:${color(t.color)}" href="#team/${encodeURIComponent(t.id)}">${crest(t)}<span><b>${e(t.name)}</b><small class="team-caption">${state.players.filter(p => p.teamId === t.id).length} players</small></span></a>`).join('')}</div></section>`;
    }

    function options(name, opts) { return `<select class="tool-input" data-filter="${name}" aria-label="Filter by ${name}">${opts.map(([v, l]) => `<option value="${e(v)}" ${filters[name] === v ? 'selected' : ''}>${e(l)}</option>`).join('')}</select>`; }
    function segments(key, opts) { return `<div class="chip-row">${opts.map(([v, l]) => `<button class="seg ${filters[key] === v ? 'active' : ''}" data-set="${key}" data-value="${e(v)}" aria-pressed="${filters[key] === v}">${e(l)}</button>`).join('')}</div>`; }

    function fixtureList() {
      let all = fixtures(), types = [...new Set(all.map(f => f.details.sport))], dates = new Map(all.filter(f => f.details.startTime).map(f => [day(f.details.startTime, fmtKey), day(f.details.startTime)]));
      let list = all.filter(f => (filters.status === 'all' || st(f) === filters.status) && (filters.sport === 'all' || f.details.sport === filters.sport) && (filters.team === 'all' || groupTeam(f, filters.team)) && (filters.date === 'all' || day(f.details.startTime, fmtKey) === filters.date));
      let groups = new Map; for (let f of list) { let k = day(f.details.startTime); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(f); }
      return pageHead('Fixtures', 'Kickoff times (IST) and venues.') + `<div class="tools">${segments('status', [['all', 'All'], ['live', 'Live'], ['scheduled', 'Upcoming'], ['finished', 'Finished']])}${options('sport', [['all', 'All sports'], ...types.map(t => [t, standardName[t] || label(t)])])}${options('team', [['all', 'All teams'], ...state.teams.map(t => [t.id, t.name])])}${options('date', [['all', 'All dates'], ...dates])}</div>` + ([...groups].map(([k, arr]) => `<section class="group"><h2 class="day-title">${e(k)}</h2><div class="fixture-list">${arr.map(fixtureCard).join('')}</div></section>`).join('') || empty('fixtures', all.length ? 'No matching fixtures' : 'No fixtures published yet', all.length ? 'Choose another filter to see more events.' : 'Event times and venues will appear here once published.'));
    }

    function standings() {
      const groups = new Map, knockout = [];
      for (const f of fixtures().filter(f => !mode(f))) {
        const stage = (f.details.stage || '').trim();
        if (/knockout|eliminat|quarters?|semis?|final|play.?off|round of|third.?place|3rd.?place/i.test(stage)) { knockout.push(f); continue; }
        const key = JSON.stringify([f.details.sport, stage]); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(f);
      }
      const tables = [...groups.values()].map(fs => {
        const { sport, stage } = fs[0].details, football = sport === 'football', volley = sport === 'volleyball', rows = new Map;
        function side(id) { if (!rows.has(id)) rows.set(id, { id, played: 0, won: 0, drawn: 0, lost: 0, for: 0, against: 0, pts: 0, isLive: false }); return rows.get(id); }
        for (const f of fs) {
          const d = f.details; if (!team(d.homeId) || !team(d.awayId)) continue;
          const a = side(d.homeId), b = side(d.awayId);
          const matchSt = st(f);
          if (matchSt !== 'finished' && matchSt !== 'live') continue;
          if (matchSt === 'live') { a.isLive = true; b.isLive = true; }
          const s = score(f), x = Number(volley ? s.setsWon?.home : s.home) || 0, y = Number(volley ? s.setsWon?.away : s.away) || 0;
          a.played++; b.played++; a.for += x; b.against += x; b.for += y; a.against += y;
          if (x > y) { a.won++; b.lost++; a.pts += 3; } else if (y > x) { b.won++; a.lost++; b.pts += 3; } else { a.drawn++; b.drawn++; a.pts++; b.pts++; }
        }
        const rank = [...rows.values()].sort((a, b) => (football ? b.pts - a.pts : b.won - a.won) || (b.for - b.against) - (a.for - a.against) || b.for - a.for || String(team(a.id)?.name).localeCompare(team(b.id)?.name));
        const activeGames = fs.filter(f => st(f) === 'live' || st(f) === 'finished');
        return `<section class="group">${sectionHead(e(standardName[sport] || label(sport)) + (stage ? ' · ' + e(stage) : ''))}
          <div class="sport-table"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>${volley ? 'SD' : football ? 'GD' : 'Diff'}</th>${football ? '<th>Pts</th>' : ''}</tr></thead><tbody>${rank.map((r, i) => `<tr><td>${i + 1}</td><td><a class="stand-team" href="#team/${encodeURIComponent(r.id)}">${crest(team(r.id))}<span>${e(team(r.id)?.name)}</span>${r.isLive ? '<span class="live-pill-mini">LIVE</span>' : ''}</a></td><td>${r.played}</td><td>${r.won}</td><td>${r.drawn}</td><td>${r.lost}</td><td>${r.for - r.against}</td>${football ? `<td><b>${r.pts}</b></td>` : ''}</tr>`).join('')}</tbody></table></div>
          ${football ? '<p class="hint">Includes live &amp; full-time matches · Win 3 · Draw 1 · Loss 0</p>' : ''}
          ${activeGames.length ? `<div class="fixture-list" style="margin-top:10px">${activeGames.map(fixtureCard).join('')}</div>` : ''}
        </section>`;
      }).join('');
      return pageHead('Standings', 'Live & final group tables and knockout results.') + (tables + (knockout.length ? `<section class="group">${sectionHead('Knockout stage')}<div class="fixture-list">${knockout.map(fixtureCard).join('')}</div></section>` : '') || empty('standings', 'Waiting for the first fixtures', 'Sport tables will appear after team fixtures are scheduled.'));
    }

    function ledger() { return fixtures().filter(f => st(f) === 'finished').flatMap(f => (f.awards?.entries || []).map(a => ({ ...a, points: Number(a.points) || 0, event: f }))); }

    function leaderboard() {
      let isTeam = filters.leader === 'teams', awards = ledger(), points = id => awards.filter(a => (isTeam ? a.teamId : a.playerId) === id);
      let arr = (isTeam ? state.teams : state.players).map(p => ({ p, rows: points(p.id) })).map(r => ({ ...r, total: r.rows.reduce((n, a) => n + a.points, 0) })).sort((a, b) => b.total - a.total || a.p.name.localeCompare(b.p.name));
      let rank = 0;
      return pageHead('Leaderboard', 'Championship points from confirmed results.') + `<div class="tools">${segments('leader', [['teams', 'Teams'], ['players', 'Participants']])}</div><div class="rank-list">${arr.map((r, i) => { if (!i || r.total !== arr[i - 1].total) rank = i + 1; let t = isTeam ? r.p : team(r.p.teamId); return `<details class="rank-row" data-persist="${e(r.p.id)}"><summary><span class="rank-index">${rank}</span>${crest(t)}<span class="rank-name"><b>${e(r.p.name)}</b><small>${isTeam ? `${state.players.filter(x => x.teamId === r.p.id).length} players` : e(t?.name || 'Unassigned')}</small></span><span class="rank-points">${r.total}<small>PTS</small></span></summary><div class="award-list">${r.rows.length ? `<ul>${r.rows.map(a => `<li><a href="${fixtureLink(a.event)}">${e(title(a.event))}</a>${a.place ? ' · #' + e(a.place) : ''}${isTeam && a.playerId ? ' · ' + e(player(a.playerId)?.name) : ''} · <b>${a.points} pts</b></li>`).join('')}</ul>` : 'No championship points awarded yet.'}</div></details>`; }).join('')}</div>`;
    }

    function teamPage(id) {
      let t = team(id); if (!t) return empty('people', 'Team unavailable', 'Open Home to choose a competing team.');
      let members = state.players.filter(p => p.teamId === id), fs = fixtures().filter(f => groupTeam(f, id));
      return `<a class="link-btn" href="#home">← Back to home</a>` + pageHead(t.name, `${members.length} registered players`) +
        `<section>${sectionHead('Squad Roster')}<div class="teams-grid">${members.length ? members.map((p, idx) => `<div class="team-tile" style="--team:${color(t.color)}"><span class="crest" style="--team:${color(t.color)}">${idx + 1}</span><span><b>${e(p.name)}</b><small class="team-caption">${e(t.name)}</small></span></div>`).join('') : empty('people', 'No players listed', 'Players for this team will appear here.')}</div></section>` +
        `<section class="section">${sectionHead('Team Fixtures')}<div class="fixture-list">${fs.map(fixtureCard).join('') || empty('fixtures', 'No team fixtures yet', 'Published events for this team will appear here.')}</div></section>`;
    }

    function interactivePitch(d, s) {
      const side = filters.pitchSide === 'away' ? 'away' : 'home';
      const isHome = side === 'home';
      const t = team(isHome ? d.homeId : d.awayId);
      const form = String((isHome ? d.formationHome : d.formationAway) || '').trim();
      const rawPos = (isHome ? d.positionsHome : d.positionsAway) || [];
      const legacyLine = (isHome ? d.lineupHome : d.lineupAway) || [];
      const positions = rawPos.length ? rawPos : (legacyLine.length || form ? generatePositions(form, legacyLine.map(id => ({ playerId: id }))) : []);
      const subs = (isHome ? d.subsHome : d.subsAway) || [];
      if (!positions.length && !subs.length) return '';

      const activeIds = s.activeLineups?.[side] || [];
      const subEvents = (s.timeline || []).filter(ev => ev.kind === 'sub' && ev.side === side);
      const cardEvents = (s.timeline || []).filter(ev => (ev.kind === 'yellow' || ev.kind === 'red') && ev.side === side);
      const goalEvents = (s.timeline || []).filter(ev => ev.kind === 'goal' && ev.side === side);

      const resolvedNodes = positions.map((pos, idx) => {
        let pid = pos.playerId;
        const subOut = subEvents.find(ev => ev.playerId === pid);
        if (subOut && subOut.otherPlayerId) pid = subOut.otherPlayerId;
        const pObj = player(pid);
        const goals = goalEvents.filter(ev => ev.playerId === pid).length;
        const yellows = cardEvents.filter(ev => ev.playerId === pid && ev.kind === 'yellow').length;
        const reds = cardEvents.filter(ev => ev.playerId === pid && ev.kind === 'red').length;
        return { ...pos, idx: idx + 1, pid, name: pObj?.name || 'Player ' + (idx + 1), goals, yellows, reds, wasSubbedIn: Boolean(subOut) };
      });

      const sel = resolvedNodes.find(n => n.pid && n.pid === filters.selectedPlayer);

      return `<h2 class="subhead">Interactive Lineup &amp; Pitch</h2>
        <div class="pitch-tabs">
          <button type="button" class="pitch-tab ${isHome ? 'active' : ''}" data-set="pitchSide" data-value="home">${e(team(d.homeId)?.name || 'Home')} ${d.formationHome ? '(' + e(d.formationHome) + ')' : ''}</button>
          <button type="button" class="pitch-tab ${!isHome ? 'active' : ''}" data-set="pitchSide" data-value="away">${e(team(d.awayId)?.name || 'Away')} ${d.formationAway ? '(' + e(d.formationAway) + ')' : ''}</button>
        </div>
        <div class="pitch-stage" style="--team:${color(t?.color)}">
          ${resolvedNodes.map(n => `<button type="button" class="pitch-node ${n.pid && n.pid === filters.selectedPlayer ? 'selected' : ''}" style="left:${n.x}%;top:${n.y}%" data-select-player="${e(n.pid)}">
            <span class="pitch-dot">${n.idx}</span>
            <span class="pitch-label">${e(n.name.split(' ')[0])}${n.goals ? ' ⚽' : ''}${n.reds ? ' 🟥' : n.yellows ? ' 🟨' : ''}</span>
          </button>`).join('')}
        </div>
        ${sel ? `<div class="player-spotlight"><div><strong>${e(sel.name)}</strong><div class="hint">${e(t?.name || '')}${sel.wasSubbedIn ? ' · Subbed on' : ' · Starter'}</div></div><div>${sel.goals ? '⚽ ×' + sel.goals + ' ' : ''}${sel.yellows ? '🟨 ' : ''}${sel.reds ? '🟥 ' : ''}</div></div>` : '<p class="hint">Tap any player on the pitch to inspect stats.</p>'}
        ${subs.length ? `<h3 class="subhead" style="font-size:17px">Substitutes Bench</h3><div class="subs-grid">${subs.map(sid => {
          const used = subEvents.some(ev => ev.otherPlayerId === sid);
          return `<span class="sub-chip ${used ? 'subbed' : ''}">${e(player(sid)?.name || 'Sub')}${used ? ' (On pitch)' : ''}</span>`;
        }).join('')}</div>` : ''}`;
    }

    function matchPage(f) {
      if (!f) return empty('field', 'Event unavailable', 'This event may have been removed.');
      let d = f.details, s = score(f), v = d.sport === 'volleyball', h = team(d.homeId), a = team(d.awayId), isIndividual = mode(f), isScheduled = st(f) === 'scheduled';
      let pitchHtml = d.sport === 'football' ? interactivePitch(d, s) : '';
      let sets = s.sets || [];
      /* Public timeline ONLY shows Goals and Cards (filters out admin edits/corrections/timer actions) */
      let publicTl = [...(s.timeline || [])].filter(x => ['goal', 'yellow', 'red'].includes(x.kind)).reverse();
      const clk = st(f) === 'live' ? formatClock(computeClock(s.timeline, 'live')) : null;

      return `<a class="link-btn" href="#fixtures">← All fixtures</a>` +
        pageHead(title(f), [sportName(f), d.stage, day(d.startTime), d.startTime ? day(d.startTime, fmtTime) + ' IST' : '', d.venue].filter(Boolean).join(' · ')) +
        `<article class="live-article">
          <div class="info-line">${status(f)}<span class="status-msg">${e(isScheduled ? '' : s.period || '')}</span></div>
          ${!isIndividual ? `<div class="match-score">
            <a class="match-side" href="#team/${encodeURIComponent(d.homeId || '')}">${crest(h)}<span>${e(h?.name || 'TBC')}</span></a>
            <strong>${isScheduled ? 'VS' : `${e(v ? s.setsWon?.home ?? 0 : s.home ?? 0)} – ${e(v ? s.setsWon?.away ?? 0 : s.away ?? 0)}`}${v && !isScheduled ? '<small>Sets won</small>' : ''}${clk ? `<small class="match-clock-banner" data-live-clock="${e(f.id)}">${clk.text}</small>` : ''}</strong>
            <a class="match-side" href="#team/${encodeURIComponent(d.awayId || '')}">${crest(a)}<span>${e(a?.name || 'TBC')}</span></a>
          </div>` : ''}
          ${isIndividual ? `<h2 class="subhead">${d.sport === 'crossbar' ? 'Attempts' : 'Participants'}</h2>${[...ids(f)].sort((x, y) => (s.attempts?.[y]?.hits || 0) - (s.attempts?.[x]?.hits || 0)).map(id => `<div class="attempt-row">${crest(team(player(id)?.teamId))}<span>${e(player(id)?.name || 'Participant')}</span><strong>${d.sport === 'crossbar' ? `${e(s.attempts?.[id]?.hits ?? 0)} / ${e(s.attempts?.[id]?.total ?? 0)} hits` : e(s.results?.[id] ?? '—')}</strong></div>`).join('') || '<p class="hint">Entrants will appear here.</p>'}` : ''}
          ${v ? `<h2 class="subhead">Sets</h2><p class="hint">Best of ${e(d.bestOf || 3)} · ${e(d.pointLimit || 25)} points per set${d.decidingLimit ? ' · Decider to ' + e(d.decidingLimit) : ''}</p>${sets.map((x, i) => `<div class="set-row">Set ${i + 1}<strong>${e(x.home)} – ${e(x.away)}</strong></div>`).join('')}${st(f) === 'live' && !s.winner ? `<div class="set-row">Current set<strong>${e(s.home ?? 0)} – ${e(s.away ?? 0)}</strong></div>` : ''}` : ''}
          ${pitchHtml}
          <h2 class="subhead">Goals &amp; Cards</h2>
          ${publicTl.length ? `<ol class="timeline">${publicTl.map(x => `<li><time>${x.minute != null && x.minute !== '' ? e(x.minute) + '′' : '•'}</time><span>${/yellow|red/i.test(x.kind) ? '<i class="card-mark ' + (/red/i.test(x.kind) ? 'red' : 'yellow') + '" aria-hidden="true"></i>' : '⚽ '}${e(label(x.kind))}${x.side && team(x.side === 'home' ? d.homeId : d.awayId) ? ' · ' + e(team(x.side === 'home' ? d.homeId : d.awayId).name) : ''}${x.playerId && player(x.playerId) ? ' · <b>' + e(player(x.playerId).name) + '</b>' : ''}</span></li>`).join('')}</ol>` : '<p class="hint">No goals or cards recorded yet.</p>'}
          ${st(f) === 'finished' && f.awards?.entries?.length ? `<h2 class="subhead">Championship awards</h2>${f.awards.entries.map(x => `<div class="attempt-row"><span>${e(team(x.teamId)?.name || 'Team')}${x.playerId ? ' · ' + e(player(x.playerId)?.name) : ''}</span><strong>${e(x.points)} pts</strong></div>`).join('')}` : ''}
        </article>`;
    }

    function livePage() {
      let fs = fixtures().filter(f => st(f) === 'live');
      return pageHead('Live centre', fs.length ? `${fs.length} ${fs.length === 1 ? 'event' : 'events'} in progress` : 'Follow live scores and match action.') + (fs.length === 1 ? matchPage(fs[0]).replace(/^.*?<article/s, '<article').replace('<div class="info-line">', `<h2 class="subhead">${e(title(fs[0]))}</h2><p class="hint">${e(fs[0].details.venue)}</p><div class="info-line">`) : fs.length ? `<div class="fixture-list">${fs.map(fixtureCard).join('')}</div>` : empty('live', 'No events live right now', 'Open Fixtures for the latest schedule.'));
    }

    function renderDrawerInfo() {
      const box = document.getElementById('drawer-info-blocks');
      if (!box) return;
      const meta = state.siteMeta || {};
      const anns = meta.announcements || [];
      const comm = meta.committee || [];
      box.innerHTML = `
        ${anns.length ? `<div class="drawer-card"><h4>Announcements</h4><ul>${anns.map(a => `<li><strong>${e(a.title)}</strong>${e(a.body || '')}</li>`).join('')}</ul></div>` : ''}
        ${comm.length ? `<div class="drawer-card"><h4>Sports Committee</h4><ul>${comm.map(c => `<li><strong>${e(c.name)}</strong>${e(c.role || '')}</li>`).join('')}</ul></div>` : ''}
        ${meta.contact ? `<div class="drawer-card"><h4>Contact</h4><p>${e(meta.contact)}</p></div>` : ''}
      `;
    }

    function route() {
      let parts = location.hash.slice(1).split('/');
      return { tab: parts[0] || 'home', id: parts[1] ? decodeURIComponent(parts[1]) : '' };
    }

    function renderPublic() {
      let { tab, id } = route();
      let panel = ({ home, fixtures: fixtureList, standings, leaderboard, live: livePage, match: () => matchPage(state.fixtures.find(f => f.id === id)), team: () => teamPage(id) })[tab] || home;
      let active = tab === 'team' ? 'home' : tab === 'match' ? (st(state.fixtures.find(f => f.id === id) || {}) === 'live' ? 'live' : 'fixtures') : tab;
      nav.innerHTML = views.map(v => `<a href="#${v}" ${v === active ? 'aria-current="page"' : ''}>${icon(v)}<span>${label(v)}</span></a>`).join('');
      const open = new Set([...main.querySelectorAll('details[open]')].map(el => el.dataset.persist));
      main.innerHTML = message() + (loaded ? panel() : (tab === 'home' ? home().split('<section class="section">')[0] : '') + (failed ? '' : `<div class="loading" role="status">Loading match centre…</div>`));
      for (let el of main.querySelectorAll('details')) if (open.has(el.dataset.persist)) el.open = true;
      renderDrawerInfo();
      if (lastHash !== location.hash) { window.scrollTo(0, 0); lastHash = location.hash; }
      document.title = `${label(views.includes(tab) ? tab : tab === 'match' ? 'Event details' : 'Team')} · Level Up ’26`;
    }

    /* Tick all visible live match clocks smoothly every second */
    setInterval(() => {
      if (document.hidden || route().tab === 'admin') return;
      document.querySelectorAll('[data-live-clock]').forEach(el => {
        const fid = el.getAttribute('data-live-clock');
        const f = state.fixtures.find(x => x.id === fid);
        if (f && st(f) === 'live') {
          el.textContent = formatClock(computeClock(score(f).timeline, 'live')).text;
        }
      });
    }, 1000);

    async function refreshPublic() {
      if (refreshing || route().tab === 'admin') return;
      refreshing = true;
      try {
        const next = await snapshot();
        if (!Array.isArray(next?.teams) || !Array.isArray(next?.fixtures)) throw Error('Invalid snapshot');
        let sig = JSON.stringify([next.teams, next.players, next.fixtures, next.branding, next.siteMeta]);
        let changed = sig !== priorSignature || failed;
        Object.assign(state, next);
        loaded = true; failed = false; priorSignature = sig;
        let logo = next.branding?.logo || './assets/event-logo.png';
        let el = document.getElementById('brand-icon');
        if (!el.querySelector('img') && el.dataset.failed !== logo) {
          let img = new Image(); img.alt = '';
          img.onload = () => { el.classList.add('photo'); el.replaceChildren(img); };
          img.onerror = () => { el.dataset.failed = logo; el.classList.remove('photo'); };
          img.src = logo;
        }
        if (changed) renderPublic();
      } catch {
        if (!failed) { failed = true; renderPublic(); }
      } finally { refreshing = false; }
    }

    /* ================= 5. ADMIN CONTROL ROOM UI ================= */
    const app = document.querySelector('#app'), account = document.querySelector('#account'), notice = document.querySelector('#notice');
    const permissions = { schedule: 'Schedule and lineups', score: 'Live scoring', awards: 'Championship awards', delete: 'Delete fixtures' };
    const sports = { football: 'Football', volleyball: 'Volleyball', crossbar: 'Crossbar challenge', custom: 'Custom event' };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let adminData, view = 'fixtures', activeId = '', authMode = 'login', busy = false;
    let designerState = { Home: { formation: '4-3-3', positions: [], selectedIdx: 0 }, Away: { formation: '4-3-3', positions: [], selectedIdx: 0 } };

    const current = () => adminData.fixtures.find(f => f.id === activeId);
    const allowed = (p, f) => adminData.role === 'admin' || (adminData.permissions.includes(p) && (!adminData.assigned.length || (f && adminData.assigned.includes(f.id))));
    const teamName = id => adminData.teams.find(t => t.id === id)?.name || 'Unassigned';

    function statusMsg(text = '', error = false) { notice.textContent = text; notice.className = error ? 'error' : ''; }
    async function reloadAdmin() { adminData = await snapshot(); app.removeAttribute('aria-busy'); renderAdmin(); }
    function admBtn(text, action, cls = '') { return '<button type="button" class="' + cls + '" data-action="' + action + '">' + esc(text) + '</button>'; }
    function admOpts(items, val, empty = '') { return (empty ? '<option value="">' + esc(empty) + '</option>' : '') + items.map(([k, n]) => '<option value="' + esc(k) + '" ' + (String(val) === String(k) ? 'selected' : '') + '>' + esc(n) + '</option>').join(''); }
    function admField(label, html) { return '<label class="field">' + esc(label) + html + '</label>'; }
    function admInput(name, val, type = 'text', attrs = '') { return '<input name="' + name + '" type="' + type + '" value="' + esc(val) + '" ' + attrs + '>'; }
    function admSelect(name, opts, attrs = '') { return '<select name="' + name + '" ' + attrs + '>' + opts + '</select>'; }
    function admCheckbox(name, value, label, checked) { return '<label class="check"><input type="checkbox" name="' + name + '" value="' + esc(value) + '" ' + (checked ? 'checked' : '') + '>' + esc(label) + '</label>'; }
    function navigateAdmin(v, id = '') { view = v; activeId = id; statusMsg(); renderAdmin(); window.scrollTo(0, 0); }

    async function runAdmin(task) {
      if (busy) return;
      busy = true; app.inert = true; account.inert = true; statusMsg();
      try { await task(); } catch (err) { statusMsg(err.message || 'Unable to complete this action.', true); }
      finally { app.inert = false; account.inert = false; busy = false; }
    }

    function renderAdmin() {
      account.innerHTML = '';
      if (adminData.role !== 'admin' && adminData.role !== 'manager') { authAdmin(); return; }
      account.innerHTML = '<div class="account"><span class="pill">' + (adminData.role === 'admin' ? 'Main administrator' : 'Event manager') + '</span>' + admBtn('Sign out', 'logout') + '</div>';
      if (view === 'new' || view === 'details') { fixtureForm(); return; }
      if (view === 'access') { accessAdmin(); return; }
      if (view === 'siteMeta') { siteMetaAdmin(); return; }
      if (view === 'score' || view === 'awards') { if (!current()) { view = 'fixtures'; renderAdmin(); return; } editorAdmin(); return; }
      listingAdmin();
    }

    function authAdmin() {
      let reg = authMode === 'register';
      app.innerHTML = '<section class="panel login"><h2>' + (reg ? 'Manager registration' : 'Staff sign in') + '</h2><p class="hint">' + (reg ? 'Use the email address authorised by the main administrator.' : 'Sign in with your administrator or manager account.') + '</p><form id="auth"><div class="fields"><div class="full">' + admField('Email address', admInput('email', '', 'email', 'autocomplete="username" required')) + '</div><div class="full">' + admField('Password', admInput('password', '', 'password', 'autocomplete="' + (reg ? 'new-password' : 'current-password') + '" required')) + '</div></div><div class="actions"><button class="primary">' + (reg ? 'Register' : 'Sign in') + '</button>' + admBtn(reg ? 'Back to sign in' : 'Register as a manager', 'toggleAuth') + '</div></form></section>';
    }

    function listingAdmin() {
      let fixtures = [...adminData.fixtures].filter(f => adminData.role === 'admin' || !adminData.assigned.length || adminData.assigned.includes(f.id)).sort((a, b) => (a.details.startTime || '').localeCompare(b.details.startTime || ''));
      app.innerHTML = '<section class="panel"><div class="bar"><h2>Fixtures & events</h2><div class="actions">' +
        (allowed('schedule') ? admBtn('+ Add fixture', 'new', 'accent') : '') +
        (adminData.role === 'admin' ? admBtn('Site info & notices', 'siteMeta') + admBtn('Managers', 'access') : '') +
        admBtn('Refresh', 'refresh') +
        '</div></div>' + (fixtures.length ? fixtures.map(f => {
          let d = f.details, s = f.score.status || 'scheduled';
