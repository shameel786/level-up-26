  <script type="module">
    /* 1. SUPABASE BACKEND */
    const base = 'https://jkelyomdaylljxnvhuhi.supabase.co';
    const key = 'sb_publishable_nM0-WI_TOSBJsr5N4MaT9Q_6Ju3JEVO';
    const sessionKey = 'levelup.gala.session';
    const META_ID = '00000000-0000-0000-0000-000000000026';
    let renewing, generation = 0;

    function readSession() { try { return JSON.parse(sessionStorage.getItem(sessionKey)); } catch { return null; } }
    function writeSession(data) {
      if (!data?.access_token) return false;
      sessionStorage.setItem(sessionKey, JSON.stringify({ access_token: data.access_token, refresh_token: data.refresh_token, expires: Date.now() + data.expires_in * 1000 }));
      return true;
    }

    async function request(path, body, token) {
      const headers = { apikey: key, 'Content-Type': 'application/json' };
      if (token) headers.Authorization = 'Bearer ' + token;
      const response = await fetch(base + path, { method: 'POST', headers, body: JSON.stringify(body), cache: 'no-store' });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error(data?.message || data?.msg || data?.error_description || 'The request failed. Please try again.');
        error.status = response.status;
        throw error;
      }
      return data;
    }

    async function accessToken() {
      const session = readSession();
      if (!session) return undefined;
      if (session.expires > Date.now() + 60000) return session.access_token;
      if (!renewing) {
        const start = generation;
        renewing = request('/auth/v1/token?grant_type=refresh_token', { refresh_token: session.refresh_token })
          .then(data => { if (generation !== start) return readSession()?.access_token; writeSession(data); return data.access_token; })
          .catch(error => { if (generation === start && [400, 401, 403].includes(error.status)) { sessionStorage.removeItem(sessionKey); throw new Error('Your session expired. Please sign in again.'); } throw error; })
          .finally(() => { renewing = undefined; });
      }
      return renewing;
    }

    async function rpc(name, args) { return request('/rest/v1/rpc/gala_' + name, args, await accessToken()); }

    function logoUrl(path) {
      if (!path || typeof path !== 'string') return '';
      const raw = path.trim();
      if (!raw) return '';
      if (/^data:image\//i.test(raw)) return raw;
      if (/^https?:\/\//i.test(raw)) {
        try {
          const u = new URL(raw);
          if (u.pathname.startsWith('/api/photo/')) {
            return 'https://campus-auction-arena.vercel.app' + u.pathname + u.search;
          }
          return raw;
        } catch {
          return raw;
        }
      }
      if (raw.startsWith('/')) {
        return 'https://campus-auction-arena.vercel.app' + raw;
      }
      if (/^api\/photo\//i.test(raw)) {
        return 'https://campus-auction-arena.vercel.app/' + raw;
      }
      if (/^assets\//i.test(raw) || /^\.\/assets\//i.test(raw)) {
        return raw.startsWith('./') ? raw : './' + raw;
      }
      return 'https://jkelyomdaylljxnvhuhi.supabase.co/storage/v1/object/public/' + raw.replace(/^\/+/, '');
    }

    async function snapshot() {
      const result = await rpc('snapshot', {});
      const metaRec = (result.fixtures || []).find(f => f.id === META_ID || f.details?.isSiteMeta);
      const rawMeta = metaRec?.details?.siteMeta || {};

      const customBrand = rawMeta.eventBranding || {};
      result.branding = {
        ...(result.branding || {}),
        name: customBrand.name !== undefined && customBrand.name !== '' ? customBrand.name : (result.branding?.name || 'LEVEL UP ’26'),
        subtitle: customBrand.subtitle !== undefined && customBrand.subtitle !== '' ? customBrand.subtitle : (result.branding?.subtitle || 'Sports & games gala'),
        college: customBrand.college !== undefined && customBrand.college !== '' ? customBrand.college : (result.branding?.college || 'Markaz Wafy Games Gala · 2026'),
        logo: logoUrl(customBrand.logo || result.branding?.logo || result.branding?.image || '')
      };

      const teamOverrides = rawMeta.teamOverrides || {};
      const deletedTeamIds = new Set(rawMeta.deletedTeamIds || []);
      const baseTeams = (result.teams || []).filter(t => !deletedTeamIds.has(t.id)).map(t => {
        const ov = teamOverrides[t.id] || {};
        return {
          ...t,
          name: ov.name || t.name,
          color: ov.color || t.color,
          logo: logoUrl(ov.logo !== undefined ? ov.logo : (t.logo || t.image || t.logo_url || t.avatar || ''))
        };
      });
      const addedTeams = (rawMeta.addedTeams || []).filter(t => !deletedTeamIds.has(t.id)).map(t => ({
        ...t,
        logo: logoUrl(t.logo || '')
      }));
      result.teams = [...baseTeams, ...addedTeams];

      const playerOverrides = rawMeta.playerOverrides || {};
      const deletedPlayerIds = new Set(rawMeta.deletedPlayerIds || []);
      const basePlayers = (result.players || []).filter(p => !deletedPlayerIds.has(p.id) && !deletedTeamIds.has(p.teamId)).map(p => {
        const ov = playerOverrides[p.id] || {};
        return {
          ...p,
          name: ov.name || p.name,
          teamId: ov.teamId || p.teamId
        };
      });
      const addedPlayers = (rawMeta.addedPlayers || []).filter(p => !deletedPlayerIds.has(p.id) && !deletedTeamIds.has(p.teamId));
      result.players = [...basePlayers, ...addedPlayers];

      const contacts = Array.isArray(rawMeta.contacts)
        ? rawMeta.contacts
        : (typeof rawMeta.contact === 'string' && rawMeta.contact.trim()
            ? [{ name: 'Gala Control Desk', role: 'Match Helpdesk', phone: rawMeta.contact.trim() }]
            : [{ name: 'Gala Control Desk', role: 'General Convenor', phone: '+91 98765 43210' }]);

      result.siteMeta = {
        announcements: Array.isArray(rawMeta.announcements) ? rawMeta.announcements : [{ title: 'Welcome to Level Up ’26', body: 'Follow live match updates, results and championship points right here.' }],
        committee: Array.isArray(rawMeta.committee) ? rawMeta.committee : [{ role: 'General Convenor', name: 'Sports Committee · Level Up ’26' }, { role: 'Match Control', name: 'Gala Technical Desk' }],
        contacts,
        fixtureOrder: Array.isArray(rawMeta.fixtureOrder) ? rawMeta.fixtureOrder : [],
        publishedResults: Array.isArray(rawMeta.publishedResults) ? rawMeta.publishedResults : [],
        eventBranding: customBrand,
        teamOverrides,
        addedTeams,
        deletedTeamIds: [...deletedTeamIds],
        playerOverrides,
        addedPlayers,
        deletedPlayerIds: [...deletedPlayerIds]
      };
      result.metaRecord = metaRec || null;
      result.fixtures = (result.fixtures || []).filter(f => f.id !== META_ID && !f.details?.isSiteMeta);
      return result;
    }

    async function saveSiteMeta(nextSiteMeta) {
      const ver = adminData.metaRecord?.version || 0;
      await save(META_ID, ver, 'details', {
        isSiteMeta: true,
        name: 'System Site Info',
        venue: 'Control Desk',
        sport: 'custom',
        format: 'team',
        startTime: '2099-01-01T00:00:00.000Z',
        siteMeta: nextSiteMeta
      });
    }

    function fileToCompressedDataUrl(file, maxDim = 256) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve('');
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read image file.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Invalid image file.'));
          img.onload = () => {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/webp', 0.86));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function save(id, version, section, value = {}) { return rpc('save', { p_id: id, p_version: version, p_section: section, p_value: value }); }
    function manager(email, permissions, assigned, remove = false) { return rpc('manager', { p_email: email, p_permissions: permissions, p_assigned: assigned, p_remove: remove }); }
    async function login(email, password) { const data = await request('/auth/v1/token?grant_type=password', { email: email.trim(), password }); generation++; writeSession(data); }
    async function register(email, password) { const data = await request('/auth/v1/signup', { email: email.trim(), password }); generation++; const signedIn = writeSession(data); return { signedIn, confirmationRequired: !signedIn }; }
    async function logout() { const token = readSession()?.access_token; generation++; sessionStorage.removeItem(sessionKey); if (token) await request('/auth/v1/logout?scope=local', {}, token).catch(() => {}); }

    /* Custom Fixture Ordering Helper */
    function sortFixturesByOrder(list = [], orderIds = []) {
      const rank = new Map((orderIds || []).map((id, idx) => [id, idx]));
      return [...list].sort((a, b) => {
        const ra = rank.has(a.id) ? rank.get(a.id) : 999999;
        const rb = rank.has(b.id) ? rank.get(b.id) : 999999;
        if (ra !== rb) return ra - rb;
        return String(a.details?.startTime || '9999').localeCompare(String(b.details?.startTime || '9999'));
      });
    }

    /* 2. STOPWATCH, RUBIK'S CUBE, EATING CONTEST, PUSH-UP CHALLENGE, ARM WRESTLING & SCORING */
    const sides = ['home', 'away'], sideKey = s => s === 'home' ? 'Home' : 'Away', opponent = s => s === 'home' ? 'away' : 'home';
    const integer = (v, min = 0) => Number.isSafeInteger(v) && v >= min;
    const check = (c, m) => { if (!c) throw new Error(m); };
    const number = (v, fb) => integer(Number(v), 1) ? Number(v) : fb;
    const isSetSport = sport => sport === 'volleyball' || sport === 'badminton';
    const isRepSport = sport => sport === 'eating' || sport === 'pushup';
    const isContestSport = sport => sport === 'rubiks' || isRepSport(sport);

    function formatEatAmount(amount, unit = 'items', dnf = false) {
      if (dnf) return 'DNF';
      const num = Number(amount);
      if (!Number.isFinite(num) || num < 0) return '—';
      const cleanNum = Number.isInteger(num) ? String(num) : num.toFixed(2).replace(/\.?0+$/, '');
      return `${cleanNum} ${unit || 'items'}`.trim();
    }

    function formatDurationMs(ms) {
      if (ms === 'DNF' || ms === -1) return 'DNF';
      const num = Number(ms);
      if (!Number.isFinite(num) || num < 0) return '—';
      const totalCentis = Math.round(num / 10);
      const mins = Math.floor(totalCentis / 6000);
      const secs = Math.floor((totalCentis % 6000) / 100);
      const centis = totalCentis % 100;
      const secPart = String(secs).padStart(2, '0') + '.' + String(centis).padStart(2, '0');
      return mins > 0 ? `${mins}:${secPart}` : `${secPart}s`;
    }

    function computeClock(history = [], status = 'scheduled') {
      let accMs = 0, runningSince = null, stateLabel = 'stopped', extraMins = 0;
      for (const e of history) {
        if (e.kind === 'start') { if (runningSince === null) runningSince = Date.parse(e.at); stateLabel = 'running'; }
        else if (e.kind === 'timer_start') { if (typeof e.baseSec === 'number') accMs = e.baseSec * 1000; runningSince = Date.parse(e.at); stateLabel = 'running'; }
        else if (e.kind === 'timer_pause') { if (runningSince !== null) { accMs += Math.max(0, Date.parse(e.at) - runningSince); runningSince = null; } if (typeof e.baseSec === 'number') accMs = e.baseSec * 1000; stateLabel = 'paused'; }
        else if (e.kind === 'timer_stop' || e.kind === 'finish') { if (runningSince !== null) { accMs += Math.max(0, Date.parse(e.at) - runningSince); runningSince = null; } if (typeof e.baseSec === 'number') accMs = e.baseSec * 1000; stateLabel = 'stopped'; }
        else if (e.kind === 'timer_set') { accMs = (Number(e.baseSec) || 0) * 1000; if (runningSince !== null) runningSince = Date.parse(e.at); }
        else if (e.kind === 'extra_time') { extraMins = Math.max(0, Number(e.extraMins) || 0); }
        else if (e.kind === 'period' && e.period === 'Half time') { if (runningSince !== null) { accMs += Math.max(0, Date.parse(e.at) - runningSince); runningSince = null; } stateLabel = 'stopped'; }
      }
      if (status === 'finished') { runningSince = null; stateLabel = 'stopped'; }
      return { accMs, runningSince, stateLabel, extraMins };
    }

    function formatClock(clock, now = Date.now()) {
      const extra = clock.runningSince ? Math.max(0, now - clock.runningSince) : 0;
      const totalMs = clock.accMs + extra;
      const totalSec = Math.floor(totalMs / 1000);
      const mins = Math.floor(totalSec / 60), secs = totalSec % 60;
      return { totalMs, mins, secs, text: String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0'), running: Boolean(clock.runningSince), stateLabel: clock.stateLabel, extraMins: clock.extraMins || 0 };
    }

    function setRules(details) {
      const isBadminton = details.sport === 'badminton';
      const bestOf = number(details.bestOf, 3);
      return {
        toWin: Math.floor(bestOf / 2) + 1,
        target: number(details.pointLimit, isBadminton ? 21 : 25),
        deciding: number(details.decidingLimit, isBadminton ? 21 : 15),
        cap: isBadminton ? number(details.pointCap, 30) : 999,
        margin: details.winByTwo === false ? 1 : 2
      };
    }

    function settleSet(score, rules) {
      const deciding = sides.every(side => score.setsWon[side] === rules.toWin - 1);
      const target = deciding ? rules.deciding : rules.target;
      const lead = score.home > score.away ? 'home' : 'away';
      const hitCap = rules.cap && score[lead] >= rules.cap;
      if (!hitCap && (score[lead] < target || score[lead] - score[opponent(lead)] < rules.margin)) return;
      score.sets.push({ home: score.home, away: score.away });
      score.setsWon[lead]++;
      score.timeouts = { home: 0, away: 0 };
      if (score.setsWon[lead] >= rules.toWin) score.winner = lead;
      else { score.home = 0; score.away = 0; score.period = 'Set ' + (score.sets.length + 1); }
    }

    function defaultArmBoxes(details = {}) {
      const saved = Array.isArray(details.initialArmBoxes) ? details.initialArmBoxes : [];
      return [0, 1, 2, 3].map(idx => ({
        id: saved[idx]?.id || `qf-${idx + 1}`,
        stage: 'QF',
        label: `Match ${idx + 1}`,
        p1Id: saved[idx]?.p1Id || '',
        p2Id: saved[idx]?.p2Id || '',
        winnerSlot: null
      }));
    }

    function replay(details, history = []) {
      const initHome = (details.positionsHome?.length ? details.positionsHome.map(p => p.playerId) : details.lineupHome) || [];
      const initAway = (details.positionsAway?.length ? details.positionsAway.map(p => p.playerId) : details.lineupAway) || [];
      const score = {
        status: 'scheduled',
        home: 0,
        away: 0,
        period: '',
        server: details.initialServer || 'home',
        sets: [],
        setsWon: { home: 0, away: 0 },
        timeouts: { home: 0, away: 0 },
        attempts: {},
        results: {},
        solveTimes: {},
        eatAmounts: {},
        extraContestants: [],
        armBoxes: details.sport === 'armwrestling' ? defaultArmBoxes(details) : [],
        bouts: [],
        winner: null,
        activeLineups: { home: [...initHome], away: [...initAway] },
        timeline: history
      };
      for (const e of history) {
        switch (e.kind) {
          case 'start':
            score.status = 'live';
            score.period = e.period || '';
            if (e.server) score.server = e.server;
            break;
          case 'finish':
            score.status = 'finished';
            if (!score.winner && details.format !== 'individual' && score.home !== score.away && !isSetSport(details.sport)) {
              score.winner = score.home > score.away ? 'home' : 'away';
            }
            break;
          case 'period': score.period = e.period; break;
          case 'server': score.server = e.side; break;
          case 'goal': case 'point': score[e.side]++; break;
          case 'yellow': case 'red':
            if (e.kind === 'red') {
              score.activeLineups[e.side] = score.activeLineups[e.side].filter(id => id !== e.playerId);
              if (isSetSport(details.sport) && !score.winner) {
                score[opponent(e.side)]++;
                score.server = opponent(e.side);
                settleSet(score, e.rules || setRules(details));
              }
            }
            break;
          case 'sub': score.activeLineups[e.side] = score.activeLineups[e.side].map(id => id === e.playerId ? e.otherPlayerId : id); break;
          case 'timeout': score.timeouts[e.side] = (score.timeouts[e.side] || 0) + 1; break;
          case 'rally':
            score[e.side]++;
            score.server = e.side;
            settleSet(score, e.rules);
            break;
          case 'rubiks_contestant_add': {
            if (e.playerId && !score.extraContestants.includes(e.playerId)) {
              score.extraContestants.push(e.playerId);
            }
            break;
          }
          case 'eat_amount': {
            if (e.playerId) {
              if (e.clear) {
                delete score.eatAmounts[e.playerId];
              } else {
                score.eatAmounts[e.playerId] = {
                  playerId: e.playerId,
                  teamId: e.teamId || '',
                  amount: e.dnf ? -1 : Number(e.amount),
                  dnf: Boolean(e.dnf)
                };
              }
            }
            break;
          }
          case 'solve_time': {
            if (e.playerId) {
              if (e.clear) {
                delete score.solveTimes[e.playerId];
              } else {
                score.solveTimes[e.playerId] = {
                  playerId: e.playerId,
                  teamId: e.teamId || '',
                  ms: e.dnf ? -1 : Number(e.ms),
                  dnf: Boolean(e.dnf)
                };
              }
            }
            break;
          }
          case 'arm_box_set': {
            const box = score.armBoxes.find(b => b.id === e.boxId);
            if (box && !box.winnerSlot) {
              if (e.p1Id !== undefined) box.p1Id = e.p1Id;
              if (e.p2Id !== undefined) box.p2Id = e.p2Id;
            }
            break;
          }
          case 'arm_box_win': {
            const box = score.armBoxes.find(b => b.id === e.boxId);
            if (box) box.winnerSlot = e.slot || null;
            break;
          }
          case 'arm_advance_stage': {
            if (Array.isArray(e.boxes)) {
              score.armBoxes = score.armBoxes.filter(b => b.stage !== e.stage);
              for (const nb of e.boxes) {
                score.armBoxes.push({ id: nb.id, stage: e.stage, label: nb.label, p1Id: nb.p1Id || '', p2Id: nb.p2Id || '', winnerSlot: null });
              }
            }
            break;
          }
          case 'bout_add':
            score.bouts.push({ id: e.boutId, round: e.round || ('Round ' + (score.bouts.length + 1)), homePlayerId: e.homePlayerId, awayPlayerId: e.awayPlayerId, winner: null });
            break;
          case 'bout_win': {
            const b = score.bouts.find(x => x.id === e.boutId);
            if (b && !b.winner) {
              b.winner = e.side;
              score[e.side]++;
            }
            break;
          }
          case 'bout_remove':
            score.bouts = score.bouts.filter(x => x.id !== e.boutId || x.winner);
            break;
          case 'correct':
            score.home = e.home; score.away = e.away;
            if (Array.isArray(e.sets)) {
              score.sets = e.sets.map(s => ({ home: Number(s.home) || 0, away: Number(s.away) || 0 }));
              score.setsWon = { home: score.sets.filter(s => s.home > s.away).length, away: score.sets.filter(s => s.away > s.home).length };
            }
            if (e.rules) settleSet(score, e.rules);
            break;
          case 'hit': case 'miss': {
            const targetId = e.teamId || e.playerId;
            const attempt = score.attempts[targetId] ||= { hits: 0, total: 0 };
            attempt.total++;
            if (e.kind === 'hit') attempt.hits++;
            break;
          }
          case 'result': {
            const targetId = e.teamId || e.playerId;
            score.results[targetId] = e.value;
            break;
          }
        }
      }
      return score;
    }

    function record(details, previous, input) {
      const timeline = [...(previous.timeline || [])];
      if (input.kind === 'undo') { check(timeline.length, 'There are no recorded actions to undo.'); timeline.pop(); return replay(details, timeline); }
      const s = replay(details, timeline);
      const e = { ...input, at: new Date().toISOString() };
      const sport = details.sport, individual = details.format === 'individual';
      if (e.kind === 'start') {
        check(s.status === 'scheduled', 'This event has already started.');
        e.period = individual ? '' : sport === 'football' ? 'First half' : isSetSport(sport) ? 'Set 1' : '';
      } else {
        check(s.status === 'live', 'Go live before recording a score.');
        if (['goal', 'yellow', 'red', 'sub', 'point', 'rally', 'timeout', 'server', 'bout_win'].includes(e.kind)) check(sides.includes(e.side), 'Choose a team.');
        switch (e.kind) {
          case 'finish': case 'timer_start': case 'timer_pause': case 'timer_stop': case 'timer_set': case 'extra_time': break;
          case 'server':
            check(sport === 'badminton' && !individual, 'Server control is for badminton.');
            break;
          case 'rubiks_contestant_add':
            check(isContestSport(sport), 'Contestant additions are for Rubik’s Cube, Eating Contest, or Push-Up Challenge events.');
            check(e.playerId, 'Select a contestant to add.');
            break;
          case 'eat_amount':
            check(isRepSport(sport), 'Repetition / quantity scores are for Eating Contest or Push-Up Challenge events.');
            check(e.playerId, 'Select a contestant.');
            if (!e.dnf && !e.clear) {
              check(Number.isFinite(Number(e.amount)) && Number(e.amount) >= 0, sport === 'pushup' ? 'Enter a valid push-up count.' : 'Enter a valid quantity eaten.');
            }
            break;
          case 'solve_time':
            check(sport === 'rubiks', 'Solve times are for Rubik’s Cube Challenge.');
            check(e.playerId, 'Select a contestant.');
            if (!e.dnf && !e.clear) {
              check(Number.isFinite(Number(e.ms)) && Number(e.ms) > 0, 'Enter a valid solve time.');
            }
            break;
          case 'arm_box_set':
          case 'arm_box_win':
          case 'arm_advance_stage':
            check(sport === 'armwrestling', 'Bout controls are for Arm Wrestling.');
            break;
          case 'goal': case 'yellow': case 'red': case 'sub': case 'period':
            if (sport === 'volleyball' && ['yellow', 'red', 'sub'].includes(e.kind)) {
              if (e.kind === 'sub') check(e.playerId && e.otherPlayerId && e.otherPlayerId !== e.playerId, 'Select court player and substitute.');
              if (e.kind === 'red') e.rules = setRules(details);
              break;
            }
            check(sport === 'football' && !individual, 'This control is for team football.');
            if (e.kind === 'period') check(['First half', 'Half time', 'Second half', 'Extra time', 'Penalties'].includes(e.period), 'Choose the match period.');
            else {
              check(integer(e.minute) && e.minute <= 999, 'Enter a match minute between 0 and 999.');
              if (e.kind !== 'goal') check(e.playerId, 'Select a player.');
              if (e.kind === 'sub') check(e.otherPlayerId && e.otherPlayerId !== e.playerId, 'Choose the player coming on.');
            }
            break;
          case 'timeout': check(sport === 'volleyball' && !individual, 'Timeouts are for volleyball matches.'); check((s.timeouts[e.side] || 0) < 2, 'Both timeouts already used in this set.'); break;
          case 'rally': check(isSetSport(sport) && !individual && !s.winner, 'The final set is complete.'); e.rules = setRules(details); break;
          case 'bout_add':
            check(sport === 'armwrestling' && !individual, 'Bouts are for arm wrestling events.');
            check(e.homePlayerId && e.awayPlayerId, 'Select both participants for the bout.');
            break;
          case 'bout_win':
            check(sport === 'armwrestling' && !individual, 'Bouts are for arm wrestling events.');
            check(s.bouts.some(b => b.id === e.boutId && !b.winner), 'This bout is already decided.');
            break;
          case 'bout_remove':
            check(sport === 'armwrestling' && !individual, 'Bouts are for arm wrestling events.');
            break;
          case 'point': check(!individual && (sport === 'custom' || sport === 'armwrestling'), 'Choose a team event.'); break;
          case 'correct': check(!individual && (!s.winner || isSetSport(sport)), 'Undo the last action to edit a completed match.'); check(integer(e.home) && integer(e.away), 'Scores must be whole numbers.'); if (isSetSport(sport)) e.rules = setRules(details); break;
          case 'hit': case 'miss': case 'result': {
            const validTeams = details.teamIds || [];
            const validPlayers = details.playerIds || [];
            const targetId = e.teamId || e.playerId;
            check(individual && (validTeams.includes(targetId) || validPlayers.includes(targetId)), 'Choose a registered team.');
            if (e.kind === 'result') check(Number.isFinite(e.value), 'Enter a valid result.');
            else { check(sport === 'crossbar', 'Attempts are for crossbar challenges.'); check((s.attempts[targetId]?.total || 0) < number(details.attemptLimit, 5), 'All attempts used.'); }
            break;
          }
          default: throw new Error('Unknown scoring action.');
        }
      }
      timeline.push(e);
      return replay(details, timeline);
    }

    function node(tag, title, className) { const el = document.createElement(tag); if (title != null) el.textContent = title; if (className) el.className = className; return el; }
    function scSelect(items) { const el = node('select'); for (const [v, t] of items) el.add(new Option(t, v)); return el; }
    function numeric(value, min = 0, max = null) { const el = node('input'); el.type = 'number'; el.value = value; el.min = min; if (max != null) el.max = max; return el; }
    function scField(label, control) { const el = node('label', label, 'sc-field'); el.append(control); return el; }

    function getRubiksLeaderboard(d, s, allTeams, allPlayers) {
      const regIds = new Set([...(d.playerIds || []), ...(s.extraContestants || []), ...Object.keys(s.solveTimes || {})]);
      const tIds = new Set(d.teamIds || []);
      const teamMap = new Map((allTeams || []).map(t => [t.id, t]));
      const playerMap = new Map((allPlayers || []).map(p => [p.id, p]));

      const entries = [...regIds].map(pid => {
        const pObj = playerMap.get(pid);
        if (!pObj) return null;
        const rec = s.solveTimes?.[pid];
        const tid = rec?.teamId || pObj.teamId;
        const tObj = teamMap.get(tid);
        const solved = rec && !rec.dnf && Number.isFinite(rec.ms) && rec.ms > 0;
        const dnf = Boolean(rec?.dnf);
        return {
          player: pObj,
          team: tObj,
          teamId: tid,
          ms: solved ? rec.ms : Infinity,
          solved,
          dnf,
          displayTime: solved ? formatDurationMs(rec.ms) : dnf ? 'DNF' : 'Pending'
        };
      }).filter(Boolean).sort((a, b) => {
        if (a.solved && b.solved) return a.ms - b.ms || a.player.name.localeCompare(b.player.name);
        if (a.solved) return -1;
        if (b.solved) return 1;
        if (a.dnf !== b.dnf) return a.dnf ? -1 : 1;
        return a.player.name.localeCompare(b.player.name);
      });

      const teamSummary = [...tIds].map(tid => {
        const tObj = teamMap.get(tid);
        if (!tObj) return null;
        const tEntries = entries.filter(e => e.teamId === tid);
        const solvedList = tEntries.filter(e => e.solved).sort((a, b) => a.ms - b.ms);
        const best = solvedList[0] || null;
        return {
          team: tObj,
          bestMs: best ? best.ms : Infinity,
          bestPlayer: best ? best.player : null,
          solvedCount: solvedList.length,
          totalCount: tEntries.length
        };
      }).filter(Boolean).sort((a, b) => {
        if (a.bestMs !== b.bestMs) return a.bestMs - b.bestMs;
        return b.solvedCount - a.solvedCount || a.team.name.localeCompare(b.team.name);
      });

      return { entries, teamSummary };
    }

    function getEatingLeaderboard(d, s, allTeams, allPlayers) {
      const defaultUnit = d.sport === 'pushup' ? 'push-ups' : 'items';
      const unit = String(d.eatUnit || defaultUnit).trim();
      const regIds = new Set([...(d.playerIds || []), ...(s.extraContestants || []), ...Object.keys(s.eatAmounts || {})]);
      const tIds = new Set(d.teamIds || []);
      const teamMap = new Map((allTeams || []).map(t => [t.id, t]));
      const playerMap = new Map((allPlayers || []).map(p => [p.id, p]));

      const entries = [...regIds].map(pid => {
        const pObj = playerMap.get(pid);
        if (!pObj) return null;
        const rec = s.eatAmounts?.[pid];
        const tid = rec?.teamId || pObj.teamId;
        const tObj = teamMap.get(tid);
        const recorded = rec && !rec.dnf && Number.isFinite(rec.amount) && rec.amount >= 0;
        const dnf = Boolean(rec?.dnf);
        return {
          player: pObj,
          team: tObj,
          teamId: tid,
          amount: recorded ? rec.amount : -1,
          recorded,
          dnf,
          displayAmount: recorded ? formatEatAmount(rec.amount, unit) : dnf ? 'DNF' : 'Pending'
        };
      }).filter(Boolean).sort((a, b) => {
        if (a.recorded && b.recorded) return b.amount - a.amount || a.player.name.localeCompare(b.player.name);
        if (a.recorded) return -1;
        if (b.recorded) return 1;
        if (a.dnf !== b.dnf) return a.dnf ? -1 : 1;
        return a.player.name.localeCompare(b.player.name);
      });

      const teamSummary = [...tIds].map(tid => {
        const tObj = teamMap.get(tid);
        if (!tObj) return null;
        const tEntries = entries.filter(e => e.teamId === tid);
        const validList = tEntries.filter(e => e.recorded).sort((a, b) => b.amount - a.amount);
        const best = validList[0] || null;
        return {
          team: tObj,
          bestAmount: best ? best.amount : -1,
          bestPlayer: best ? best.player : null,
          recordedCount: validList.length,
          totalCount: tEntries.length
        };
      }).filter(Boolean).sort((a, b) => {
        if (a.bestAmount !== b.bestAmount) return b.bestAmount - a.bestAmount;
        return b.recordedCount - a.recordedCount || a.team.name.localeCompare(b.team.name);
      });

      return { entries, teamSummary, unit };
    }

    function getArmWrestlingState(d, s, allTeams, allPlayers) {
      const boxes = (s.armBoxes && s.armBoxes.length) ? s.armBoxes : defaultArmBoxes(d);
      const playerMap = new Map((allPlayers || []).map(p => [p.id, p]));
      const teamIds = new Set([...(d.teamIds || []), ...(d.playerIds || []).map(id => playerMap.get(id)?.teamId).filter(Boolean)]);
      const teamPoints = new Map([...teamIds].map(id => [id, 0]));

      for (const b of boxes) {
        if (b.winnerSlot === 'p1' && b.p1Id) {
          const tid = playerMap.get(b.p1Id)?.teamId;
          if (tid) teamPoints.set(tid, (teamPoints.get(tid) || 0) + 1);
        } else if (b.winnerSlot === 'p2' && b.p2Id) {
          const tid = playerMap.get(b.p2Id)?.teamId;
          if (tid) teamPoints.set(tid, (teamPoints.get(tid) || 0) + 1);
        }
      }

      const teamStandings = [...teamPoints.entries()]
        .map(([tid, pts]) => ({ team: (allTeams || []).find(t => t.id === tid), teamId: tid, pts }))
        .filter(x => x.team)
        .sort((a, b) => b.pts - a.pts || a.team.name.localeCompare(b.team.name));

      return { boxes, teamStandings };
    }

    let adminClockInterval = null;
    function mountScoring(container, fixture, data, onSave) {
      if (adminClockInterval) { clearInterval(adminClockInterval); adminClockInterval = null; }
      const d = fixture.details, score = replay(d, fixture.score?.timeline || []);
      const teams = new Map((data.teams || []).map(t => [t.id, t])), players = new Map((data.players || []).map(p => [p.id, p]));
      const team = side => teams.get(d[side + 'Id'])?.name || sideKey(side), teamById = id => teams.get(id)?.name || 'Team', player = id => players.get(id)?.name || 'Player';
      const individual = d.format === 'individual';
      const panel = node('section', null, 'sc-console'); container.replaceChildren(panel);
      const title = node('div', null, 'sc-head'); title.append(node('h3', 'Scoring desk'), node('span', score.status, 'sc-state ' + score.status)); panel.append(title);
      const feedback = node('p', '', 'sc-feedback'); feedback.setAttribute('role', 'alert');
      let busy = false;
      async function submit(action) {
        if (busy) return;
        try { const next = record(d, fixture.score || {}, action); busy = true; panel.inert = true; feedback.textContent = ''; await onSave(next); }
        catch (error) { feedback.textContent = error.message || 'Could not save this action.'; }
        finally { busy = false; panel.inert = false; }
      }
      function button(label, run, style = '') { const b = node('button', label, 'sc-btn ' + style); b.type = 'button'; b.addEventListener('click', run); return b; }
      function section(name) { const box = node('div', null, 'sc-box'); box.append(node('h4', name)); panel.append(box); return box; }
      const statusLabel = score.status === 'live' ? score.period || 'Live' : score.status === 'finished' ? 'Final result' : 'Scheduled';

      if (!individual && d.sport !== 'armwrestling') {
        const board = node('div', null, 'sc-board');
        for (const side of sides) {
          const col = node('div');
          const serveTag = d.sport === 'badminton' && score.server === side && score.status === 'live' ? ' 🏸' : '';
          col.append(node('span', team(side) + serveTag), node('strong', String(score[side])));
          if (d.sport === 'volleyball') col.append(node('small', score.setsWon[side] + ' sets · ' + (score.timeouts[side] || 0) + '/2 TO'));
          if (d.sport === 'badminton') col.append(node('small', score.setsWon[side] + ' sets won'));
          board.append(col);
        }
        panel.append(board, node('p', statusLabel, 'sc-period'));
        if (score.sets.length) panel.append(node('p', score.sets.map((set, i) => 'Set ' + (i + 1) + ' · ' + set.home + '–' + set.away).join('   /   '), 'sc-sets'));
      }

      if (score.status === 'live') {
        const clockData = computeClock(score.timeline, score.status), curSnap = formatClock(clockData);
        const timerBox = node('div', null, 'sc-timer-box');
        const topRow = node('div', null, 'sc-timer-top'), left = node('div');
        const clockEl = node('div', curSnap.text, 'sc-clock-display'); left.append(clockEl);
        if (curSnap.extraMins > 0) left.append(node('div', '+' + curSnap.extraMins + ' min Added / Extra Time', 'sc-extra-badge'));
        const subEl = node('div', clockData.stateLabel === 'running' ? 'Clock running' : clockData.stateLabel === 'paused' ? 'Clock paused' : 'Clock stopped (Half / Break)');
        subEl.style.color = '#b0b9ac'; subEl.style.fontSize = '12px'; subEl.style.marginTop = '4px'; left.append(subEl);

        const mainBtns = node('div', null, 'sc-row');
        if (clockData.running) {
          mainBtns.append(button('Pause', () => { const cur = formatClock(clockData); submit({ kind: 'timer_pause', baseSec: cur.mins * 60 + cur.secs, label: 'Timer paused at ' + cur.text }); }, 'sc-pause'));
          mainBtns.append(button('Stop (Half / Break)', () => { const cur = formatClock(clockData); submit({ kind: 'timer_stop', baseSec: cur.mins * 60 + cur.secs, label: 'Timer stopped at ' + cur.text }); }, 'sc-stop'));
        } else {
          mainBtns.append(button('Start / Resume', () => { const cur = formatClock(clockData); submit({ kind: 'timer_start', baseSec: cur.mins * 60 + cur.secs, label: 'Timer started at ' + cur.text }); }, 'sc-primary'));
          if (clockData.stateLabel === 'paused') {
            mainBtns.append(button('Stop (Half / Break)', () => { const cur = formatClock(clockData); submit({ kind: 'timer_stop', baseSec: cur.mins * 60 + cur.secs, label: 'Timer stopped at ' + cur.text }); }, 'sc-stop'));
          }
        }
        topRow.append(left, mainBtns);

        const subBar = node('div', null, 'sc-timer-subbar'), presetGroup = node('div', null, 'sc-row');
        presetGroup.append(button('00:00', () => submit({ kind: 'timer_set', baseSec: 0, label: 'Timer reset to 00:00' })));
        if (d.sport === 'football') {
          presetGroup.append(button('45:00', () => submit({ kind: 'timer_set', baseSec: 45 * 60, label: 'Timer set to 45:00' })));

            const actionRow = node('div', null, 'sc-row');
            actionRow.append(button('Timeout (2/set)', () => submit({ kind: 'timeout', side: vSide.value, label: 'Timeout · ' + team(vSide.value) + ' (' + ((score.timeouts[vSide.value] || 0) + 1) + '/2)' })));
            actionRow.append(button('Substitution', () => submit({ kind: 'sub', side: vSide.value, playerId: vWho.value, otherPlayerId: vSubIn.value, label: 'Sub · ' + team(vSide.value) + ' · ' + player(vWho.value) + ' / ' + player(vSubIn.value) })));
            actionRow.append(button('Yellow Card (Warn)', () => submit({ kind: 'yellow', side: vSide.value, playerId: vWho.value, label: 'Yellow card · ' + team(vSide.value) + (vWho.value ? ' · ' + player(vWho.value) : '') })));
            actionRow.append(button('Red Card (+1 Opp)', () => submit({ kind: 'red', side: vSide.value, playerId: vWho.value, label: 'Red card · ' + team(vSide.value) + (vWho.value ? ' · ' + player(vWho.value) : '') }), 'sc-stop'));
            box.append(actionRow);
          }
        } else if (!individual && d.sport === 'badminton') {
          const box = section('Badminton Rally & Service Desk');
          if (score.winner) box.append(node('p', team(score.winner) + ' won the match.'));
          else {
            const bReason = scSelect([['Smash Winner', 'Smash Winner'], ['Drop / Net Shot', 'Drop / Net Shot'], ['Service Ace', 'Service Ace'], ['Unforced Error', 'Unforced Error'], ['Rally Point', 'Rally Point']]);

              const pNames = (d['badmintonPlayers' + sideKey(sKey)] || []).map(player).join(' & ');

                submit({ kind: 'rally', side: sKey, reason: bReason.value, label: bReason.value + ' · ' + team(sKey) });
              }, 'sc-primary'));

            box.append(quickRow);
            const bGrid = node('div', null, 'sc-grid');
            bGrid.append(scField('Rally Shot / Reason', bReason));
            const srvWrap = node('div', null, 'sc-field');
            srvWrap.append(node('span', 'Current Server (' + team(score.server) + ')'));
            const srvBtns = node('div', null, 'sc-row');
            for (const sKey of sides) {
              srvBtns.append(button('Serve: ' + team(sKey), () => submit({ kind: 'server', side: sKey, label: 'Service switched to ' + team(sKey) }), score.server === sKey ? 'sc-primary' : ''));
            }
            srvWrap.append(srvBtns);
            bGrid.append(srvWrap);
            box.append(bGrid);
          }
        } else if (!individual) {
          const box = section('Add point');
          if (score.winner) box.append(node('p', team(score.winner) + ' won the match.'));
          else { const buttons = node('div', null, 'sc-row'); box.append(buttons); for (const side of sides) buttons.append(button('+1 ' + team(side), () => submit({ kind: 'point', side, label: 'Point · ' + team(side) }), 'sc-primary')); }
        } else {
          const box = section(d.sport === 'crossbar' ? 'Record Team Attempt' : 'Record Team Result');
          const tIds = (d.teamIds && d.teamIds.length) ? d.teamIds : (data.teams || []).map(t => t.id);
          const pick = scSelect(tIds.map(id => [id, teamById(id)]));
          box.append(scField('Competing Team', pick));
          if (d.sport === 'crossbar') {
            const info = node('p', '', 'sc-info');
            const update = () => { const a = score.attempts[pick.value] || { hits: 0, total: 0 }; info.textContent = a.hits + ' hits · ' + a.total + ' of ' + number(d.attemptLimit, 5) + ' team attempts'; };
            update(); pick.onchange = update; box.append(info);
            for (const [kind, label] of [['hit', 'Hit'], ['miss', 'Miss']]) {
              box.append(button(label, () => submit({ kind, teamId: pick.value, label: label + ' · ' + teamById(pick.value) }), kind === 'hit' ? 'sc-primary' : ''));
            }
          } else {
            const val = numeric(score.results[pick.value] ?? ''); val.step = 'any';
            pick.onchange = () => { val.value = score.results[pick.value] ?? ''; };
            box.append(scField('Team Score / Result Value', val), button('Save team result', () => submit({ kind: 'result', teamId: pick.value, value: val.valueAsNumber, label: teamById(pick.value) + ' · ' + val.value }), 'sc-primary'));
          }
        }

        if (!individual && d.sport !== 'armwrestling') {
          const correction = node('details', null, 'sc-box'); correction.append(node('summary', 'Edit / Correct Score & Sets'));
          const h = numeric(score.home), a = numeric(score.away);
          correction.append(scField('Current ' + team('home'), h), scField('Current ' + team('away'), a));
          if (isSetSport(d.sport) && score.sets.length) {
            score.sets.forEach((stItem, idx) => {
              const sh = numeric(stItem.home), sa = numeric(stItem.away); sh.dataset.setHome = idx; sa.dataset.setAway = idx;
              correction.append(scField(`Set ${idx + 1} · ${team('home')}`, sh), scField(`Set ${idx + 1} · ${team('away')}`, sa));
            });
          }
          correction.append(button('Save score correction', () => {
            const editedSets = isSetSport(d.sport) ? score.sets.map((stItem, idx) => ({ home: Number(correction.querySelector(`[data-set-home="${idx}"]`)?.value ?? stItem.home), away: Number(correction.querySelector(`[data-set-away="${idx}"]`)?.value ?? stItem.away) })) : undefined;
            submit({ kind: 'correct', home: h.valueAsNumber, away: a.valueAsNumber, sets: editedSets, label: 'Score corrected to ' + h.value + '–' + a.value });
          }));
          panel.append(correction);
        }
      }

      const foot = node('div', null, 'sc-row'); panel.append(foot);
      if (score.timeline.length) foot.append(button('Undo last action', () => submit({ kind: 'undo' })));
      if (score.status === 'live') foot.append(button('Finish event', () => { if (window.confirm('Finish this event and publish the final score?')) submit({ kind: 'finish', label: 'Full time' }); }));
      panel.append(feedback);

        for (const e of score.timeline.slice(-5).reverse()) list.append(node('li', (e.minute != null ? e.minute + '′  ' : '') + (e.label || e.kind)));
        box.append(list);
      }
    }

    /* 3. FORMATION & COURT HELPERS */
    function generatePositions(formationStr, existing = [], sport = 'football') {
      if (sport === 'volleyball') {
        const zones = [{ x: 22, y: 24, zone: 'Z4' }, { x: 50, y: 24, zone: 'Z3' }, { x: 78, y: 24, zone: 'Z2' }, { x: 22, y: 64, zone: 'Z5' }, { x: 50, y: 64, zone: 'Z6' }, { x: 78, y: 64, zone: 'Z1' }, { x: 84, y: 88, zone: 'L', isLibero: true }];
        return zones.map((z, idx) => ({ ...z, playerId: existing[idx]?.playerId || '' }));
      }
      const nums = String(formationStr || '').split('-').map(Number).filter(n => n > 0 && n <= 11);
      const rows = nums.length ? [1, ...nums] : [1, 4, 3, 3], out = [];
      let idx = 0;
      rows.forEach((count, rIdx) => {
        const y = rows.length === 1 ? 85 : Math.round(88 - (rIdx / (rows.length - 1)) * 74);
        for (let c = 0; c < count; c++) { out.push({ x: Math.round(((c + 1) / (count + 1)) * 100), y, playerId: existing[idx]?.playerId || '' }); idx++; }
      });
      return out;
    }

    /* 4. PUBLIC MATCH CENTRE UI */
    const main = document.querySelector('#content'), nav = document.querySelector('#navigation'), views = ['home', 'fixtures', 'results', 'leaderboard', 'live'];
    const symbols = {

      phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.58 2.81.7A2 2 0 0 1 22 16.92z"/>',

    };
    function icon(name) { return `<svg class="ico" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${symbols[name] || symbols.field}</svg>`; }
    function e(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function color(s) { return /^#[0-9a-f]{3,8}$/i.test(s) ? s : '#9dbd75'; }
    function imgURL(s) { return typeof s === 'string' && (/^(https?:\/\/|data:image\/)/i.test(s) || /^\.\/assets\/[\w.-]+$/.test(s)) ? s : ''; }
    const fmtTime = new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' });
    const fmtDay = new Intl.DateTimeFormat('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' });
    const fmtKey = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Kolkata' });
    const day = (s, fmt = fmtDay) => s && Number.isFinite(Date.parse(s)) ? fmt.format(new Date(s)) : 'Time TBC';
    const standardName = {
      football: 'Football',
      volleyball: 'Volleyball',
      badminton: 'Badminton',
      armwrestling: 'Arm Wrestling',

      eating: 'Eating Contest',
      pushup: 'Push-Up Challenge',
      crossbar: 'Crossbar Challenge',
      custom: 'Individual / Team Event'
    };
    const label = s => String(s || '').replace(/^./, c => c.toUpperCase());
    const state = { teams: [], players: [], fixtures: [], branding: {}, siteMeta: { announcements: [], committee: [], contacts: [], fixtureOrder: [], publishedResults: [] } };
    const filters = { status: 'all', sport: 'all', team: 'all', date: 'all', resSport: 'all', resTeam: 'all', pitchSide: 'home', selectedPlayer: '', openTeammates: new Set() };
    let loaded = false, failed = false, refreshing = false, lastHash = '', priorSignature = '';

    const team = id => state.teams.find(t => t.id === id), player = id => state.players.find(p => p.id === id);
    const score = f => f.score || {}, st = f => score(f).status || 'scheduled', title = f => f.details?.name || standardName[f.details?.sport] || 'Event';
    const mode = f => f.details.format === 'individual';
    const eventTeamIds = f => (f.details.teamIds && f.details.teamIds.length) ? f.details.teamIds : [...new Set((f.details.playerIds || []).map(id => player(id)?.teamId).filter(Boolean))];
    const groupTeam = (f, t) => f.details.homeId === t || f.details.awayId === t || eventTeamIds(f).includes(t);
    const fixtures = () => sortFixturesByOrder(state.fixtures, state.siteMeta?.fixtureOrder || []);
    const fixtureLink = f => '#match/' + encodeURIComponent(f.id);

    function crest(t) {
      let u = imgURL(t?.logo);
      let initials = e((t?.name || '?').slice(0, 2).toUpperCase());
      return `<span class="crest" style="--team:${color(t?.color)}">${u ? `<img alt="" loading="lazy" src="${e(u)}" onerror="this.replaceWith(document.createTextNode('${initials}'))">` : initials}</span>`;
    }
    function empty(name, heading, body) { return `<div class="card empty"><span class="empty-icon">${icon(name)}</span><div><strong>${e(heading)}</strong><p>${e(body)}</p></div></div>`; }

    function status(f) {
      const s = st(f);
      if (s === 'live') {
        const clk = formatClock(computeClock(score(f).timeline, 'live'));
        const isStopped = clk.stateLabel !== 'running', exText = clk.extraMins > 0 ? ` +${clk.extraMins}′` : '';
        return `<span class="tag ${isStopped ? 'stopped' : 'live'}">${isStopped ? 'Stopped' : 'Live'} · <span data-live-clock="${e(f.id)}">${clk.text}</span>${exText}</span>`;
      }
      return `<span class="tag ${s === 'finished' ? 'finished' : ''}">${s === 'finished' ? 'Full time' : e(label(s))}</span>`;
    }
    function sportName(f) { return standardName[f.details.sport] || label(f.details.sport); }
    function rowTeam(t, s, extraHtml = '') { return `<div class="team-line">${crest(t)}<b>${e(t?.name || 'Team TBC')}</b>${extraHtml}<strong>${e(s)}</strong></div>`; }
    function sideRosterSummary(d, side) {
      if (d.sport !== 'badminton') return '';
      const list = (d['badmintonPlayers' + sideKey(side)] || []).map(id => player(id)?.name).filter(Boolean);
      return list.length ? `<span class="meta" style="font-size:10px;text-transform:none;letter-spacing:0">(${e(list.join(' & '))})</span>` : '';
    }
    function fixtureCard(f) {
      let d = f.details, s = score(f), isSet = isSetSport(d.sport), hasScore = st(f) !== 'scheduled', individual = mode(f);
      const tCount = eventTeamIds(f).length;
      const homeServe = d.sport === 'badminton' && st(f) === 'live' && s.server === 'home' ? '<span class="serve-dot" title="Serving"></span>' : '';
      const awayServe = d.sport === 'badminton' && st(f) === 'live' && s.server === 'away' ? '<span class="serve-dot" title="Serving"></span>' : '';
      let subNote = '';
      if (d.sport === 'rubiks') {
        const { entries } = getRubiksLeaderboard(d, s, state.teams, state.players);
        const fastest = entries.find(x => x.solved);
        subNote = `<p class="hint">${tCount} ${tCount === 1 ? 'team' : 'teams'} · ${entries.length} contestants${fastest ? ` · Fastest: <b>${e(fastest.player.name)}</b> (${e(fastest.displayTime)})` : ''}</p>`;
      } else if (isRepSport(d.sport)) {
        const { entries } = getEatingLeaderboard(d, s, state.teams, state.players);
        const leader = entries.find(x => x.recorded);
        subNote = `<p class="hint">${tCount} ${tCount === 1 ? 'team' : 'teams'} · ${entries.length} contestants${leader ? ` · Leading: <b>${e(leader.player.name)}</b> (${e(leader.displayAmount)})` : ''}</p>`;
      } else if (isSet && st(f) === 'live' && !s.winner) {
        subNote = `<p class="hint">Set ${(s.sets?.length || 0) + 1} · ${e(s.home ?? 0)} – ${e(s.away ?? 0)}${d.sport === 'badminton' ? ' · ' + e(team(s.server === 'away' ? d.awayId : d.homeId)?.name || '') + ' serving' : ''}</p>`;

    function segments(key, opts) { return `<div class="chip-row">${opts.map(([v, l]) => `<button class="seg ${filters[key] === v ? 'active' : ''}" data-set="${key}" data-value="${e(v)}" aria-pressed="${filters[key] === v}">${e(l)}</button>`).join('')}</div>`; }

    function fixtureList() {
      let all = fixtures(), types = [...new Set(all.map(f => f.details.sport))], dates = new Map(all.filter(f => f.details.startTime).map(f => [day(f.details.startTime, fmtKey), day(f.details.startTime)]));
      let list = all.filter(f => (filters.status === 'all' || st(f) === filters.status) && (filters.sport === 'all' || f.details.sport === filters.sport) && (filters.team === 'all' || groupTeam(f, filters.team)) && (filters.date === 'all' || day(f.details.startTime, fmtKey) === filters.date));
      return pageHead('Fixtures', 'Scheduled events in official tournament sequence (IST).') +
        `<div class="tools">${segments('status', [['all', 'All'], ['live', 'Live'], ['scheduled', 'Upcoming'], ['finished', 'Finished']])}${options('sport', [['all', 'All sports'], ...types.map(t => [t, standardName[t] || label(t)])])}${options('team', [['all', 'All teams'], ...state.teams.map(t => [t.id, t.name])])}${options('date', [['all', 'All dates'], ...dates])}</div>` +
        (list.length ? `<div class="fixture-list grid-2">${list.map(fixtureCard).join('')}</div>` : empty('fixtures', all.length ? 'No matching fixtures' : 'No fixtures published yet', all.length ? 'Choose another filter to see more events.' : 'Event times and venues will appear here once published.'));
    }

    function publishedResultCard(res) {
      const f = res.fixtureId ? state.fixtures.find(x => x.id === res.fixtureId) : null;
      const evTitle = res.title || (f ? title(f) : 'Event Result');
      const cat = res.category || (f ? sportName(f) : 'Final Result');
      const ordinal = n => n === 1 ? '1ST' : n === 2 ? '2ND' : n === 3 ? '3RD' : `#${n}`;
      const places = (res.places || []).filter(p => p.teamId);
      return `<article class="podium-card">
        <div class="info-line">
          <span class="fixture-sport">${e(cat)}</span>
          <span class="tag finished">Final Result</span>
        </div>
        <h3 class="fixture-title">${e(evTitle)}</h3>
        <div class="podium-list">
          ${places.map(p => {
            const tObj = team(p.teamId);
            const pObj = p.playerId ? player(p.playerId) : null;
            const pts = Number(p.points) || 0;
            return `<div class="podium-row place-${p.place}">
              <span class="medal-pill">${ordinal(p.place)}</span>
              ${crest(tObj)}
              <div class="podium-info">
                <b>${e(tObj?.name || 'Team')}</b>
                ${pObj || p.note ? `<small>${[pObj?.name, p.note].filter(Boolean).map(e).join(' · ')}</small>` : ''}
              </div>
              <div class="podium-right">
                ${pts ? `<strong>+${pts} pts</strong>` : ''}
                ${p.note && !pts ? `<small>${e(p.note)}</small>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
        ${f ? `<div class="foot-line"><a class="link-btn" href="${fixtureLink(f)}">View match details →</a></div>` : ''}
      </article>`;
    }

    function resultsPage() {
      const manual = (state.siteMeta?.publishedResults || []).map(r => ({
        ...r,
        places: (r.places || []).filter(p => p.teamId)
      })).filter(r => r.places.length > 0);

      const manualFixtureIds = new Set(manual.map(r => r.fixtureId).filter(Boolean));
      const autoFinished = fixtures().filter(f => st(f) === 'finished' && !manualFixtureIds.has(f.id)).map(f => {
        const d = f.details, s = score(f), isSet = isSetSport(d.sport);
        let places = [];
        if (f.awards?.entries?.length) {
          places = [...f.awards.entries].sort((a, b) => (Number(a.place) || 99) - (Number(b.place) || 99)).slice(0, 3).map((a, idx) => ({
            place: Number(a.place) || (idx + 1),
            teamId: a.teamId,
            playerId: a.playerId || '',
            note: '',
            points: Number(a.points) || 0
          }));
        } else if (!mode(f) && d.homeId && d.awayId) {
          const hVal = Number(isSet ? s.setsWon?.home : s.home) || 0;
          const aVal = Number(isSet ? s.setsWon?.away : s.away) || 0;
          if (hVal > aVal) {
            places = [
              { place: 1, teamId: d.homeId, playerId: '', note: `${hVal} – ${aVal}`, points: 0 },
              { place: 2, teamId: d.awayId, playerId: '', note: `${aVal} – ${hVal}`, points: 0 }
            ];
          } else if (aVal > hVal) {
            places = [
              { place: 1, teamId: d.awayId, playerId: '', note: `${aVal} – ${hVal}`, points: 0 },
              { place: 2, teamId: d.homeId, playerId: '', note: `${hVal} – ${aVal}`, points: 0 }
            ];
          }
        } else if (d.sport === 'rubiks') {
          const { entries } = getRubiksLeaderboard(d, s, state.teams, state.players);
          places = entries.filter(x => x.solved).slice(0, 3).map((ent, idx) => ({
            place: idx + 1,
            teamId: ent.teamId,
            playerId: ent.player.id,
            note: ent.displayTime,
            points: 0
          }));
        } else if (isRepSport(d.sport)) {
          const { entries } = getEatingLeaderboard(d, s, state.teams, state.players);
          places = entries.filter(x => x.recorded).slice(0, 3).map((ent, idx) => ({
            place: idx + 1,
            teamId: ent.teamId,
            playerId: ent.player.id,
            note: ent.displayAmount,
            points: 0
          }));
        } else if (d.sport === 'armwrestling') {
          const arm = getArmWrestlingState(d, s, state.teams, state.players);
          places = arm.teamStandings.slice(0, 3).map((ts, idx) => ({
            place: idx + 1,
            teamId: ts.teamId,
            playerId: '',
            note: `${ts.pts} bout ${ts.pts === 1 ? 'win' : 'wins'}`,
            points: 0
          }));
        }
        return {
          id: 'auto-' + f.id,
          fixtureId: f.id,
          title: title(f),
          category: sportName(f) + (d.stage ? ' · ' + d.stage : ''),
          places
        };
      }).filter(r => r.places.length > 0);

      const allResults = [...manual, ...autoFinished];
      const categories = [...new Set(allResults.map(r => r.category).filter(Boolean))];
      const filtered = allResults.filter(r =>
        (filters.resSport === 'all' || r.category === filters.resSport) &&
        (filters.resTeam === 'all' || (r.places || []).some(p => p.teamId === filters.resTeam))
      );

      return pageHead('Results', 'Confirmed final podium results (1st, 2nd & 3rd place).') +
        `<div class="tools">${options('resSport', [['all', 'All events'], ...categories.map(c => [c, c])])}${options('resTeam', [['all', 'All teams'], ...state.teams.map(t => [t.id, t.name])])}</div>` +
        (filtered.length
          ? `<div class="fixture-list grid-2">${filtered.map(publishedResultCard).join('')}</div>`
          : empty('results', 'No final results published yet', '1st, 2nd and 3rd place winners will appear here as soon as results are confirmed.'));
    }

    function ledger() {
      const manualResults = state.siteMeta?.publishedResults || [];
      const manualFixtureIds = new Set(manualResults.map(r => r.fixtureId).filter(Boolean));
      const manualEntries = manualResults.flatMap(r =>
        (r.places || []).filter(p => p.teamId && (Number(p.points) || 0) !== 0).map(p => ({
          teamId: p.teamId,
          playerId: p.playerId || '',
          place: p.place,
          points: Number(p.points) || 0,
          eventTitle: r.title || 'Event Result',
          eventLink: r.fixtureId ? '#match/' + encodeURIComponent(r.fixtureId) : '#results'
        }))
      );
      const fixtureAwardEntries = fixtures()
        .filter(f => st(f) === 'finished' && !manualFixtureIds.has(f.id))
        .flatMap(f => (f.awards?.entries || []).map(a => ({
          teamId: a.teamId,
          playerId: a.playerId || '',
          place: a.place,
          points: Number(a.points) || 0,
          eventTitle: title(f),
          eventLink: fixtureLink(f)
        })));
      return [...manualEntries, ...fixtureAwardEntries];
    }

    function leaderboard() {
      const awards = ledger();
      const arr = state.teams.map(t => {
        const rows = awards.filter(a => a.teamId === t.id);
        return { p: t, rows, total: rows.reduce((n, a) => n + a.points, 0) };
      }).sort((a, b) => b.total - a.total || a.p.name.localeCompare(b.p.name));

      let rank = 0;
      return pageHead('Leaderboard', 'Team championship points. Tap any team to view its Teammates and points breakdown.') +
        `<div class="rank-list">${arr.map((r, i) => {
          if (!i || r.total !== arr[i - 1].total) rank = i + 1;
          const t = r.p;
          const squad = state.players.filter(x => x.teamId === t.id);
          const showSquad = filters.openTeammates.has(t.id);
          return `<details class="rank-row" data-persist="${e(t.id)}">
            <summary>
              <span class="rank-index">${rank}</span>
              ${crest(t)}
              <span class="rank-name">
                <b>${e(t.name)}</b>
                <small>${squad.length} ${squad.length === 1 ? 'player' : 'players'}</small>

            </summary>
            <div class="team-expand-body">
              <div class="team-expand-actions">
                <button type="button" class="teammates-btn ${showSquad ? 'open' : ''}" data-toggle-teammates="${e(t.id)}">${icon('people')}<span>Teammates (${squad.length})</span></button>
                <a class="link-btn" href="#team/${encodeURIComponent(t.id)}">Full team page →</a>
              </div>
              ${showSquad ? `<div class="teammates-box">
                <div class="meta">Registered Teammates</div>
                ${squad.length ? `<div class="teammates-grid">${squad.map((m, idx) => `<span class="teammate-pill">${idx + 1}. ${e(m.name)}</span>`).join('')}</div>` : '<p class="hint">No players assigned to this team yet.</p>'}
              </div>` : ''}
              <div class="award-list">${r.rows.length ? `<ul>${r.rows.map(a => `<li><a href="${a.eventLink}">${e(a.eventTitle)}</a>${a.place ? ' · #' + e(a.place) : ''}${a.playerId ? ' · ' + e(player(a.playerId)?.name) : ''} · <b>${a.points} pts</b></li>`).join('')}</ul>` : 'No championship points awarded yet.'}</div>
            </div>
          </details>`;
        }).join('')}</div>`;
    }

    function teamPage(id) {
      let t = team(id); if (!t) return empty('people', 'Team unavailable', 'Open Home to choose a competing team.');
      let members = state.players.filter(p => p.teamId === id), fs = fixtures().filter(f => groupTeam(f, id));
      return `<a class="link-btn" href="#home">← Back to home</a>` + pageHead(t.name, `${members.length} registered players`) +
        `<section>${sectionHead('Squad Roster')}<div class="teams-grid">${members.length ? members.map((p, idx) => `<div class="team-tile" style="--team:${color(t.color)}"><span class="crest" style="--team:${color(t.color)}">${idx + 1}</span><span><b>${e(p.name)}</b><small class="team-caption">${e(t.name)}</small></span></div>`).join('') : empty('people', 'No players listed', 'Players for this team will appear here.')}</div></section>` +
        `<section class="section">${sectionHead('Team Fixtures')}<div class="fixture-list grid-2">${fs.map(fixtureCard).join('') || empty('fixtures', 'No team fixtures yet', 'Published events for this team will appear here.')}</div></section>`;
    }

    function interactiveArena(d, s) {
      const side = filters.pitchSide === 'away' ? 'away' : 'home', isHome = side === 'home', isVolley = d.sport === 'volleyball';
      const t = team(isHome ? d.homeId : d.awayId), form = String((isHome ? d.formationHome : d.formationAway) || '').trim();
      const rawPos = (isHome ? d.positionsHome : d.positionsAway) || [], legacyLine = (isHome ? d.lineupHome : d.lineupAway) || [];
      const positions = rawPos.length ? rawPos : (legacyLine.length || form || isVolley ? generatePositions(form, legacyLine.map(id => ({ playerId: id })), d.sport) : []);
      const subs = (isHome ? d.subsHome : d.subsAway) || [];
      if (!positions.some(p => p.playerId) && !subs.length && !form) return '';

      const subEvents = (s.timeline || []).filter(ev => ev.kind === 'sub' && ev.side === side);
      const cardEvents = (s.timeline || []).filter(ev => (ev.kind === 'yellow' || ev.kind === 'red') && ev.side === side);
      const pointEvents = (s.timeline || []).filter(ev => (ev.kind === 'goal' || ev.kind === 'rally') && ev.side === side);

      const resolvedNodes = positions.map((pos, idx) => {
        let pid = pos.playerId;
        const subOut = subEvents.find(ev => ev.playerId === pid);
        if (subOut && subOut.otherPlayerId) pid = subOut.otherPlayerId;
        const pObj = player(pid), pts = pointEvents.filter(ev => ev.playerId === pid).length;
        const yellows = cardEvents.filter(ev => ev.playerId === pid && ev.kind === 'yellow').length;
        const reds = cardEvents.filter(ev => ev.playerId === pid && ev.kind === 'red').length;
        return { ...pos, idx: idx + 1, pid, name: pObj?.name || (pos.isLibero ? 'Libero' : 'Player ' + (idx + 1)), pts, yellows, reds, wasSubbedIn: Boolean(subOut) };
      });

      const sel = resolvedNodes.find(n => n.pid && n.pid === filters.selectedPlayer), timeoutsUsed = s.timeouts?.[side] || 0;

      return `<h2 class="subhead">${isVolley ? 'Court Lineup & Rotation' : 'Interactive Lineup & Pitch'}</h2>
        <div class="pitch-tabs">
          <button type="button" class="pitch-tab ${isHome ? 'active' : ''}" data-set="pitchSide" data-value="home">${e(team(d.homeId)?.name || 'Home')} ${!isVolley && d.formationHome ? '(' + e(d.formationHome) + ')' : ''}</button>
          <button type="button" class="pitch-tab ${!isHome ? 'active' : ''}" data-set="pitchSide" data-value="away">${e(team(d.awayId)?.name || 'Away')} ${!isVolley && d.formationAway ? '(' + e(d.formationAway) + ')' : ''}</button>
        </div>
        ${isVolley ? `<div class="volley-meta-bar"><span>Timeouts used: <b>${timeoutsUsed} / 2</b></span><span>Remaining: <b>${Math.max(0, 2 - timeoutsUsed)}</b></span></div>` : ''}
        <div class="pitch-stage ${isVolley ? 'volley-court' : ''}" style="--team:${color(t?.color)}">
          ${resolvedNodes.map(n => `<button type="button" class="pitch-node ${n.pid && n.pid === filters.selectedPlayer ? 'selected' : ''}" style="left:${n.x}%;top:${n.y}%" data-select-player="${e(n.pid)}">
            <span class="pitch-dot ${n.isLibero ? 'libero' : ''}">${n.isLibero ? 'L' : (n.zone || n.idx)}</span>
            <span class="pitch-label">${e(n.name.split(' ')[0])}${n.pts ? (isVolley ? ' ★' + n.pts : ' ⚽') : ''}${n.reds ? ' 🟥' : n.yellows ? ' 🟨' : ''}</span>
          </button>`).join('')}
        </div>
        ${sel ? `<div class="player-spotlight"><div><strong>${e(sel.name)}</strong><div class="hint">${e(t?.name || '')}${sel.isLibero ? ' · Libero' : sel.wasSubbedIn ? ' · Subbed on' : ' · Starter'}</div></div><div>${sel.pts ? (isVolley ? '★ ' + sel.pts + ' pts ' : '⚽ ×' + sel.pts + ' ') : ''}${sel.yellows ? '🟨 ' : ''}${sel.reds ? '🟥 ' : ''}</div></div>` : '<p class="hint">Tap any player on the ' + (isVolley ? 'court' : 'pitch') + ' to inspect stats.</p>'}
        ${subs.length ? `<h3 class="subhead" style="font-size:17px">Substitutes Bench</h3><div class="subs-grid">${subs.map(sid => {
          const used = subEvents.some(ev => ev.otherPlayerId === sid);
          return `<span class="sub-chip ${used ? 'subbed' : ''}">${e(player(sid)?.name || 'Sub')}${used ? ' (On court)' : ''}</span>`;
        }).join('')}</div>` : ''}`;
    }

    function matchPage(f) {
      if (!f) return empty('field', 'Event unavailable', 'This event may have been removed.');
      let d = f.details, s = score(f), isSet = isSetSport(d.sport), h = team(d.homeId), a = team(d.awayId), isIndividual = mode(f), isScheduled = st(f) === 'scheduled';
      let arenaHtml = (d.sport === 'football' || d.sport === 'volleyball') ? interactiveArena(d, s) : '', sets = s.sets || [];
      let publicTl = [...(s.timeline || [])].filter(x => {
        if (isSet) return ['rally', 'yellow', 'red', 'timeout'].includes(x.kind);
        if (d.sport === 'armwrestling') return x.kind === 'arm_box_win' && x.slot;
        if (d.sport === 'rubiks') return x.kind === 'solve_time' && !x.clear;
        if (isRepSport(d.sport)) return x.kind === 'eat_amount' && !x.clear;
        return ['goal', 'yellow', 'red'].includes(x.kind);
      }).reverse();
      const clk = st(f) === 'live' ? formatClock(computeClock(s.timeline, 'live')) : null, isStopped = clk && clk.stateLabel !== 'running';

      const homePlayers = d.sport === 'badminton' ? (d.badmintonPlayersHome || []).map(id => player(id)?.name).filter(Boolean).join(' & ') : '';
      const awayPlayers = d.sport === 'badminton' ? (d.badmintonPlayersAway || []).map(id => player(id)?.name).filter(Boolean).join(' & ') : '';

      const teamRankIds = [...eventTeamIds(f)].sort((x, y) => {
        if (d.sport === 'crossbar') return (s.attempts?.[y]?.hits || 0) - (s.attempts?.[x]?.hits || 0);
        return (Number(s.results?.[y]) || -Infinity) - (Number(s.results?.[x]) || -Infinity);
      });

      let rubiksHtml = '';
      if (d.sport === 'rubiks') {
        const { entries, teamSummary } = getRubiksLeaderboard(d, s, state.teams, state.players);
        let rankCounter = 0;
        rubiksHtml = `
          ${clk ? `<div class="match-clock-wrap" style="margin:12px 0"><span class="match-clock-banner ${isStopped ? 'stopped' : ''}" data-live-clock="${e(f.id)}">Heat Clock · ${clk.text}</span></div>` : ''}
          <h2 class="subhead">Contestant Leaderboard (Fastest Solve)</h2>
          <p class="hint">Simultaneous multi-team challenge. Ranked by fastest solve time.</p>
          <div style="margin-top:10px">
            ${entries.length ? entries.map((ent, idx) => {
              if (ent.solved) {
                if (idx === 0 || !entries[idx - 1].solved || entries[idx - 1].ms !== ent.ms) rankCounter = idx + 1;
              }
              const rankText = ent.solved ? '#' + rankCounter : ent.dnf ? 'DNF' : '—';
              return `<div class="rubiks-row ${ent.solved && rankCounter === 1 ? 'podium-1' : ''}">
                <span class="rubiks-rank">${rankText}</span>
                ${crest(ent.team)}
                <div class="rubiks-info">
                  <b>${e(ent.player.name)}</b>
                  <small>${e(ent.team?.name || 'Team')}</small>
                </div>
                <span class="rubiks-time ${ent.dnf ? 'dnf' : !ent.solved ? 'pending' : ''}">${ent.solved ? e(ent.displayTime) : ent.dnf ? 'DNF' : 'Solving…'}</span>
              </div>`;
            }).join('') : '<p class="hint">No contestants registered yet.</p>'}
          </div>
          ${teamSummary.length ? `<h2 class="subhead">Team Best Times</h2>
            ${teamSummary.map((row, idx) => `<div class="attempt-row">
              <span style="font:700 18px/1 var(--title);color:var(--lime);min-width:22px">${row.bestMs < Infinity ? idx + 1 : '—'}</span>
              ${crest(row.team)}
              <span><b>${e(row.team.name)}</b> <small class="muted">(${row.solvedCount}/${row.totalCount} solved${row.bestPlayer ? ' · ' + e(row.bestPlayer.name) : ''})</small></span>
              <strong>${row.bestMs < Infinity ? e(formatDurationMs(row.bestMs)) : '—'}</strong>
            </div>`).join('')}` : ''}
        `;
      }

      let eatingHtml = '';
      if (isRepSport(d.sport)) {
        const isPushup = d.sport === 'pushup';
        const { entries, teamSummary, unit } = getEatingLeaderboard(d, s, state.teams, state.players);
        let rankCounter = 0;
        eatingHtml = `
          ${clk ? `<div class="match-clock-wrap" style="margin:12px 0"><span class="match-clock-banner ${isStopped ? 'stopped' : ''}" data-live-clock="${e(f.id)}">Contest Clock · ${clk.text}</span></div>` : ''}
          <h2 class="subhead">${isPushup ? `Contestant Leaderboard (Most ${e(unit)} Completed)` : `Contestant Leaderboard (Most ${e(unit)} Eaten)`}</h2>
          <p class="hint">${isPushup ? 'Ranked by highest number of push-ups completed. #1 wins overall.' : 'Ranked by highest quantity eaten within the given time.'}</p>
          <div style="margin-top:10px">
            ${entries.length ? entries.map((ent, idx) => {
              if (ent.recorded) {
                if (idx === 0 || !entries[idx - 1].recorded || entries[idx - 1].amount !== ent.amount) rankCounter = idx + 1;
              }
              const rankText = ent.recorded ? '#' + rankCounter : ent.dnf ? 'DNF' : '—';
              return `<div class="rubiks-row ${ent.recorded && rankCounter === 1 ? 'podium-1' : ''}">
                <span class="rubiks-rank">${rankText}</span>
                ${crest(ent.team)}
                <div class="rubiks-info">
                  <b>${e(ent.player.name)}</b>
                  <small>${e(ent.team?.name || 'Team')}</small>
                </div>
                <span class="rubiks-time ${ent.dnf ? 'dnf' : !ent.recorded ? 'pending' : ''}">${ent.recorded ? e(ent.displayAmount) : ent.dnf ? 'DNF' : 'Competing…'}</span>
              </div>`;
            }).join('') : '<p class="hint">No contestants registered yet.</p>'}
          </div>
          ${teamSummary.length ? `<h2 class="subhead">${isPushup ? 'Team Best Push-Up Counts' : 'Team Best Scores'}</h2>
            ${teamSummary.map((row, idx) => `<div class="attempt-row">
              <span style="font:700 18px/1 var(--title);color:var(--lime);min-width:22px">${row.bestAmount >= 0 ? idx + 1 : '—'}</span>
              ${crest(row.team)}
              <span><b>${e(row.team.name)}</b> <small class="muted">(${row.recordedCount}/${row.totalCount} scored${row.bestPlayer ? ' · ' + e(row.bestPlayer.name) : ''})</small></span>
              <strong>${row.bestAmount >= 0 ? e(formatEatAmount(row.bestAmount, unit)) : '—'}</strong>
            </div>`).join('')}` : ''}
        `;
      }

      let boutsHtml = '';
      if (d.sport === 'armwrestling') {
        const arm = getArmWrestlingState(d, s, state.teams, state.players);
        const renderStagePublic = (stageCode, stageTitle) => {
          const stageBoxes = arm.boxes.filter(b => b.stage === stageCode);
          if (!stageBoxes.length) return '';
          return `<h2 class="subhead">${stageTitle}</h2>
            <div class="arm-boxes-grid">${stageBoxes.map(b => {
              const p1 = player(b.p1Id), p2 = player(b.p2Id);
              const t1 = p1 ? team(p1.teamId) : null, t2 = p2 ? team(p2.teamId) : null;
              return `<div class="arm-box-card ${b.winnerSlot ? 'decided' : st(f) === 'live' ? 'live-box' : ''}">
                <div class="arm-box-head"><span>${e(b.label)}</span><span>${b.winnerSlot ? '+1 Bout Pt' : st(f) === 'live' ? 'Live' : 'Scheduled'}</span></div>

                  ${b.winnerSlot === 'p2' ? '<span class="win-badge">WON</span>' : ''}
                </div>
              </div>`;
            }).join('')}</div>`;
        };

        boutsHtml = `
          ${arm.teamStandings.length ? `<h2 class="subhead">Team Bout Points</h2>
            <div class="arm-team-strip">${arm.teamStandings.map(ts => `
              <div class="arm-team-pill">${crest(ts.team)}<div><b>${e(ts.team.name)}</b><small>Bout wins</small></div><strong>${ts.pts}</strong></div>
            `).join('')}</div>` : ''}
          ${renderStagePublic('FINAL', 'Championship Final')}
          ${renderStagePublic('SF', 'Semi-Finals')}
          ${renderStagePublic('QF', 'Quarter-Finals · 4 Match Boxes')}
