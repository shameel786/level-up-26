      }

      const badmintonLiveHtml = d.sport === 'badminton' && !isScheduled ? `<div class="badminton-panel">
        <div class="badminton-grid">
          <div class="badminton-side ${st(f) === 'live' && s.server === 'home' ? 'serving' : ''}">
            <div class="meta">${e(h?.name || 'Home')}</div>
            <div class="badminton-pts">${e(s.home ?? 0)}</div>
            ${st(f) === 'live' && s.server === 'home' ? '<span class="serve-pill">🏸 Serving</span>' : ''}
          </div>
          <div><div class="meta">${s.winner ? 'Final' : 'Set ' + ((sets.length || 0) + 1)}</div></div>
          <div class="badminton-side ${st(f) === 'live' && s.server === 'away' ? 'serving' : ''}">
            <div class="meta">${e(a?.name || 'Away')}</div>
            <div class="badminton-pts">${e(s.away ?? 0)}</div>
            ${st(f) === 'live' && s.server === 'away' ? '<span class="serve-pill">🏸 Serving</span>' : ''}
          </div>
        </div>
      </div>` : '';

      return `<a class="link-btn" href="#fixtures">← All fixtures</a>` +
        pageHead(title(f), [sportName(f), d.stage, day(d.startTime), d.startTime ? day(d.startTime, fmtTime) + ' IST' : '', d.venue].filter(Boolean).join(' · ')) +
        `<article class="live-article">
          <div class="info-line">${status(f)}<span class="status-msg">${e(isScheduled ? '' : s.period || '')}</span></div>
          ${!isIndividual && d.sport !== 'armwrestling' ? `<div class="match-score">
            <a class="match-side" href="#team/${encodeURIComponent(d.homeId || '')}">${crest(h)}<span>${e(h?.name || 'TBC')}</span>${homePlayers ? `<small class="roster-tag">${e(homePlayers)}</small>` : ''}</a>
            <strong>${isScheduled ? 'VS' : `${e(isSet ? s.setsWon?.home ?? 0 : s.home ?? 0)} – ${e(isSet ? s.setsWon?.away ?? 0 : s.away ?? 0)}`}${isSet && !isScheduled ? '<small>Sets won</small>' : ''}${clk ? `<div class="match-clock-wrap"><span class="match-clock-banner ${isStopped ? 'stopped' : ''}" data-live-clock="${e(f.id)}">${clk.text}</span>${clk.extraMins > 0 ? `<span class="extra-time-pill">+${clk.extraMins} min Extra Time</span>` : ''}</div>` : ''}</strong>
            <a class="match-side" href="#team/${encodeURIComponent(d.awayId || '')}">${crest(a)}<span>${e(a?.name || 'TBC')}</span>${awayPlayers ? `<small class="roster-tag">${e(awayPlayers)}</small>` : ''}</a>
          </div>` : ''}
          ${badmintonLiveHtml}
          ${boutsHtml}
          ${rubiksHtml}
          ${eatingHtml}
          ${isIndividual && !isContestSport(d.sport) && d.sport !== 'armwrestling' ? `<h2 class="subhead">${d.sport === 'crossbar' ? 'Team Attempts' : 'Competing Teams'}</h2>${teamRankIds.map(id => `<div class="attempt-row">${crest(team(id))}<span>${e(team(id)?.name || 'Team')}</span><strong>${d.sport === 'crossbar' ? `${e(s.attempts?.[id]?.hits ?? 0)} / ${e(s.attempts?.[id]?.total ?? 0)} hits` : e(s.results?.[id] ?? '—')}</strong></div>`).join('') || '<p class="hint">Competing teams will appear here.</p>'}` : ''}
          ${isSet ? `<h2 class="subhead">Sets</h2><p class="hint">Best of ${e(d.bestOf || 3)} · ${e(d.pointLimit || (d.sport === 'badminton' ? 21 : 25))} points per set${d.decidingLimit ? ' · Decider to ' + e(d.decidingLimit) : ''}</p>${sets.map((x, i) => `<div class="set-row">Set ${i + 1}<strong>${e(x.home)} – ${e(x.away)}</strong></div>`).join('')}${st(f) === 'live' && !s.winner && d.sport === 'volleyball' ? `<div class="set-row">Current set<strong>${e(s.home ?? 0)} – ${e(s.away ?? 0)}</strong></div>` : ''}` : ''}
          ${arenaHtml}
          <h2 class="subhead">${isSet ? 'Rally Highlights' : d.sport === 'armwrestling' ? 'Bout Results Log' : d.sport === 'rubiks' ? 'Solve Feed' : d.sport === 'pushup' ? 'Live Push-Up Feed' : d.sport === 'eating' ? 'Live Quantity Feed' : 'Goals & Cards'}</h2>
          ${publicTl.length ? `<ol class="timeline">${publicTl.map(x => `<li><time>${x.minute != null && x.minute !== '' ? e(x.minute) + '′' : '•'}</time><span>${/yellow|red/i.test(x.kind) ? '<i class="card-mark ' + (/red/i.test(x.kind) ? 'red' : 'yellow') + '" aria-hidden="true"></i>' : x.kind === 'timeout' ? '⏱ ' : d.sport === 'badminton' ? '🏸 ' : d.sport === 'volleyball' ? '🏐 ' : d.sport === 'armwrestling' ? '💪 ' : d.sport === 'rubiks' ? '🧩 ' : d.sport === 'pushup' ? '🏋️ ' : d.sport === 'eating' ? '🍽️ ' : '⚽ '}${e(x.label || x.reason || label(x.kind))}</span></li>`).join('')}</ol>` : '<p class="hint">No match highlights recorded yet.</p>'}
          ${st(f) === 'finished' && f.awards?.entries?.length ? `<h2 class="subhead">Championship awards</h2>${f.awards.entries.map(x => `<div class="attempt-row"><span>${e(team(x.teamId)?.name || 'Team')}${x.playerId ? ' · ' + e(player(x.playerId)?.name) : ''}</span><strong>${e(x.points)} pts</strong></div>`).join('')}` : ''}
        </article>`;
    }

    function livePage() {
      let fs = fixtures().filter(f => st(f) === 'live');
      return pageHead('Live centre', fs.length ? `${fs.length} ${fs.length === 1 ? 'event' : 'events'} in progress` : 'Follow live scores and match action.') + (fs.length === 1 ? matchPage(fs[0]).replace(/^.*?<article/s, '<article').replace('<div class="info-line">', `<h2 class="subhead">${e(title(fs[0]))}</h2><p class="hint">${e(fs[0].details.venue)}</p><div class="info-line">`) : fs.length ? `<div class="fixture-list grid-2">${fs.map(fixtureCard).join('')}</div>` : empty('live', 'No events live right now', 'Open Fixtures for the latest schedule.'));
    }

    function route() {
      let parts = location.hash.slice(1).split('/');
      let tab = parts[0] || 'home';
      if (tab === 'standings') tab = 'results';
      return { tab, id: parts[1] ? decodeURIComponent(parts[1]) : '' };
    }

    function renderPublic() {
      let { tab, id } = route();
      let panel = ({ home, fixtures: fixtureList, results: resultsPage, leaderboard, live: livePage, announcements: announcementsPage, committee: committeePage, contact: contactPage, match: () => matchPage(state.fixtures.find(f => f.id === id)), team: () => teamPage(id) })[tab] || home;
      let active = tab === 'team' ? 'home' : tab === 'match' ? (st(state.fixtures.find(f => f.id === id) || {}) === 'live' ? 'live' : 'fixtures') : tab;
      nav.innerHTML = views.map(v => `<a href="#${v}" ${v === active ? 'aria-current="page"' : ''}>${icon(v)}<span>${label(v)}</span></a>`).join('');
      const open = new Set([...main.querySelectorAll('details[open]')].map(el => el.dataset.persist));
      main.innerHTML = message() + (loaded ? panel() : (tab === 'home' ? home().split('<section class="section">')[0] : '') + (failed ? '' : `<div class="loading" role="status">Loading match centre…</div>`));
      for (let el of main.querySelectorAll('details')) if (open.has(el.dataset.persist)) el.open = true;
      if (lastHash !== location.hash) { window.scrollTo(0, 0); lastHash = location.hash; }
      document.title = `${label(views.includes(tab) ? tab : tab === 'match' ? 'Event details' : tab === 'team' ? 'Team' : tab)} · ${state.branding?.name || 'Level Up ’26'}`;
    }

    setInterval(() => {
      if (document.hidden || route().tab === 'admin') return;
      document.querySelectorAll('[data-live-clock]').forEach(el => {
        const f = state.fixtures.find(x => x.id === el.getAttribute('data-live-clock'));
        if (f && st(f) === 'live') {
          const prefix = (isContestSport(f.details.sport) && el.textContent.includes('Clock')) ? (f.details.sport === 'rubiks' ? 'Heat Clock · ' : 'Contest Clock · ') : '';
          el.textContent = prefix + formatClock(computeClock(score(f).timeline, 'live')).text;
        }
      });
    }, 1000);

    function formatEventTitleHtml(name, emTag = 'i') {
      const clean = e(name || 'LEVEL UP ’26');
      const parts = clean.split(' ');
      if (parts.length > 1) {
        const last = parts.pop();
        return `${parts.join(' ')} <${emTag}>${last}</${emTag}>`;
      }
      return clean;
    }

    function applyBrandingUI(branding = {}) {
      const evName = branding.name || 'LEVEL UP ’26';
      const evSub = branding.subtitle || 'Sports & games gala';
      const logo = branding.logo || './assets/event-logo.png';

      const bTitle = document.getElementById('brand-title');
      if (bTitle) bTitle.innerHTML = formatEventTitleHtml(evName, 'i');
      const bSub = document.getElementById('brand-sub');
      if (bSub) bSub.textContent = evSub;
      const dTitle = document.getElementById('drawer-brand-title');
      if (dTitle) dTitle.innerHTML = formatEventTitleHtml(evName, 'span');
      const aTitle = document.getElementById('admin-brand-title');
      if (aTitle) aTitle.innerHTML = formatEventTitleHtml(evName, 'em');
      const aOver = document.getElementById('admin-overline');
      if (aOver) aOver.textContent = evName;

      const admImg = document.getElementById('admin-brand-logo');
      if (admImg && admImg.dataset.src !== logo) {
        admImg.dataset.src = logo;
        admImg.style.display = '';
        admImg.src = logo;
      }

      const el = document.getElementById('brand-icon');
      if (el && el.dataset.loadedLogo !== logo) {
        const initials = evName.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'LU';
        const img = new Image();
        img.alt = '';
        img.onload = () => {
          el.dataset.loadedLogo = logo;
          el.classList.add('photo');
          el.replaceChildren(img);
        };
        img.onerror = () => {
          el.dataset.loadedLogo = logo;
          el.classList.remove('photo');
          el.textContent = initials;
        };
        img.src = logo;
      }
      updatePwaManifest(evName, evSub);
    }

    async function refreshPublic() {
      if (refreshing || route().tab === 'admin') return;
      refreshing = true;
      try {
        const next = await snapshot();
        if (!Array.isArray(next?.teams) || !Array.isArray(next?.fixtures)) throw Error('Invalid snapshot');
        let sig = JSON.stringify([next.teams, next.players, next.fixtures, next.branding, next.siteMeta]), changed = sig !== priorSignature || failed;
        Object.assign(state, next); loaded = true; failed = false; priorSignature = sig;
        applyBrandingUI(next.branding);
        if (changed) renderPublic();
      } catch { if (!failed) { failed = true; renderPublic(); } }
      finally { refreshing = false; }
    }

    /* 5. USER-FRIENDLY STAFF CONTROL ROOM */
    const app = document.querySelector('#app'), account = document.querySelector('#account'), notice = document.querySelector('#notice');
    const permissions = { schedule: 'Schedule and lineups', score: 'Live scoring', awards: 'Results & championship awards', delete: 'Delete fixtures' };
    const sports = {
      football: 'Football',
      volleyball: 'Volleyball',
      badminton: 'Badminton',
      armwrestling: 'Arm Wrestling (8 Players · 4 Match Boxes)',
      rubiks: "Rubik's Cube Challenge (Timed Contestants)",
      eating: 'Eating Contest (Quantity Eaten)',
      pushup: 'Push-Up Challenge (Repetition Count)',
      crossbar: 'Crossbar Challenge (Team Attempts)',
      custom: 'Individual / Team Event (Team Result Only)'
    };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let adminData, view = 'fixtures', activeId = '', authMode = 'login', busy = false;
    let adminSearch = '', adminStatusFilter = 'all';
    let editingResultId = '';
    let designerState = { Home: { formation: '4-3-3', positions: [], selectedIdx: 0, open: true }, Away: { formation: '4-3-3', positions: [], selectedIdx: 0, open: false } };

    const current = () => adminData.fixtures.find(f => f.id === activeId);
    const allowed = (p, f) => adminData.role === 'admin' || (adminData.permissions.includes(p) && (!adminData.assigned.length || (f && adminData.assigned.includes(f.id))));
    const teamName = id => adminData.teams.find(t => t.id === id)?.name || 'Unassigned';

    function statusMsg(text = '', error = false) { notice.textContent = text; notice.className = error ? 'error' : ''; }
    async function reloadAdmin() { adminData = await snapshot(); app.removeAttribute('aria-busy'); renderAdmin(); }
    function admBtn(text, action, cls = '', disabled = false) { return '<button type="button" class="' + cls + '" data-action="' + action + '"' + (disabled ? ' disabled' : '') + '>' + esc(text) + '</button>'; }
    function admOpts(items, val, empty = '') { return (empty ? '<option value="">' + esc(empty) + '</option>' : '') + items.map(([k, n]) => '<option value="' + esc(k) + '" ' + (String(val) === String(k) ? 'selected' : '') + '>' + esc(n) + '</option>').join(''); }
    function admField(label, html) { return '<label class="field">' + esc(label) + html + '</label>'; }
    function admInput(name, val, type = 'text', attrs = '') { return '<input name="' + name + '" type="' + type + '" value="' + esc(val) + '" ' + attrs + '>'; }
    function admSelect(name, opts, attrs = '') { return '<select name="' + name + '" ' + attrs + '>' + opts + '</select>'; }
    function admCheckbox(name, value, label, checked) { return '<label class="check"><input type="checkbox" name="' + name + '" value="' + esc(value) + '" ' + (checked ? 'checked' : '') + '>' + esc(label) + '</label>'; }
    function navigateAdmin(v, id = '') { view = v; activeId = id; statusMsg(); renderAdmin(); window.scrollTo(0, 0); }

    async function runAdmin(task) {
      if (busy) return;
      busy = true; app.inert = true; account.inert = true; statusMsg();
      try { await task(); } catch (err) { statusMsg(err.message || 'Unable to complete this action.', true); }
      finally { app.inert = false; account.inert = false; busy = false; }
    }

    function adminNavBar() {
      const tabs = [
        ['fixtures', 'Fixtures & Order'],
        ...(allowed('awards') ? [['resultsAdmin', 'Results (1st–3rd)']] : []),
        ...(adminData.role === 'admin' ? [
          ['teams', 'Teams & Logos'],
          ['players', 'Players'],
          ['siteMeta', 'Brand & Notices'],
          ['access', 'Managers']
        ] : [])
      ];
      return `<nav class="adm-nav-strip" aria-label="Control room sections">${tabs.map(([v, lbl]) => {
        const isActive = view === v || (v === 'fixtures' && ['new', 'details', 'score', 'awards'].includes(view));
        return `<button type="button" class="adm-nav-tab ${isActive ? 'active' : ''}" data-action="${v}">${esc(lbl)}</button>`;
      }).join('')}</nav>`;
    }

    function renderAdmin() {
      applyBrandingUI(adminData?.branding || {});
      account.innerHTML = '';
      if (adminData.role !== 'admin' && adminData.role !== 'manager') { authAdmin(); return; }
      account.innerHTML = '<div class="account"><span class="pill">' + (adminData.role === 'admin' ? 'Main administrator' : 'Event manager') + '</span>' + admBtn('Sign out', 'logout') + '</div>';
      if (view === 'new' || view === 'details') { fixtureForm(); return; }
      if (view === 'resultsAdmin') { resultsAdminView(); return; }
      if (view === 'access') { accessAdmin(); return; }
      if (view === 'siteMeta') { siteMetaAdmin(); return; }
      if (view === 'teams') { teamsAdmin(); return; }
      if (view === 'players') { playersAdmin(); return; }
      if (view === 'score' || view === 'awards') { if (!current()) { view = 'fixtures'; renderAdmin(); return; } editorAdmin(); return; }
      listingAdmin();
    }

    function authAdmin() {
      let reg = authMode === 'register';
      app.innerHTML = '<section class="panel login"><h2>' + (reg ? 'Manager registration' : 'Staff sign in') + '</h2><p class="hint">' + (reg ? 'Use the email address authorised by the main administrator.' : 'Sign in with your administrator or manager account.') + '</p><form id="auth"><div class="fields"><div class="full">' + admField('Email address', admInput('email', '', 'email', 'autocomplete="username" required')) + '</div><div class="full">' + admField('Password', admInput('password', '', 'password', 'autocomplete="' + (reg ? 'new-password' : 'current-password') + '" required')) + '</div></div><div class="actions"><button class="primary">' + (reg ? 'Register' : 'Sign in') + '</button>' + admBtn(reg ? 'Back to sign in' : 'Register as a manager', 'toggleAuth') + '</div></form></section>';
    }

    function listingAdmin() {
      const orderedAll = sortFixturesByOrder(adminData.fixtures, adminData.siteMeta?.fixtureOrder || [])
        .filter(f => adminData.role === 'admin' || !adminData.assigned.length || adminData.assigned.includes(f.id));
      const canReorder = adminData.role === 'admin' && adminSearch === '' && adminStatusFilter === 'all';
      const q = adminSearch.trim().toLowerCase();

      const filtered = orderedAll.filter(f => {
        const s = f.score?.status || 'scheduled';
        if (adminStatusFilter !== 'all' && s !== adminStatusFilter) return false;
        if (!q) return true;
        const d = f.details || {};
        const hay = [d.name, sports[d.sport], d.venue, d.stage, teamName(d.homeId), teamName(d.awayId)].join(' ').toLowerCase();
        return hay.includes(q);
      });

      const publishedFixtureIds = new Set((adminData.siteMeta?.publishedResults || []).map(r => r.fixtureId).filter(Boolean));

      app.innerHTML = adminNavBar() +
        `<section class="panel">
          <div class="bar">
            <div>
              <h2>Fixtures &amp; Events (${orderedAll.length})</h2>
              <p class="hint" style="margin:2px 0 0">Use <b>↑ / ↓</b> to arrange the exact display order shown on the Match Centre.</p>
            </div>
            <div class="actions">
              ${allowed('schedule') ? admBtn('+ Add Event', 'new', 'accent') : ''}
              ${admBtn('Refresh', 'refresh')}
            </div>
          </div>

          <div class="adm-toolbar">
            <input type="search" id="admFixtureSearch" class="adm-search" value="${esc(adminSearch)}" placeholder="Search event, sport, team or venue…">
            <div class="adm-pills">
              ${[['all', 'All'], ['live', 'Live'], ['scheduled', 'Upcoming'], ['finished', 'Finished']].map(([val, lbl]) =>
                `<button type="button" class="adm-pill-btn ${adminStatusFilter === val ? 'active' : ''}" data-adm-status="${val}">${lbl}</button>`
              ).join('')}
            </div>
          </div>

          ${!canReorder && adminData.role === 'admin' ? '<p class="hint">Clear search and set filter to <b>All</b> to reorder events with ↑ / ↓.</p>' : ''}

          <div>
            ${filtered.length ? filtered.map((f, idx) => {
              const d = f.details, s = f.score?.status || 'scheduled';
              const hasManualResult = publishedFixtureIds.has(f.id);
              return `<article class="adm-fixture-card ${s === 'live' ? 'is-live' : ''}">
                ${canReorder ? `<div class="adm-order-col" data-order-id="${esc(f.id)}">
                  <button type="button" class="adm-move-btn" data-action="moveFixtureUp" title="Move Up" ${idx === 0 ? 'disabled' : ''}>↑</button>
                  <button type="button" class="adm-move-btn" data-action="moveFixtureDown" title="Move Down" ${idx === filtered.length - 1 ? 'disabled' : ''}>↓</button>
                </div>` : ''}
                <div class="adm-fixture-body">
                  <div class="adm-fixture-title-row">
                    <strong style="font-size:1.05rem">${esc(d.name)}</strong>
                    <span class="adm-status-badge ${s}">${s === 'finished' ? 'Finished' : s === 'live' ? 'Live' : 'Upcoming'}</span>
                    ${hasManualResult ? '<span class="adm-status-badge finished">Podium Published</span>' : ''}
                  </div>
                  <span class="meta">${esc([sports[d.sport], dateLabel(d.startTime), d.venue].filter(Boolean).join(' · '))}</span>
                </div>
                <div class="actions" data-id="${esc(f.id)}">
                  ${allowed('score', f) ? admBtn(s === 'live' ? 'Live Score' : 'Score', 'score', 'primary') : ''}
                  ${allowed('awards', f) ? admBtn(hasManualResult ? 'Edit Result' : 'Result', 'quickResult') : ''}
                  ${allowed('schedule', f) ? admBtn('Edit', 'details') : ''}
                  ${allowed('delete', f) ? admBtn('Delete', 'delete', 'danger') : ''}
                </div>
              </article>`;
            }).join('') : '<p class="hint">No matching fixtures found.</p>'}
          </div>
        </section>`;

      const searchInp = app.querySelector('#admFixtureSearch');
      if (searchInp) {
        searchInp.addEventListener('input', ev => {
          adminSearch = ev.target.value;
          const pos = searchInp.selectionStart;
          listingAdmin();
          const nextInp = app.querySelector('#admFixtureSearch');
          if (nextInp) { nextInp.focus(); nextInp.setSelectionRange(pos, pos); }
        });
      }
    }

    function resultsAdminView() {
      if (!allowed('awards')) { navigateAdmin('fixtures'); return; }
      const resultsList = adminData.siteMeta?.publishedResults || [];
      const editRec = editingResultId ? resultsList.find(r => r.id === editingResultId) : null;
      const orderedFixtures = sortFixturesByOrder(adminData.fixtures, adminData.siteMeta?.fixtureOrder || []);
      const teamOpts = adminData.teams.map(t => [t.id, t.name]);

      const getSlot = place => (editRec?.places || []).find(p => Number(p.place) === place) || { place, teamId: '', playerId: '', note: '', points: '' };
      const s1 = getSlot(1), s2 = getSlot(2), s3 = getSlot(3);

      const renderPodiumSlot = (slot, titleText, slotClass, reqTeam = false) => {
        const filteredPlayers = slot.teamId
          ? adminData.players.filter(p => p.teamId === slot.teamId)
          : adminData.players;
        return `<div class="adm-podium-slot ${slotClass}">
          <h3><span>${titleText}</span></h3>
          <label class="field">Winning Team ${reqTeam ? '*' : '(Optional)'}
            <select name="team_${slot.place}" data-result-team="${slot.place}" ${reqTeam ? 'required' : ''}>
              ${admOpts(teamOpts, slot.teamId, reqTeam ? 'Select 1st place team' : '— None —')}
            </select>
          </label>
          <label class="field">Player Name (Optional)
            <select name="player_${slot.place}" data-result-player="${slot.place}">
              ${admOpts(filteredPlayers.map(p => [p.id, `${p.name} (${teamName(p.teamId)})`]), slot.playerId, '— Team / No specific player —')}
            </select>
          </label>
          <label class="field">Score / Time Note (Optional)

      function renderLineups() {

        const curBad = { Home: fd.getAll('badmintonPlayersHome'), Away: fd.getAll('badmintonPlayersAway') };
        if (curBad.Home.length) d.badmintonPlayersHome = curBad.Home;

        lineups.innerHTML = '';

        if (curSport === 'badminton') {

      form.addEventListener('pointermove', ev => {

                form.pointLimit.value = 21;
                form.decidingLimit.value = 21;
              } else if (form.sport.value === 'volleyball') {
                form.pointLimit.value = 25;
                form.decidingLimit.value = 15;
              }
              designerState.Home.positions = generatePositions(designerState.Home.formation, [], form.sport.value);
              designerState.Away.positions = generatePositions(designerState.Away.formation, [], form.sport.value);
            }
          }
          update();
        }
      });

      update();
    }

    function readFixture(form) {
      const values = new FormData(form), get = k => String(values.get(k) || '').trim(), all = k => values.getAll(k), sport = get('sport'), format = get('format');
      const selectedPlayerIds = all('playerIds');
      const playerTeamIds = [...new Set(selectedPlayerIds.map(pid => adminData.players.find(p => p.id === pid)?.teamId).filter(Boolean))];
      const mergedTeamIds = (isContestSport(sport) || sport === 'armwrestling') ? [...new Set([...all('teamIds'), ...playerTeamIds])] : all('teamIds');

      const initialArmBoxes = sport === 'armwrestling'
        ? [0, 1, 2, 3].map(idx => ({
            id: `qf-${idx + 1}`,
            stage: 'QF',
            label: `Match ${idx + 1}`,
            p1Id: get(`arm_p1_${idx}`),
            p2Id: get(`arm_p2_${idx}`)
          }))
        : undefined;

      let d = {
        ...current()?.details,
        name: get('name'),
        stage: get('stage'),
        venue: get('venue'),
        sport,
        format,
        startTime: new Date(get('startTime') + ':00+05:30').toISOString(),
        homeId: get('homeId'),
        awayId: get('awayId'),
        teamIds: mergedTeamIds,
        playerIds: (isContestSport(sport) || sport === 'armwrestling') ? selectedPlayerIds : [],
        initialArmBoxes,
        bestOf: Number(get('bestOf') || 3),
        pointLimit: Number(get('pointLimit') || (sport === 'badminton' ? 21 : 25)),
        decidingLimit: Number(get('decidingLimit') || (sport === 'badminton' ? 21 : 15)),
        initialServer: get('initialServer') || 'home',
        winByTwo: values.has('winByTwo'),
        attemptLimit: Number(get('attemptLimit') || 5),
        eatUnit: get('eatUnit') || (sport === 'pushup' ? 'push-ups' : 'items'),
        badmintonPlayersHome: all('badmintonPlayersHome'),
        badmintonPlayersAway: all('badmintonPlayersAway')
      };
      if (!d.name || !d.venue) throw Error('Enter a fixture name and venue.');
      if (format === 'team' && (!d.homeId || !d.awayId || d.homeId === d.awayId)) throw Error('Choose two different teams.');
      if (format === 'individual' && !d.teamIds.length && !d.playerIds.length) throw Error('Select at least one competing team or contestant.');
      if (['football', 'volleyball', 'badminton'].includes(sport) && format !== 'team') throw Error('This sport requires two head-to-head teams.');
      if (sport === 'crossbar' && format !== 'individual') throw Error('Select Multi-Team / Individual Contest for crossbar team attempts.');
      for (const side of ['Home', 'Away']) {
        d['formation' + side] = designerState[side].formation;
        d['positions' + side] = designerState[side].positions;
        d['lineup' + side] = designerState[side].positions.map(p => p.playerId).filter(Boolean);
        d['subs' + side] = all('subs' + side);
      }
      return d;
    }

    async function moveFixtureOrder(fixtureId, dir) {
      const ordered = sortFixturesByOrder(adminData.fixtures, adminData.siteMeta?.fixtureOrder || []);
      const ids = ordered.map(f => f.id);
      const idx = ids.indexOf(fixtureId);
      const target = idx + dir;
      if (idx < 0 || target < 0 || target >= ids.length) return;
      [ids[idx], ids[target]] = [ids[target], ids[idx]];
      await runAdmin(async () => {
        const nextMeta = { ...adminData.siteMeta, fixtureOrder: ids };
        await saveSiteMeta(nextMeta);
        await reloadAdmin();
        statusMsg('Event order updated.');
      });
    }

    async function moveResultOrder(resId, dir) {
      const list = [...(adminData.siteMeta?.publishedResults || [])];
      const idx = list.findIndex(r => r.id === resId);
      const target = idx + dir;
      if (idx < 0 || target < 0 || target >= list.length) return;
      [list[idx], list[target]] = [list[target], list[idx]];
      await runAdmin(async () => {
        const nextMeta = { ...adminData.siteMeta, publishedResults: list };
        await saveSiteMeta(nextMeta);
        await reloadAdmin();
        statusMsg('Published results order updated.');
      });
    }

      const statusPill = event.target.closest('[data-adm-status]');

        adminStatusFilter = statusPill.dataset.admStatus;
        listingAdmin();
        return;
      }
      const b = event.target.closest('[data-action]'); if (!b) return;
      const action = b.dataset.action, id = b.closest('[data-id]')?.dataset.id;

      if (action === 'moveFixtureUp' || action === 'moveFixtureDown') {
        const fid = b.closest('[data-order-id]')?.dataset.orderId;
        if (fid) await moveFixtureOrder(fid, action === 'moveFixtureUp' ? -1 : 1);
        return;
      }
      if (action === 'moveResultUp' || action === 'moveResultDown') {
        const rid = b.closest('[data-res-order-id]')?.dataset.resOrderId;
        if (rid) await moveResultOrder(rid, action === 'moveResultUp' ? -1 : 1);
        return;
      }
      if (action === 'quickResult') {
        const existing = (adminData.siteMeta?.publishedResults || []).find(r => r.fixtureId === id);
        editingResultId = existing ? existing.id : '';
        navigateAdmin('resultsAdmin');
        if (!existing && id) {
          const sel = app.querySelector('#resFixtureSelect');
          if (sel) { sel.value = id; sel.dispatchEvent(new Event('change')); }

        return;
      }
      if (action === 'editPublishedResult') {
        editingResultId = b.closest('[data-res-id]').dataset.resId;

        window.scrollTo(0, 0);
        return;
      }
      if (action === 'cancelEditResult') {
        editingResultId = '';

        return;

        const rid = b.closest('[data-res-id]').dataset.resId;

        if (!confirm('Remove published result for "' + (target?.title || 'Event') + '"?')) return;

          const nextList = (adminData.siteMeta?.publishedResults || []).filter(r => r.id !== rid);

        if (action === 'teams') editingTeamId = '';

      if (action === 'delete') {
        const f = adminData.fixtures.find(f => f.id === id);
        if (!confirm('Delete ' + f.details.name + ' and remove its result and award points?')) return;
        await runAdmin(async () => {
          await save(id, f.version, 'delete', {});
          const nextOrder = (adminData.siteMeta?.fixtureOrder || []).filter(x => x !== id);
          if (adminData.role === 'admin' && nextOrder.length !== (adminData.siteMeta?.fixtureOrder || []).length) {
            await saveSiteMeta({ ...adminData.siteMeta, fixtureOrder: nextOrder });
          }
          await reloadAdmin();
          statusMsg('Fixture deleted.');
        });
        return;
      }
      if (action === 'removeManager') {
        const m = adminData.managers[Number(b.closest('[data-index]').dataset.index)];
        if (!confirm('Remove gala access for ' + m.email + '?')) return;
        await runAdmin(async () => { await manager(m.email, [], [], true); await reloadAdmin(); statusMsg('Manager access removed.'); });
      }
    }

    app.addEventListener('click', onAdminClick);
    account.addEventListener('click', onAdminClick);
    app.addEventListener('submit', event => {
      const form = event.target;
      if (!['fixture', 'auth', 'award', 'manager', 'siteMetaForm', 'teamManageForm', 'playerManageForm', 'manualResultForm'].includes(form.id)) return;
      event.preventDefault();
      runAdmin(async () => {
        if (form.id === 'auth') {
          const email = form.email.value.trim(), password = form.password.value;
          if (authMode === 'register') {
            await register(email, password); authMode = 'login'; await reloadAdmin();
            statusMsg('Registration submitted. Check your email if confirmation is required, then sign in.');
          } else {
            await login(email, password); await reloadAdmin();
            if (adminData.role === 'public') statusMsg('This account does not have gala access. Use an authorised email or contact the main administrator.', true);
          }
          return;
        }
        if (form.id === 'fixture') {
          const d = readFixture(form), f = current();
          const newId = f?.id || crypto.randomUUID();
          await save(newId, f?.version || 0, 'details', d);
          if (!f && adminData.role === 'admin') {
            const curOrder = adminData.siteMeta?.fixtureOrder || [];
            if (!curOrder.includes(newId)) {
              await saveSiteMeta({ ...adminData.siteMeta, fixtureOrder: [...curOrder, newId] });
            }
          }
          view = 'fixtures'; activeId = ''; await reloadAdmin(); statusMsg('Fixture saved.');
          return;
        }
        if (form.id === 'manualResultForm') {
          const fd = new FormData(form);
          const resId = String(fd.get('resultId') || '').trim() || crypto.randomUUID();
          const fixtureId = String(fd.get('fixtureId') || '').trim();
          const titleVal = String(fd.get('title') || '').trim();
          const categoryVal = String(fd.get('category') || '').trim();
          if (!titleVal) throw Error('Enter an event display title.');

          const places = [1, 2, 3].map(place => {
            const teamId = String(fd.get(`team_${place}`) || '').trim();
            const playerId = String(fd.get(`player_${place}`) || '').trim();
            const note = String(fd.get(`note_${place}`) || '').trim();
            const rawPts = String(fd.get(`points_${place}`) || '').trim();
            const points = rawPts === '' ? 0 : Number(rawPts);
            return { place, teamId, playerId, note, points: Number.isFinite(points) ? points : 0 };
          }).filter(p => p.teamId);

          if (!places.some(p => p.place === 1)) throw Error('Select a winning team for 1st place.');

          const existingList = [...(adminData.siteMeta?.publishedResults || [])];
          const recordObj = { id: resId, fixtureId, title: titleVal, category: categoryVal, places };
          const idx = existingList.findIndex(r => r.id === resId);
          if (idx >= 0) existingList[idx] = recordObj;
          else existingList.push(recordObj);

          await saveSiteMeta({ ...adminData.siteMeta, publishedResults: existingList });

          if (fixtureId) {
            const linkedFx = adminData.fixtures.find(x => x.id === fixtureId);
            if (linkedFx && linkedFx.score?.status !== 'finished') {
              const nextScore = record(linkedFx.details, linkedFx.score || {}, { kind: 'finish', label: 'Final result published' });
              await save(linkedFx.id, linkedFx.version, 'score', nextScore).catch(() => {});
            }
          }

          editingResultId = '';
          await reloadAdmin();
          statusMsg('Final 1st–3rd result published to Results & Leaderboard.');
          return;
        }
        if (form.id === 'award') {
          const f = current(), entries = [...form.querySelectorAll('.award-row')].map(row => ({ place: Number(row.querySelector('[name=place]').value), playerId: row.querySelector('[name=playerId]').value || '', teamId: row.querySelector('[name=teamId]').value, points: Number(row.querySelector('[name=points]').value) }));
          await save(f.id, f.version, 'awards', { entries }); await reloadAdmin(); statusMsg('Championship awards saved.');
          return;
        }
        if (form.id === 'siteMetaForm') {
          const fd = new FormData(form);
          const fileInput = form.querySelector('#eventLogoFile');
          const uploadedLogo = fileInput?.files?.[0] ? await fileToCompressedDataUrl(fileInput.files[0], 240) : '';
          const logoVal = uploadedLogo || String(fd.get('eventLogoUrl') || '').trim();
          const eventBranding = {
            name: String(fd.get('eventName') || '').trim() || 'LEVEL UP ’26',
            subtitle: String(fd.get('eventSubtitle') || '').trim(),
            college: String(fd.get('eventCollege') || '').trim(),
            logo: logoVal
          };
          const titles = fd.getAll('annTitle'), bodies = fd.getAll('annBody');
          const announcements = titles.map((t, i) => ({ title: String(t).trim(), body: String(bodies[i] || '').trim() })).filter(a => a.title);
          const names = fd.getAll('commName'), roles = fd.getAll('commRole');
          const committee = names.map((n, i) => ({ name: String(n).trim(), role: String(roles[i] || '').trim() })).filter(c => c.name);
          const cNames = fd.getAll('contactName'), cRoles = fd.getAll('contactRole'), cPhones = fd.getAll('contactPhone');
          const contacts = cNames.map((n, i) => ({ name: String(n).trim(), role: String(cRoles[i] || '').trim(), phone: String(cPhones[i] || '').trim() })).filter(c => c.name || c.phone);

          const nextMeta = { ...adminData.siteMeta, eventBranding, announcements, committee, contacts };
          await saveSiteMeta(nextMeta);
          view = 'fixtures'; await reloadAdmin(); statusMsg('Event branding, announcements & contact published.');
          return;
        }
        if (form.id === 'teamManageForm') {
          const fd = new FormData(form);
          const tid = String(fd.get('teamId') || '').trim();
          const name = String(fd.get('teamName') || '').trim();
          const color = String(fd.get('teamColor') || '#c2f568').trim();
          if (!name) throw Error('Enter a team name.');
          const fileInput = form.querySelector('#teamLogoFile');
          const uploadedLogo = fileInput?.files?.[0] ? await fileToCompressedDataUrl(fileInput.files[0], 220) : '';
          const logo = uploadedLogo || String(fd.get('teamLogoUrl') || '').trim();

          const meta = { ...adminData.siteMeta };
          if (tid) {
            const isAdded = (meta.addedTeams || []).some(t => t.id === tid);
            if (isAdded) {
              meta.addedTeams = meta.addedTeams.map(t => t.id === tid ? { ...t, name, color, logo } : t);
            } else {
              meta.teamOverrides = { ...(meta.teamOverrides || {}), [tid]: { name, color, logo } };
            }
          } else {
            const newTeam = { id: crypto.randomUUID(), name, color, logo };
            meta.addedTeams = [...(meta.addedTeams || []), newTeam];
          }
          editingTeamId = '';
          await saveSiteMeta(meta);
          await reloadAdmin();
          statusMsg(tid ? 'Team updated.' : 'New team added.');
          return;
        }
        if (form.id === 'playerManageForm') {
          const fd = new FormData(form);
          const pid = String(fd.get('playerId') || '').trim();
          const name = String(fd.get('playerName') || '').trim();
          const teamId = String(fd.get('playerTeamId') || '').trim();
          if (!name || !teamId) throw Error('Enter player name and select a team.');

          const meta = { ...adminData.siteMeta };
          if (pid) {
            const isAdded = (meta.addedPlayers || []).some(p => p.id === pid);
            if (isAdded) {
              meta.addedPlayers = meta.addedPlayers.map(p => p.id === pid ? { ...p, name, teamId } : p);
            } else {
              meta.playerOverrides = { ...(meta.playerOverrides || {}), [pid]: { name, teamId } };
            }
          } else {
            const newPlayer = { id: crypto.randomUUID(), name, teamId };
            meta.addedPlayers = [...(meta.addedPlayers || []), newPlayer];
          }
          editingPlayerId = '';
          await saveSiteMeta(meta);
          await reloadAdmin();
          statusMsg(pid ? 'Player updated.' : 'New player added.');
          return;
        }
        if (form.id === 'manager') {
          const fd = new FormData(form), perms = fd.getAll('permissions'), assigned = fd.get('scope') === 'selected' ? fd.getAll('assigned') : [];
          if (!perms.length) throw Error('Choose at least one permission.');
          if (fd.get('scope') === 'selected' && !assigned.length) throw Error('Choose at least one fixture.');
          await manager(form.email.value.trim().toLowerCase(), perms, assigned, false);
          await reloadAdmin(); statusMsg('Manager access saved.');
        }
      });
    });

    /* 6. PROGRESSIVE WEB APP (PWA), DRAWER, ROUTING & BOOTSTRAP */
    let deferredInstallPrompt = null, manifestBlobUrl = '';
    const installBtn = document.getElementById('pwa-install-btn');
    const installLabel = document.getElementById('pwa-install-label');

    function buildAppIconDataUrl(size = 512, text = 'LU') {
      try {
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#0e1511';
        ctx.fillRect(0, 0, size, size);
        const pad = Math.round(size * 0.08);
        const r = Math.round(size * 0.2);
        ctx.fillStyle = '#c2f568';
        ctx.beginPath();
        ctx.roundRect(pad, pad, size - pad * 2, size - pad * 2, r);
        ctx.fill();
        ctx.fillStyle = '#132012';
        ctx.font = `italic 800 ${Math.round(size * 0.42)}px "Barlow Condensed", Impact, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, size / 2, size / 2 + Math.round(size * 0.02));
        return c.toDataURL('image/png');
      } catch {
        return '';
      }
    }

    function updatePwaManifest(appName = 'Level Up ’26', appSub = 'Sports & games gala') {
      const shortName = appName.length > 14 ? appName.slice(0, 14).trim() : appName;
      const initials = appName.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || 'LU';
      const icon192 = buildAppIconDataUrl(192, initials);
      const icon512 = buildAppIconDataUrl(512, initials);
      const appleLink = document.getElementById('apple-touch-icon');
      if (appleLink && icon192) appleLink.href = icon192;

      const startUrl = location.origin && location.origin !== 'null'
        ? location.origin + location.pathname
        : './index.html';
      const scopeUrl = location.origin && location.origin !== 'null'
        ? location.origin + location.pathname.replace(/[^/]*$/, '')
        : './';

      const manifestObj = {
        id: startUrl,
        name: appName + ' · Match Centre',
        short_name: shortName,
        description: appSub,
        start_url: startUrl,
        scope: scopeUrl,
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#0e1511',
        theme_color: '#0d1410',
        icons: [
          ...(icon192 ? [{ src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' }] : []),
          ...(icon512 ? [
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
            { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
          ] : [])
        ]
      };

      const link = document.getElementById('pwa-manifest');
      if (link) {
        if (manifestBlobUrl) URL.revokeObjectURL(manifestBlobUrl);
        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        manifestBlobUrl = URL.createObjectURL(blob);
        link.href = manifestBlobUrl;
      }
    }

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      const swCode = `
        const CACHE = 'levelup-match-centre-v2';
        self.addEventListener('install', e => {
          self.skipWaiting();
          e.waitUntil(caches.open(CACHE).then(c => c.addAll(['./']).catch(() => {})));
        });
        self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET' || e.request.url.includes('supabase.co')) return;
          e.respondWith(
            fetch(e.request).then(res => {
              const copy = res.clone();
              caches.open(CACHE).then(c => c.put(e.request, copy)).catch(() => {});
              return res;
            }).catch(() => caches.match(e.request))
          );
        });
      `;
      const swUrl = URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }));
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    window.addEventListener('beforeinstallprompt', ev => {
      ev.preventDefault();
      deferredInstallPrompt = ev;
      if (installBtn) installBtn.hidden = false;
      if (installLabel) installLabel.textContent = 'Install App on Phone';
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      if (installBtn) installBtn.hidden = true;
    });

    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      if (installBtn) installBtn.hidden = true;
    }

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const choice = await deferredInstallPrompt.userChoice.catch(() => null);
          if (choice?.outcome === 'accepted') {
            deferredInstallPrompt = null;
            installBtn.hidden = true;
          }
          return;
        }
        setDrawer(false);
        const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const msg = isIos
          ? 'To install as an app on iPhone/iPad: tap the Share icon at the bottom of Safari and choose "Add to Home Screen".'
          : 'To install as an app: open your browser menu (⋮) and tap "Install app" or "Add to Home screen".';
        main.insertAdjacentHTML('afterbegin', `<div role="status" class="notice" style="justify-content:space-between"><span>${msg}</span><button type="button" class="seg" onclick="this.parentElement.remove()">OK</button></div>`);
      });
    }

    const pubShell = document.getElementById('public-shell'), admShell = document.getElementById('admin-shell');
    const drawer = document.getElementById('side-drawer'), backdrop = document.getElementById('drawer-backdrop');

    function setDrawer(open) { drawer.classList.toggle('open', open); backdrop.classList.toggle('open', open); }
    document.getElementById('open-drawer').addEventListener('click', () => setDrawer(true));
    document.getElementById('close-drawer').addEventListener('click', () => setDrawer(false));
    backdrop.addEventListener('click', () => setDrawer(false));
    drawer.addEventListener('click', ev => { if (ev.target.closest('a')) setDrawer(false); });

    function syncShell() {
      setDrawer(false);
      const isAdmin = route().tab === 'admin';
      pubShell.hidden = isAdmin; admShell.hidden = !isAdmin;
      if (isAdmin) {
        document.title = 'Gala control room · Level Up ’26';
        reloadAdmin().catch(err => { statusMsg(err.message || 'Unable to load the control room.', true); app.removeAttribute('aria-busy'); app.innerHTML = admBtn('Try again', 'refresh'); });
      } else {
        if (adminClockInterval) { clearInterval(adminClockInterval); adminClockInterval = null; }
        renderPublic(); refreshPublic();
      }
    }

    document.querySelectorAll('[data-icon]').forEach(el => el.innerHTML = icon(el.dataset.icon));
    main.addEventListener('click', ev => {
      const toggleTmBtn = ev.target.closest('[data-toggle-teammates]');
      if (toggleTmBtn) {
        const tid = toggleTmBtn.dataset.toggleTeammates;
        if (filters.openTeammates.has(tid)) filters.openTeammates.delete(tid);
        else filters.openTeammates.add(tid);
        renderPublic();
        return;
      }
      const selectPlayerBtn = ev.target.closest('[data-select-player]');
      if (selectPlayerBtn) { const pid = selectPlayerBtn.dataset.selectPlayer; filters.selectedPlayer = filters.selectedPlayer === pid ? '' : pid; renderPublic(); return; }
      const el = ev.target.closest('button'); if (!el) return;
      if (el.hasAttribute('data-retry')) refreshPublic();
      if (el.dataset.set) { filters[el.dataset.set] = el.dataset.value; renderPublic(); }
    });
    main.addEventListener('change', ev => { if (ev.target.dataset.filter) { filters[ev.target.dataset.filter] = ev.target.value; renderPublic(); } });
    window.addEventListener('hashchange', syncShell);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && route().tab !== 'admin') refreshPublic(); });

    updatePwaManifest('Level Up ’26', 'Sports & games gala');
    syncShell();
    setInterval(() => { if (!document.hidden && route().tab !== 'admin') refreshPublic(); }, 5000);
  </script>
</body>
</html>
